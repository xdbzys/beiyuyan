,{text:"是寡人之过也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"郑文公向烛之武认错，承认没有及早重用他是自己的过失。",translation:"这是我的过错。",wordTranslation:"的，连接领属定语「寡人」与「过」"},{text:"此则岳阳楼之大观也。",source:"《岳阳楼记》",author:"范仲淹",era:"北宋",context:"总写巴陵胜状之后，点明这就是岳阳楼的壮观景象。",translation:"这就是岳阳楼的壮丽景象。",wordTranslation:"的，连接定语「岳阳楼」与中心语「大观」"}]},{id:"zhi-s2",gloss:"代词，代人、代物、代事，多作宾语",modern:"他 / 她 / 它 / 这件事",scene:"动词或介词之后，指代上文已出现的人、物或事件；译时须先找出它代替的是什么。",usageHint:"高考翻译题常考「补出指代对象」，如「公从之」要译成「听从了他（的建议）」而不是笼统的「听从了」。",examples:[{text:"公从之。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"佚之狐建议派烛之武去见秦君，郑文公采纳。",translation:"郑文公听从了他（佚之狐的建议）。",wordTranslation:"他 / 这件事，代佚之狐的建议"},{text:"爱其子，择师而教之。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈批评人们疼爱孩子却自己耻于从师。",translation:"（人们）疼爱自己的孩子，选择老师来教他。",wordTranslation:"他，代前文的「其子」"},{text:"项王则受璧，置之坐上。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"张良代刘邦向项羽献白璧，项羽收下放在座位上。",translation:"项王接受了白璧，把它放在座位上。",wordTranslation:"它，代白璧"}]},{id:"zhi-s3",gloss:"结构助词，用在主谓之间，取消句子独立性，不译",modern:"不译（把主谓结构变成短语）",scene:"一个本可独立的「主语+谓语」被当作句子的主语、宾语或状语使用时，中间加「之」；翻译时直接按主谓短语译出即可。",usageHint:"识别口诀：「之」后若是动词/形容词且能还原成主谓句，多半是取消独立性，不是「的」。",examples:[{text:"臣之壮也，犹不如人；今老矣，无能为也已。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武推辞出使，自陈壮年尚且不如别人，如今年老更无所作为。",translation:"我壮年的时候，尚且不如别人；现在老了，不能干什么了。",wordTranslation:"不译，用在主谓「臣壮」之间，取消独立性作时间状语"},{text:"行李之往来，共其乏困，君亦无所害。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武劝秦伯留下郑国作东方道上的主人，供给使者所需。",translation:"出使的人来来往往，（郑国）供给他们缺少的东西，对您也没有什么害处。",wordTranslation:"不译，用在主谓「行李往来」之间，取消独立性"},{text:"邻之厚，君之薄也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武指出灭郑只会使晋国变强、秦国相对变弱。",translation:"邻国（晋国）势力雄厚了，就是您秦国势力削弱了。",wordTranslation:"不译，两处「之」都用在主谓之间；全句为判断句"}]}],flexUsage:{has:!0,types:["虚词实化为动词"],items:[{type:"动词，到……去、往",text:"项伯乃夜驰之沛公军，私见张良，具告以事。",source:"《鸿门宴》",explanation:"「之沛公军」即「到沛公的军营去」。教材常把「之」的动词义与《郑人买履》「至之市，而忘操之」并举；这是虚词实化，不是词类活用，备考时按一词多义记。"}]},ancientModern:{has:!0,items:[{ancient:"结构助词「之」可连接定语与中心语，相当于「的」",modern:"现代汉语改用「的」，「之」只保留在成语与书面语（如「千里之外」）中",text:"古之学者必有师。",source:"《师说》",explanation:"文言里「之」是唯一常用的定语标记；现代口语已不说「古之学者」。"},{ancient:"「之」常作第三人称代词宾语",modern:"现代汉语改用「他 / 它」，「之」作代词限于「取而代之」等固定说法",text:"公从之。",source:"《烛之武退秦师》",explanation:"代词用法萎缩，是虚词古今差异的典型。"}]},relatedPatterns:["judgment","obj-front","attrib-post"]},{id:"qi",char:"其",pinyin:"qí",category:"虚词",summary:"主要作代词（他的/他们的、那、其中），也作语气副词表推测、反问、祈使；不代第二人称是常考点。",senses:[{id:"qi-s1",gloss:"人称代词，他（们）的、它（们）的，作领属定语",modern:"他的 / 他们的 / 它的",scene:"名词前表示领属；必须先回指上文的先行词，不能凭空译。",usageHint:"注意「其」一般不作第二人称「你的」；「尔其无忘乃父之志」里「你的」由「乃」承担。",examples:[{text:"爱其子，择师而教之。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈写世人疼爱子女、为子女择师。",translation:"（人们）疼爱自己的孩子，选择老师来教他。",wordTranslation:"自己的 / 他的，指前文「人」的孩子"},{text:"行李之往来，共其乏困，君亦无所害。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武说保留郑国可供给秦国使者旅途所需。",translation:"出使的人来来往往，（郑国）供给他们缺少的东西，对您也没有什么害处。",wordTranslation:"他们的，代「行李」（出使的使者）"},{text:"吾令人望其气，皆为龙虎，成五采，此天子气也。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增以望气之说劝项羽趁早除掉刘邦。",translation:"我派人观望他那边的云气，都是龙虎的形状，呈五彩，这是天子的云气啊。",wordTranslation:"他的，指刘邦（驻地）"}]},{id:"qi-s2",gloss:"语气副词，表推测「大概」、反问「难道」、祈使或商量「还是、可要」",modern:"大概 / 难道 / 还是 / 可要、一定",scene:"句首或谓语前，不充当句子成分；要结合句末语气词判断：配「乎」多为推测，配「也欤」多为反问，配祈使句多为「可要」。",usageHint:"这是虚词里最容易丢分的一项：看到「其」后面是完整谓语且不作定语，就往语气副词上想。",examples:[{text:"圣人之所以为圣，愚人之所以为愚，其皆出于此乎？",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈推测圣人与愚人的分野都源于是否从师。",translation:"圣人之所以成为圣人，愚人之所以成为愚人，大概都出于这个原因吧？",wordTranslation:"大概，表推测语气"},{text:"吾其还也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"晋文公权衡利弊后决定撤军回国。",translation:"我们还是回去吧。",wordTranslation:"还是，表商量、希望语气"},{text:"与尔三矢，尔其无忘乃父之志！",source:"《五代史伶官传序》",author:"欧阳修",era:"北宋",context:"晋王临终把三支箭交给庄宗，叮嘱他勿忘三桩遗恨。",translation:"给你三支箭，你可不要忘记你父亲的志向！",wordTranslation:"可要、一定，表祈使与期望语气"}]},{id:"qi-s3",gloss:"指示代词，那、那些、其中的、自己的",modern:"那 / 那些 / 其中 / 自己的",scene:"指代上文提到的事或范围，或强调「自身所属」；译时补出「那件事」「那些」「自己的」。",usageHint:"与 S1 的区别：S1 指具体人或物，S3 指事情、范围或反身领属。",examples:[{text:"越国以鄙远，君知其难也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武指出越过别国把远方郑国当边邑很难办到。",translation:"越过别国而把远方的郑国当作边邑，您知道那是很困难的。",wordTranslation:"那，指代「越国以鄙远」这件事"},{text:"惑而不从师，其为惑也，终不解矣。",source:"《师说》",author:"韩愈",era:"唐",context:"开篇论证：有疑惑却不从师，疑惑就永远解不开。",translation:"有了疑惑却不跟从老师学习，那些成为疑惑的问题，就始终不能解决了。",wordTranslation:"那些，指示代词"},{text:"失其所与，不知；以乱易整，不武。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"晋文公拒绝子犯袭击秦军，列举不仁、不智、不武三条理由。",translation:"失掉自己的同盟者，是不明智的；用混乱相攻取代联合一致，是不勇武的。",wordTranslation:"自己的，与「所与」构成「自己所结交的（同盟）」"}]}],flexUsage:{has:!1,types:[],items:[]},ancientModern:{has:!0,items:[{ancient:"「其」可作语气副词，表推测、反问、祈使",modern:"现代「其」只作代词（其他、其中），语气副词用法完全消失",text:"其皆出于此乎？",source:"《师说》",explanation:"今人若按代词理解成「它都出于此」就译错；这是虚词古今差异的高频考点。"}]},relatedPatterns:["judgment"]},{id:"er",char:"而",pinyin:"ér",category:"虚词",summary:"以连词为主：表转折、修饰、承接；另可通「尔」作第二人称代词。判断依据是「而」前后两个成分的关系。",senses:[{id:"er-s1",gloss:"连词，表转折，译「却、但是」",modern:"却 / 但是 / 反而",scene:"前后语义相反或出乎预期；常与「非」「虽」等呼应，或直接连接两个相反的结果。",usageHint:"「青，取之于蓝，而青于蓝」是最经典的转折例：从蓝草提取，颜色却更深。",examples:[{text:"青，取之于蓝，而青于蓝；冰，水为之，而寒于水。",source:"《劝学》",author:"荀子",era:"先秦",context:"荀子以靛青与冰为喻，说明学习可以使人超越原本的状态。",translation:"靛青是从蓝草中提取的，却比蓝草更青；冰是水凝结成的，却比水更冷。",wordTranslation:"却，两处「而」都表转折"},{text:"今之众人，其下圣人也亦远矣，而耻学于师。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈对比古之圣人与今之众人，批评后者以从师为耻。",translation:"现在的一般人，他们（才智）低于圣人很远，却以向老师学习为耻。",wordTranslation:"却，表转折"},{text:"因人之力而敝之，不仁；失其所与，不知；以乱易整，不武。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"晋文公说明不袭击秦军的三条理由，第一句是「靠了别人的力量反而损害他」。",translation:"依靠别人的力量却反过来损害他，是不仁义的；失掉自己的同盟者，是不明智的；用混乱相攻取代联合一致，是不勇武的。",wordTranslation:"却、反而，表转折（该篇教材注明确标为转折连词）"}]},{id:"er-s2",gloss:"连词，表修饰，连接状语与中心语，译「地」或不译",modern:"地 / 不译（状语标志）",scene:"「而」前是时间、方式、状态等修饰成分，后是主要动作；删掉「而」句意不变，只是语气不同。",usageHint:"与承接的区别：修饰的两项有主次（前修饰后），承接的两项是先后发生的两个动作。",examples:[{text:"吾尝终日而思矣，不如须臾之所学也。",source:"《劝学》",author:"荀子",era:"先秦",context:"荀子以「整天空想不如片刻学习」论证学习的重要性。",translation:"我曾经整天地思索，却不如片刻学到的东西（收获大）。",wordTranslation:"地，「终日」修饰「思」，表修饰"},{text:"吾尝跂而望矣，不如登高之博见也。",source:"《劝学》",author:"荀子",era:"先秦",context:"紧承上句，用「踮脚远望不如登高看得广」作第二组比喻。",translation:"我曾经踮起脚跟远望，却不如登到高处看得广阔。",wordTranslation:"不译，「跂」（踮脚）是「望」的方式，表修饰"},{text:"于是饮酒乐甚，扣舷而歌之。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"赤壁夜游，酒酣之际敲着船舷唱起歌来。",translation:"在这时（大家）喝得很高兴，敲着船舷唱起歌来。",wordTranslation:"不译，「扣舷」是「歌」的伴随动作，表修饰"}]},{id:"er-s3",gloss:"连词，表承接，译「就、然后、接着」",modern:"就 / 然后 / 接着",scene:"连接先后发生的两个动作或事态，顺序不可颠倒。",usageHint:"该篇教材把「今急而求子」「朝济而夕设版焉」都注为顺承，是判别承接的现成依据。",examples:[{text:"吾不能早用子，今急而求子，是寡人之过也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"郑文公向烛之武道歉：先前不重用，危急了才来求他。",translation:"我早先没有重用您，现在危急了才来求您，这是我的过错。",wordTranslation:"才、就，表顺承（教材注「才，连词，表顺承」）"},{text:"朝济而夕设版焉，君之所知也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武举晋惠公背约旧事，提醒秦伯晋国不可信。",translation:"（晋惠公）早上渡过黄河回国，晚上就修筑防御工事，这是您知道的。",wordTranslation:"就，连接先后两件事，表承接"},{text:"籍吏民、封府库而待将军。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦向项伯解释自己入关后登记吏民、封存府库，专等项羽到来。",translation:"登记官吏百姓、封存府库，来等待将军（到来）。",wordTranslation:"然后、来，表动作先后与目的"}]}],flexUsage:{has:!0,types:["通假实化为代词"],items:[{type:"通「尔」，第二人称代词「你的」",text:"妪每谓余曰：“某所，而母立于兹。”",source:"《项脊轩志》",explanation:"「而母」即「你的母亲」。这是「而」由连词通假为代词的特例，教材与虚词表均列为常考点。"}]},ancientModern:{has:!0,items:[{ancient:"「而」可通「尔」表示「你、你的」",modern:"现代「而」只作连词，不再作人称代词",text:"某所，而母立于兹。",source:"《项脊轩志》",explanation:"若按今义把「而母」当作连词会完全读不通。"},{ancient:"「而」表修饰时可不译",modern:"现代汉语要用「地」或状语语序把修饰关系显性化",text:"吾尝终日而思矣。",source:"《劝学》",explanation:"古今语序与虚词使用习惯差异。"}]},relatedPatterns:["fixed"]},{id:"yi",char:"以",pinyin:"yǐ",category:"虚词",summary:"用法最杂的高频虚词：介词「因为/用/把/凭借」、连词「来、用来」，还可作动词「认为」。",senses:[{id:"yi-s1",gloss:"介词，表原因，译「因为、由于」",modern:"因为 / 由于",scene:"后接原因或事由，多置于句首或谓语前；常与「故」呼应。",usageHint:"「以其无礼于晋」同时是状语后置句，翻译时要还原成「因为（郑国）对晋国无礼」。",examples:[{text:"九月甲午，晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"开篇交代秦晋围郑的两条理由。",translation:"九月甲午日，晋文公、秦穆公包围郑国，因为郑国曾对晋国无礼，并且从属晋国的同时又从属楚国。",wordTranslation:"因为，引出围郑的原因"},{text:"臣以险衅，夙遭闵凶。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密开篇自述身世坎坷，为辞官奉养祖母作铺垫。",translation:"我因为命运不好，很早就遭遇了不幸。",wordTranslation:"因为，表原因"},{text:"臣以供养无主，辞不赴命。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密说明前次被举荐却未赴任的缘由。",translation:"我因为（祖母）无人照料供养，就辞谢没有赴任。",wordTranslation:"因为，表原因"}]},{id:"yi-s2",gloss:"介词，译「用、拿、凭借、把」",modern:"用 / 拿 / 凭借 / 把",scene:"引出工具、依据、凭借或处置对象；后接名词或名词性短语。",usageHint:"该篇教材逐句标注了「敢以烦执事（拿）」「若舍郑以为东道主（把）」，是最可靠的一组判别例。",examples:[{text:"若亡郑而有益于君，敢以烦执事。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武见秦伯，先以退为进，说若灭郑对秦有利才敢来麻烦您。",translation:"如果灭掉郑国对您有好处，怎敢拿这件事来麻烦您（手下的人）。",wordTranslation:"拿、用，介词（教材注「拿，来，介词」）"},{text:"若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武提出存郑对秦有利的方案。",translation:"如果放弃围攻郑国而把它作为东方道路上招待过客的主人，出使的人来来往往，（郑国）供给他们缺少的东西，对您也没有什么害处。",wordTranslation:"把，「以为」即「以（之）为」，省略宾语（教材注「把，介词」）"},{text:"拜为上卿，以勇气闻于诸侯。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"介绍廉颇因战功被拜为上卿，以勇武闻名各国。",translation:"（廉颇）被任命为上卿，凭借勇气在诸侯中闻名。",wordTranslation:"凭借，引出凭依；「于诸侯」是状语后置"}]},{id:"yi-s3",gloss:"连词，表目的或结果，译「来、用来、以致」",modern:"来 / 用来 / 以便",scene:"连接两个动作，前项是手段、后项是目的；译时可在「以」处补出「来」。",usageHint:"与 S2 区分：S2 后接名词（介词），S3 后接动词或动词性短语（连词）。",examples:[{text:"焉用亡郑以陪邻？",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武反问：灭郑只会给邻国晋国增加土地，对秦何益。",translation:"为什么要灭掉郑国来给邻国增加（土地）呢？",wordTranslation:"来，表目的（教材注「表顺承，连词」）"},{text:"阙秦以利晋，惟君图之。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武收束说辞：削弱秦国而使晋国得利，请秦伯权衡。",translation:"使秦国土地减损来让晋国获利，希望您考虑这件事。",wordTranslation:"来、从而，连接手段与结果"},{text:"余嘉其能行古道，作《师说》以贻之。",source:"《师说》",author:"韩愈",era:"唐",context:"文末交待写作缘起：赞许李蟠能行古人从师之道。",translation:"我赞许他能实行古人（从师）的道理，写了《师说》来赠送给他。",wordTranslation:"来、用来，表目的"}]}],flexUsage:{has:!0,types:["虚词实化为动词"],items:[{type:"动词，认为",text:"皆以美于徐公。",source:"《邹忌讽齐王纳谏》",explanation:"「以」作动词「认为」，后接主谓短语（省略了「臣」）。教材注为「皆以（臣）美于徐公」；同一用法见《谏逐客书》「窃以为过矣」。"}]},ancientModern:{has:!0,items:[{ancient:"「以」可单独作介词「因为/把/凭借」和连词「来」",modern:"现代汉语分别改用「因为、把、凭、来」等词，「以」只留在「以为、所以、以……为」等凝固形式中",text:"臣以供养无主，辞不赴命。",source:"《陈情表》",explanation:"若按今义「以」常被误读为「用」，造成整句译错。"}]},relatedPatterns:["adv-post","ellipsis"]},{id:"yu",char:"于",pinyin:"yú",category:"虚词",summary:"介词，主要引出处所（在/从/到）、比较对象（比）、施事或对象（被/对/向）。介词结构常后置，构成状语后置句。",senses:[{id:"yu-s1",gloss:"介词，引出时间或处所，译「在、从、到」",modern:"在 / 从 / 到",scene:"动词后接「于+处所/时间」，文言里这个介宾短语通常后置，翻译时须提到动词前。",usageHint:"这一义项几乎总与「状语后置」同时出现，是翻译题的必考点。",examples:[{text:"壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"开篇交待夜游赤壁的时间与地点。",translation:"壬戌年秋天，七月十六日，苏先生和客人在赤壁之下乘船游览。",wordTranslation:"在，「于赤壁之下」后置作状语"},{text:"少焉，月出于东山之上，徘徊于斗牛之间。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"写月亮升起、在斗宿牛宿之间移动。",translation:"不一会儿，月亮从东山之上升起，在斗宿和牛宿之间徘徊。",wordTranslation:"从（第一处）、在（第二处），引出起点与处所"},{text:"永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。",source:"《兰亭集序》",author:"王羲之",era:"东晋",context:"兰亭集会开篇，交待时间地点与修禊之事。",translation:"永和九年，岁在癸丑，暮春初，（我们）在会稽山阴的兰亭聚会，举行修禊活动。",wordTranslation:"在，「于会稽山阴之兰亭」后置"}]},{id:"yu-s2",gloss:"介词，形容词后引出比较对象，译「比」",modern:"比 / 比……更",scene:"「形容词 + 于 + 比较对象」，是文言比较句的标准格式。",usageHint:"与 S1 区分：看「于」前是形容词还是动词；「青于蓝」「贤于弟子」都是比较。",examples:[{text:"青，取之于蓝，而青于蓝；冰，水为之，而寒于水。",source:"《劝学》",author:"荀子",era:"先秦",context:"以靛青与冰设喻说明后天学习可超越本源。",translation:"靛青从蓝草中提取，却比蓝草更青；冰由水凝结而成，却比水更冷。",wordTranslation:"比；注意同一句中「取之于蓝」的「于」是「从」，「青于蓝」「寒于水」的「于」才是「比」"},{text:"师不必贤于弟子，闻道有先后，术业有专攻，如是而已。",source:"《师说》",author:"韩愈",era:"唐",context:"论证师生关系可以互相转换。",translation:"老师不一定比弟子贤能，懂得道理有早有晚，学问技艺各有专门研究，如此罢了。",wordTranslation:"比，引出比较对象「弟子」"},{text:"良曰：“长于臣。”",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦问项伯与张良谁年长，张良回答项伯比自己大。",translation:"张良说：「（项伯）比我年长。」",wordTranslation:"比，形容词「长」后引出比较对象"}]},{id:"yu-s3",gloss:"介词，引出施事或动作对象，译「被、对、向」",modern:"被 / 对 / 向",scene:"主语是动作承受者时为被动；引出交谈、结交对象时译「对、向、跟」。",usageHint:"「见……于……」「受……于……」是被动的固定格式；「不拘于时」是无「见」字的「于」字被动句。",examples:[{text:"不拘于时，学于余。",source:"《师说》",author:"韩愈",era:"唐",context:"文末赞李蟠不受时俗束缚、向自己求学。",translation:"（李蟠）不被时俗拘束，向我学习。",wordTranslation:"被（第一处）、向（第二处），同一句兼两种用法"},{text:"夫赵强而燕弱，而君幸于赵王，故燕王欲结于君。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"缪贤转述蔺相如分析燕王为何愿意结交自己。",translation:"赵国强而燕国弱，而您被赵王宠幸，所以燕王想跟您结交。",wordTranslation:"被（「幸于赵王」）、跟（「结于君」）"},{text:"臣诚恐见欺于王而负赵，故令人持璧归，间至赵矣。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如在秦廷向秦王说明已把和氏璧送回赵国。",translation:"我实在担心被大王欺骗而对不起赵国，所以派人带着璧回去，从小路回到赵国了。",wordTranslation:"被，「见……于……」被动格式"}]}],flexUsage:{has:!1,types:[],items:[]},ancientModern:{has:!0,items:[{ancient:"介宾短语常置于动词之后（「游于赤壁之下」）",modern:"现代汉语状语必须放在动词之前（「在赤壁之下游览」）",text:"苏子与客泛舟游于赤壁之下。",source:"《赤壁赋》",explanation:"语序差异属「古今异义」中的语法差异，翻译题必须调序。"}]},relatedPatterns:["adv-post","passive"]},{id:"nai",char:"乃",pinyin:"nǎi",category:"虚词",summary:"副词为主：表承接「于是、就、才」，表出乎意料「竟然、却」；另可作判断副词与「你的」代词。",senses:[{id:"nai-s1",gloss:"副词，表承接，译「于是、就、才」",modern:"于是 / 就 / 才",scene:"前后两事相继发生，或强调条件具备之后才发生；常紧接前句的时间或条件。",usageHint:"「公乃入」是「才」的典型：先等我回到军中，你再进去。",examples:[{text:"项伯乃夜驰之沛公军，私见张良，具告以事。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项伯念及张良救命之恩，连夜赶去报信。",translation:"项伯于是连夜骑马赶到沛公的军营，私下会见张良，把事情全告诉了他。",wordTranslation:"于是、就，表承接"},{text:"良乃入，具告沛公。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"张良安排好项伯后进去把消息禀告刘邦。",translation:"张良于是进去，把情况详细告诉了沛公。",wordTranslation:"于是、就，表承接"},{text:"见渔人，乃大惊，问所从来。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"桃花源中人见到闯入的渔人非常吃惊，问他从哪儿来。",translation:"（桃花源里的人）看见渔人，于是非常吃惊，问他是从哪里来的。",wordTranslation:"于是、就，表承接；句首省略主语"},{text:"度我至军中，公乃入。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦抄小路逃走前叮嘱张良估算时间再进帐谢罪。",translation:"估计我回到军中了，您才进去。",wordTranslation:"才，强调条件满足之后"}]},{id:"nai-s2",gloss:"副词，表出乎意料，译「竟然、却」",modern:"竟然 / 却 / 反而",scene:"事实与预期相反，带惊讶或讽刺语气；常与「反」「不知」等搭配。",usageHint:"「乃不知有汉」若误译成「于是不知道有汉朝」就完全失去原文的惊讶意味。",examples:[{text:"问今是何世，乃不知有汉，无论魏晋。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"桃花源中人自秦避乱，与世隔绝，连汉朝都不知道。",translation:"（他们）问现在是什么朝代，竟然不知道有过汉朝，更不必说魏和晋了。",wordTranslation:"竟然，表出乎意料"},{text:"巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈讽刺士大夫之族的见识反而不如被他们看不起的工匠。",translation:"巫医、乐师和各种工匠，君子们不屑一提，如今他们的见识竟反而赶不上（这些人），真是奇怪啊！",wordTranslation:"竟、反而，与「反」呼应表意外"},{text:"今君乃亡赵走燕，燕畏赵，其势必不敢留君，而束君归赵矣。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如劝缪贤不要逃往燕国，分析燕国必不敢收留。",translation:"如今您竟然从赵国逃到燕国去，燕国畏惧赵国，按情势一定不敢收留您，反而会把您捆起来送回赵国。",wordTranslation:"竟然、却，表转折与意外"}]}],flexUsage:{has:!0,types:["虚词实化为代词 / 判断副词"],items:[{type:"第二人称代词，你的",text:"与尔三矢，尔其无忘乃父之志！",source:"《五代史伶官传序》",explanation:"「乃父」即「你的父亲」。「乃」由副词转为代词，是虚词实化的常考点。"},{type:"判断副词，是、就是",text:"吾闻二世少子也，不当立，当立者乃公子扶苏。",source:"《陈涉世家》",explanation:"「乃」用在名词性谓语前起判断作用，相当于「是」；教材与虚词表均把「当立者乃公子扶苏」列为判断副词例。"}]},ancientModern:{has:!0,items:[{ancient:"「乃」可作副词「于是 / 竟然」、代词「你的」、判断副词「就是」",modern:"现代汉语「乃」几乎只作书面语判断词「乃是」，其余用法消失",text:"见渔人，乃大惊，问所从来。",source:"《桃花源记》",explanation:"按今义容易把「乃」误当判断词，译作「就是」，属高频误译。"}]},relatedPatterns:["judgment","ellipsis"]},{id:"wei",char:"为",pinyin:"wéi / wèi",category:"虚词",summary:"兼类词：读 wéi 作动词「做、作为、是」或被动标志，读 wèi 作介词「替、给、为了」。读音与词性联动。",senses:[{id:"wei-s1",gloss:"动词（wéi），做、作为、成为、是",modern:"做 / 作为 / 成为 / 是",scene:"在句中充当谓语，后接名词或名词性短语；译时按上下文选「做」「作为」或判断词「是」。",usageHint:"该篇教材把「无能为也已」的「为」注为「做」，把「以为东道主」注为「作为」，可作判别依据。",examples:[{text:"臣之壮也，犹不如人；今老矣，无能为也已。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武推辞出使，自称年老无能。",translation:"我壮年的时候尚且不如别人；现在老了，不能做什么了。",wordTranslation:"做，动词（教材注「为，做」）"},{text:"若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武提出保留郑国、让它做秦国东道上的主人。",translation:"如果放弃围攻郑国而把它作为东方道路上招待过客的主人，出使的人来来往往，供给他们缺少的东西，对您也没有害处。",wordTranslation:"作为，「以（之）为」的「为」，动词"},{text:"如今人方为刀俎，我为鱼肉。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙劝刘邦不必告辞、赶紧脱身，说现在形势任人宰割。",translation:"如今人家正是刀和砧板，我们是（砧板上的）鱼和肉。",wordTranslation:"是，动词表判断（判断句）"}]},{id:"wei-s2",gloss:"介词（wèi），替、给、向、为了",modern:"替 / 给 / 为了",scene:"后接动作受益或关涉的对象，构成介宾短语修饰动词；读 wèi。",usageHint:"《鸿门宴》里「为」密集出现，是区分 wéi / wèi 最好的一组例句。",examples:[{text:"张良曰：“谁为大王为此计者？”",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"张良追问是谁给刘邦出了「距关毋内诸侯」的主意。",translation:"张良说：「是谁替大王出这个计策的？」",wordTranslation:"替、给（第一个「为」读 wèi；第二个「为此计」的「为」是动词「出、定」）"},{text:"君为我呼入，吾得兄事之。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦请张良把项伯请进来，要像兄长一样待他。",translation:"您替我把他叫进来，我要像对待兄长那样侍奉他。",wordTranslation:"替、给，介词"},{text:"臣为韩王送沛公，沛公今事有急，亡去不义，不可不语。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"张良拒绝跟项伯一起逃走，说明自己受托护送刘邦。",translation:"我替韩王护送沛公，如今沛公遇上急难，私自逃走是不义的，不能不告诉他。",wordTranslation:"替、给，介词"}]},{id:"wei-s3",gloss:"介词（wéi）表被动，常与「所」构成「为……所……」，译「被」",modern:"被",scene:"主语是动作承受者，「为」后是施事者（可省略）；「为所」是「为……所……」的省略式。",usageHint:"「为」表被动时读 wéi，与 S2 的 wèi 不同；「吾属今为之虏矣」中「之」是施事。",examples:[{text:"不者，若属皆且为所虏！",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增命项庄舞剑刺杀刘邦，警告不成功的话众人都会被俘。",translation:"不这样的话，你们这些人都将被（他）俘虏！",wordTranslation:"被，「为所」即「为……所……」省略施事"},{text:"吾属今为之虏矣！",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增摔碎玉斗，断言将来夺天下的一定是刘邦。",translation:"我们如今要被他俘虏了！",wordTranslation:"被，「为」引出施事「之」（指刘邦）"},{text:"身死人手，为天下笑者，何也？",source:"《过秦论》",author:"贾谊",era:"西汉",context:"《过秦论》上篇结尾追问秦迅速灭亡的原因。",translation:"（秦王子婴）死在别人手里，被天下人耻笑，这是为什么呢？",wordTranslation:"被，「为」引出施事「天下」；该句是查字典语文网所引被动句例"}]}],flexUsage:{has:!0,types:["动词虚化为介词","名词用作动词"],items:[{type:"动词虚化为表被动的介词",text:"不者，若属皆且为所虏！",source:"《鸿门宴》",explanation:"「为」本是动词「做」，虚化后引出施事表被动，是实词虚化的典型链条。"},{type:"名词用作动词，筑坛（结盟）",text:"为坛而盟，祭以尉首。",source:"《陈涉世家》",explanation:"「为坛」即「筑起高台」，名词「坛」前「为」作动词；「祭以尉首」同时是状语后置。"}]},ancientModern:{has:!0,items:[{ancient:"「为」读 wéi 可直接作判断词「是」",modern:"现代汉语判断用「是」，「为」只留在「认为、成为、作为」等复合词",text:"如今人方为刀俎，我为鱼肉。",source:"《鸿门宴》",explanation:"把「我为鱼肉」按今义读成「为了鱼肉」会闹笑话。"}]},relatedPatterns:["judgment","passive","fixed"]},{id:"ze",char:"则",pinyin:"zé",category:"虚词",summary:"连词为主：表条件结果「就、那么」，表转折「却」；也可作判断副词「就是」。",senses:[{id:"ze-s1",gloss:"连词，表承接或条件结果，译「就、那么」",modern:"就 / 那么 / 便",scene:"前项是条件或原因，后项是结果；常用于排比、对偶句中，前后格式一致。",usageHint:"「受绳则直」「就砺则利」两句结构相同，是判别这一义项最直观的依据。",examples:[{text:"故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。",source:"《劝学》",author:"荀子",era:"先秦",context:"荀子用木材经墨线校正、刀剑经磨石打磨，类比广泛学习并每日自省的效果。",translation:"所以木材经墨线量过就取直，金属刀具在磨刀石上磨过就锋利，君子广泛学习并且每天检查省察自己，就智慧明达而行为没有过错了。",wordTranslation:"就、那么，三处「则」都表条件结果"},{text:"孔子曰：三人行，则必有我师。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈引孔子语论证「圣人无常师」。",translation:"孔子说：几个人一起走路，其中就一定有可以当我老师的人。",wordTranslation:"就、便，表条件结果"},{text:"位卑则足羞，官盛则近谀。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈转述士大夫之族嘲笑从师者的说辞。",translation:"（以）地位低的人为师就足以感到羞耻，（以）官职高的人为师就近乎谄媚。",wordTranslation:"就，两个「则」构成对举的条件结果句"}]},{id:"ze-s2",gloss:"连词，表转折，译「却、可是」",modern:"却 / 可是 / 反而",scene:"前后语义相反，尤其用于「本该如此却不是这样」的对比；常出现在「欲……则……」结构里。",usageHint:"与 S1 区分：看后项是顺着前项推出，还是与前项相悖。",examples:[{text:"爱其子，择师而教之；于其身也，则耻师焉，惑矣。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈指出人们为孩子择师、自己却耻于从师的自相矛盾。",translation:"（人们）疼爱自己的孩子，选择老师来教他；对于自己，却以从师为耻，真是糊涂啊。",wordTranslation:"却，表转折对比"},{text:"臣欲奉诏奔驰，则刘病日笃，欲苟顺私情，则告诉不许：臣之进退，实为狼狈。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密陈述想赴任又必须奉养祖母的两难处境。",translation:"我想奉诏急速赴任，可是祖母刘氏的病一天比一天重；想暂且顺从私情，可是申诉又不被允许：我的进退实在十分狼狈。",wordTranslation:"可是、却，两处「则」都表转折"},{text:"今取人则不然，不问可否，不论曲直，非秦者去，为客者逐。",source:"《谏逐客书》",author:"李斯",era:"秦",context:"李斯对比秦王对珍宝与对人才的不同态度，指出逐客之失。",translation:"如今选用人才却不是这样，不问可用与否，不论是非曲直，不是秦国人就赶走，是客卿就驱逐。",wordTranslation:"却，与前文「取物」的态度形成转折对比"}]}],flexUsage:{has:!0,types:["连词用作判断副词"],items:[{type:"副词，就是、乃是（表判断）",text:"此则岳阳楼之大观也。",source:"《岳阳楼记》",explanation:"「则」用在名词性谓语前加强判断语气，与句末「也」呼应；查字典语文网把「则」列为判断句标志词之一。"}]},ancientModern:{has:!0,items:[{ancient:"「则」可作判断副词「就是」",modern:"现代「则」只作连词（表承接或对比），判断义由「是 / 就是」承担",text:"此则岳阳楼之大观也。",source:"《岳阳楼记》",explanation:"按今义把「则」当连词译「就」，会丢掉判断语气。"}]},relatedPatterns:["judgment"]},{id:"suo",char:"所",pinyin:"suǒ",category:"虚词",summary:"助词：与动词结合构成名词性短语「……的人/事/物」；「所以」表原因或凭藉；与「为」配合构成被动。",senses:[{id:"suo-s1",gloss:"助词，「所 + 动词」构成名词性短语，译「……的人 / 事 / 物 / 地方」",modern:"……的（人、事、物、地方）",scene:"「所」后必是动词（或动词性短语），整个短语在句中作主语、宾语；「无所」「有所」是固定搭配。",usageHint:"译时务必补出中心词：「所存」＝「存在的地方」，「无所取」＝「没有拿取的东西」。",examples:[{text:"是故无贵无贱，无长无少，道之所存，师之所存也。",source:"《师说》",author:"韩愈",era:"唐",context:"提出择师标准：道理存在的地方就是老师所在的地方。",translation:"因此无论地位高低贵贱、年纪大小，道理存在的地方，就是老师所在的地方。",wordTranslation:"……的地方，「所存」由动词转为名词性短语"},{text:"今入关，财物无所取，妇女无所幸",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增从刘邦入关后的克制推断他志向不小。",translation:"如今（刘邦）入关后，财物没有拿取的，妇女没有宠幸的。",wordTranslation:"……的东西 / ……的人，「无所取」「无所幸」是「无所 + 动词」固定式"},{text:"若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武劝秦保留郑国，说对秦毫无害处。",translation:"如果放弃围攻郑国而把它作为东道主，使者往来，（郑国）供给他们缺少的东西，您也没有什么害处。",wordTranslation:"……的（害处），「无所害」即「没有受害的地方」"}]},{id:"suo-s2",gloss:"固定结构「所以」，译「……的原因」或「用来……的（方法、凭借）」",modern:"……的原因 / 用来……的",scene:"两种读法要看上下文：后接「者，……也」多为「……的原因」；后接动作或「传道受业」类多为「用来……的」。",usageHint:"与现代汉语表结果的连词「所以」完全不同，属典型古今异义，是翻译题必考点。",examples:[{text:"师者，所以传道受业解惑也。",source:"《师说》",author:"韩愈",era:"唐",context:"开篇给「师」下定义，说明教师的职能。",translation:"老师，是用来传授道理、教授学业、解答疑难问题的人。",wordTranslation:"用来……的，「所以」表凭借、职能（判断句）"},{text:"圣人之所以为圣，愚人之所以为愚，其皆出于此乎？",source:"《师说》",author:"韩愈",era:"唐",context:"推测圣愚之别的原因都在于是否从师。",translation:"圣人之所以成为圣人，愚人之所以成为愚人，大概都出于这个原因吧？",wordTranslation:"……的原因，「所以」表原因"},{text:"所以遣将守关者，备他盗之出入与非常也。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦向项伯解释派兵守函谷关的用意。",translation:"派遣将领把守关口的原因，是防备其他盗贼出入和意外变故。",wordTranslation:"……的原因，「所以……者，……也」是表原因的固定句式"}]}],flexUsage:{has:!0,types:["助词与介词配合构成被动"],items:[{type:"「为……所……」被动标志",text:"不者，若属皆且为所虏！",source:"《鸿门宴》",explanation:"「所」与「为」呼应构成被动式，「为所」是省略施事的紧缩形式；同式见《童趣》「舌一吐而二虫尽为所吞」。"}]},ancientModern:{has:!0,items:[{ancient:"「所以」＝「……的原因」或「用来……的」",modern:"现代「所以」是表结果的连词",text:"师者，所以传道受业解惑也。",source:"《师说》",explanation:"按今义译成「因为……所以」会让整句不通；这是最经典的古今异义之一。"},{ancient:"「所 + 动词」把动词短语转成名词性成分",modern:"现代汉语须补出「……的人 / 东西 / 地方」",text:"道之所存，师之所存也。",source:"《师说》",explanation:"「所」的名词化功能在现代汉语里已由「的」字结构承担。"}]},relatedPatterns:["passive","judgment","fixed"]},{id:"zhe",char:"者",pinyin:"zhě",category:"虚词",summary:"助词三用：构成「……的人/事」的名词性成分、判断句与句中停顿的语气标志、定语后置的标志。",senses:[{id:"zhe-s1",gloss:"代词性助词，附在动词/形容词/短语后，译「……的人（事、物）」",modern:"……的人 / ……的事 / ……的东西",scene:"「者」前是动词性或形容词性成分，整个结构在句中作主语或宾语。",usageHint:"「学者」是古义「求学的人」，与今义「有学问的人」构成古今异义，是高考高频陷阱。",examples:[{text:"古之学者必有师。",source:"《师说》",author:"韩愈",era:"唐",context:"开篇立论，说明求学之人必有老师。",translation:"古代求学的人必定有老师。",wordTranslation:"……的人，「学者」＝求学的人（古今异义）"},{text:"缦立远视，而望幸焉；有不见者，三十六年。",source:"《阿房宫赋》",author:"杜牧",era:"唐",context:"写秦宫宫女久久伫立盼望君王临幸，有人终生不得一见。",translation:"（宫女们）久久地站着远望，盼望（君王）宠幸；有（始终）没能被见到的，长达三十六年。",wordTranslation:"……的人，「不见者」指未被召见的宫女"},{text:"闻舟中夜弹琵琶者，听其音，铮铮然有京都声。",source:"《琵琶行》",author:"白居易",era:"唐",context:"《琵琶行》序言交待夜闻琵琶、寻访弹者的缘起。",translation:"听到船中有人在夜里弹琵琶，听那声音，清脆铿锵有京城（长安）的韵味。",wordTranslation:"……的人，「夜弹琵琶者」指弹琵琶的人"}]},{id:"zhe-s2",gloss:"语气助词，用于判断句主语后表提顿，或句中表停顿；「……者，……也」",modern:"不译（表停顿 / 判断语气）",scene:"「者」前是名词性成分（人名、身份、事物），后接「也」或判断性谓语；译时加「是」。",usageHint:"与 S1 区分：S2 前项是名词（「廉颇」「亚父」），S1 前项是动词短语。",examples:[{text:"师者，所以传道受业解惑也。",source:"《师说》",author:"韩愈",era:"唐",context:"给「师」下定义的标准判断句。",translation:"老师，是用来传授道理、教授学业、解答疑难问题的人。",wordTranslation:"不译，主语后表提顿，与句末「也」构成「者……也」判断句"},{text:"廉颇者，赵之良将也。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"列传开篇介绍廉颇身份。",translation:"廉颇，是赵国优秀的将领。",wordTranslation:"不译，「者……也」判断句标志"},{text:"亚父者，范增也。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"鸿门宴座次交待中补明「亚父」即范增。",translation:"亚父，就是范增。",wordTranslation:"不译，「者……也」判断句标志"}]},{id:"zhe-s3",gloss:"定语后置标志，「中心词 + 定语 + 者 / 中心词 + 之 + 定语 + 者」",modern:"不译，翻译时把定语挪回中心词前",scene:"为了强调或使语句顺畅，把修饰语放到名词后面，用「者」收尾；翻译要调序。",usageHint:"识别口诀：名词后还有一段描述性短语且以「者」结尾，多半是定语后置。",examples:[{text:"客有吹洞箫者，倚歌而和之。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"赤壁夜游，有位吹洞箫的客人按着歌声应和。",translation:"有一位吹洞箫的客人，按着歌声伴奏应和。",wordTranslation:"不译，「有吹洞箫者」是「客」的后置定语"},{text:"石之铿然有声者，所在皆是也，而此独以钟名，何哉？",source:"《石钟山记》",author:"苏轼",era:"北宋",context:"苏轼质疑石钟山得名，说能发出铿锵之声的石头到处都是。",translation:"（敲击时）发出铿锵声响的石头，各处都是，唯独这里用「钟」来命名，为什么呢？",wordTranslation:"不译，「之……者」构成定语后置"},{text:"计未定，求人可使报秦者，未得。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"赵王商议是否予秦和氏璧，想找能出使答复秦国的人。",translation:"计策还没定下来，寻找可以出使答复秦国的人，没找到。",wordTranslation:"不译，「可使报秦者」是「人」的后置定语"}]}],flexUsage:{has:!0,types:["动词短语名词化"],items:[{type:"「者」把动词短语转为名词性成分",text:"有不见者，三十六年。",source:"《阿房宫赋》",explanation:"「不见者」由动词短语转为名词性成分，指「始终没能被召见的宫女」；这是「者」最核心的语法功能。"}]},ancientModern:{has:!0,items:[{ancient:"「学者」＝求学的人",modern:"「学者」＝在学术上有一定造诣的人",text:"古之学者必有师。",source:"《师说》",explanation:"文言「学 + 者」是「学习的人」，今义已凝固成专指做学问的人，属典型古今异义。"},{ancient:"「者」可作判断句提顿语气词",modern:"现代汉语判断句直接用「是」，无提顿助词",text:"廉颇者，赵之良将也。",source:"《廉颇蔺相如列传》",explanation:"翻译时必须补出「是」，并处理「者」的停顿。"}]},relatedPatterns:["judgment","attrib-post"]},{id:"bing",char:"兵",pinyin:"bīng",category:"实词",summary:"本义「兵器」，引申为「士兵、军队」，再引申为「军事、战争」；三义常在同一篇里同时出现。",senses:[{id:"bing-s1",gloss:"兵器、武器（本义）",modern:"兵器 / 武器 / 军备",scene:"与「刃」「革」「甲」「利」等搭配，或语境讨论装备是否精良时取本义。",usageHint:"「非兵不利」若误译成「士兵不厉害」，整句论点就错了；看后文「战不善」可知「兵」与「战」对举，指装备。",examples:[{text:"六国破灭，非兵不利，战不善，弊在赂秦。",source:"《六国论》",author:"苏洵",era:"北宋",context:"开篇提出中心论点：六国灭亡不是武器不锋利、仗打得不好，弊病在贿赂秦国。",translation:"六国灭亡，不是（因为）兵器不锋利、仗打得不好，弊病在于贿赂秦国。",wordTranslation:"兵器、武器"},{text:"填然鼓之，兵刃既接，弃甲曳兵而走。",source:"《寡人之于国也》",author:"孟子及其弟子",era:"先秦",context:"孟子用战场上逃兵「五十步笑百步」设喻，回答梁惠王「民不加多」之问。",translation:"咚咚地敲起战鼓，兵器刀锋已经交接，（士兵）扔下铠甲拖着兵器逃跑。",wordTranslation:"兵器，两处「兵」（兵刃、曳兵）都指武器"},{text:"城非不高也，池非不深也，兵革非不坚利也，米粟非不多也，委而去之，是地利不如人和也。",source:"《得道多助，失道寡助》",author:"孟子及其弟子",era:"先秦",context:"孟子论证「地利不如人和」，列举城高、池深、军备足、粮食多却仍弃城而逃。",translation:"城墙不是不高，护城河不是不深，兵器铠甲不是不坚固锋利，粮食不是不多，（守城者）却弃城逃离，这说明地利不如人和。",wordTranslation:"兵器（「兵革」泛指武器装备）"}]},{id:"bing-s2",gloss:"士兵、军队、兵力",modern:"士兵 / 军队 / 兵力",scene:"与数量词（四十万、十万）、「设」「至」「将」等搭配，指人而非器械。",usageHint:"关键看搭配：数词 + 兵 ＝ 兵力；「秦兵又至」＝ 秦国的军队又来了。",examples:[{text:"当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"交待鸿门宴前双方兵力悬殊的形势。",translation:"这时候，项羽的军队四十万，驻在新丰鸿门；沛公的军队十万，驻在霸上。",wordTranslation:"军队、兵力，两处「兵」都接数量词"},{text:"今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵写诸侯割地求和只能换来一夜安睡，秦军随即又来进逼。",translation:"今天割让五座城，明天割让十座城，然后才得到一夜安睡；起身看看四境，秦国的军队又到了。",wordTranslation:"军队"},{text:"秦王竟酒，终不能加胜于赵。赵亦盛设兵以待秦，秦不敢动。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"渑池之会后，赵国严阵以待，秦国不敢轻举妄动。",translation:"秦王直到酒宴结束，始终不能占赵国的上风；赵国也大量部署军队防备秦国，秦国不敢妄动。",wordTranslation:"军队，「盛设兵」即多多部署兵力"}]},{id:"bing-s3",gloss:"军事、战争、武力（抽象引申义）",modern:"军事 / 战争 / 武力",scene:"与「加」「言」「威」「厌」等动词搭配，不指具体器械或人员，指用兵这件事。",usageHint:"「加兵于赵」＝对赵国用兵；「犹厌言兵」＝还厌恶谈起战争。",examples:[{text:"顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如解释自己避让廉颇，是为免将相失和给秦国用兵之机。",translation:"只是我考虑到，强大的秦国不敢对赵国用兵的原因，只因为有我们两人在啊。",wordTranslation:"用兵、发动战争，「加兵于赵」是状语后置"},{text:"故曰：域民不以封疆之界，固国不以山溪之险，威天下不以兵革之利。",source:"《得道多助，失道寡助》",author:"孟子及其弟子",era:"先秦",context:"孟子由「天时不如地利，地利不如人和」推出治国不靠险阻与武力。",translation:"所以说：限制百姓不靠边境的界限，巩固国防不靠山河的险要，威慑天下不靠武器装备的锋利。",wordTranslation:"武力、军备（「兵革之利」指军事力量）"},{text:"自胡马窥江去后，废池乔木，犹厌言兵。",source:"《扬州慢》",author:"姜夔",era:"南宋",context:"姜夔过扬州，写金兵南侵后城池残破，连废池乔木都不愿再提战事。",translation:"自从金兵（的战马）窥视长江、劫掠离去之后，荒废的池苑和古老树木，至今还厌恶谈起战争。",wordTranslation:"战争、战事"}]}],flexUsage:{has:!0,types:["词义引申（非词类活用）"],items:[{type:"本义兵器 → 借代执兵器的人 → 引申为军队",text:"当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。",source:"《鸿门宴》",explanation:"「兵」由器物借代使用者，再抽象为军事。这是文言实词最常见的词义引申链，不是词类活用，备考按「一词多义」记忆。"}]},ancientModern:{has:!0,items:[{ancient:"「兵」常指兵器、武器",modern:"现代「兵」主要指士兵，「兵器」义只留在「兵刃、短兵相接」等复合词中",text:"六国破灭，非兵不利，战不善，弊在赂秦。",source:"《六国论》",explanation:"按今义把「兵」译成「士兵」是最常见的误译。"},{ancient:"「兵革」泛指军备、武力",modern:"现代无「兵革」一词",text:"威天下不以兵革之利。",source:"《得道多助，失道寡助》",explanation:"「革」指皮革制成的甲胄，与「兵」合指武器装备。"}]},relatedPatterns:["judgment"]},{id:"qu",char:"去",pinyin:"qù",category:"实词",summary:"古义「离开」与「距离」，与今义「前往」方向相反，是高考最经典的古今异义实词之一。",senses:[{id:"qu-s1",gloss:"离开、离去",modern:"离开 / 走开 / 撤离",scene:"主语从某地离去，后常接地名或补语；「去国」「辞去」「亡去」都是这一义。",usageHint:"「亦去之」（晋军也离开郑国）若按今义译成「也去了郑国」，方向完全反了。",examples:[{text:"亦去之。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"晋文公拒绝子犯袭击秦军的建议后，晋军也撤离郑国。",translation:"（晋军）也离开了郑国。",wordTranslation:"离开（教材注「去之：离开郑国」）"},{text:"于是遂去。乃令张良留谢。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦借如厕之机决意脱身，留下张良代为辞谢。",translation:"于是（刘邦）就离开了，随即叫张良留下来辞谢。",wordTranslation:"离开、脱身"},{text:"登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。",source:"《岳阳楼记》",author:"范仲淹",era:"北宋",context:"写迁客骚人在阴雨登楼时产生的去国思乡之悲。",translation:"（这时）登上这座楼，就会有离开国都、怀念家乡，担心谗言、惧怕讥讽，满眼萧条、感慨到极点而悲伤的心情。",wordTranslation:"离开，「去国」＝离开国都"},{text:"停数日，辞去。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"渔人在桃花源逗留数日后告辞离开。",translation:"（渔人）停留了几天，告辞离去。",wordTranslation:"离开"}]},{id:"qu-s2",gloss:"距离、相距",modern:"距离 / 相隔",scene:"两处地点或两物之间的空间间隔；常与「相」「不盈」「百里」等搭配。",usageHint:"这一义项现代汉语已消失，今人极易把「相去四十里」误读成「互相前往四十里」。",examples:[{text:"当是时，项王军在鸿门下，沛公军在霸上，相去四十里。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"交待刘邦抄小路逃回霸上的路程背景。",translation:"这时候，项王的军队驻在鸿门下，沛公的军队驻在霸上，两处相距四十里。",wordTranslation:"相距、距离"},{text:"于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。",source:"《归去来兮辞·序》",author:"陶渊明",era:"东晋",context:"陶渊明自述出任彭泽令的缘由：离家近、公田收成够酿酒。",translation:"当时战乱未平，心里害怕远行服役，彭泽离家（只有）一百里，公田的收成，足够用来酿酒。",wordTranslation:"距离、离"},{text:"连峰去天不盈尺，枯松倒挂倚绝壁。",source:"《蜀道难》",author:"李白",era:"唐",context:"李白极写蜀道山峰之高，几乎触到天。",translation:"连绵的山峰离天不足一尺，枯老的松树倒挂着倚靠在陡峭的崖壁上。",wordTranslation:"距离、离"}]}],flexUsage:{has:!0,types:["动词作定语"],items:[{type:"动词「离去」转为定语，译「逝去的、过去的」",text:"譬如朝露，去日苦多。",source:"《短歌行》",explanation:"「去日」指已经逝去的日子，「去」由动词转为修饰成分；同式见《归园田居》「误落尘网中，一去三十年」。"}]},ancientModern:{has:!0,items:[{ancient:"去＝离开（从某地走开）",modern:"去＝前往（到某地去）",text:"亦去之。",source:"《烛之武退秦师》",explanation:"古今方向正好相反；教材把「亦去之」列为该篇古今异义第一条。"},{ancient:"去＝距离、相距",modern:"现代汉语「去」无「距离」义，须译作「距、相隔」",text:"相去四十里。",source:"《鸿门宴》",explanation:"「去」的距离义是纯粹的古义残留。"}]},relatedPatterns:["ellipsis"]},{id:"gu",char:"顾",pinyin:"gù",category:"实词",summary:"本义「回头看」，引申出「环视、瞻顾」「看望拜访」「顾及」「只是、不过」等一串义项。",senses:[{id:"gu-s1",gloss:"回头看、环视、瞻望（本义）",modern:"回头看 / 看、环顾 / 回望",scene:"动作与「看」直接相关，常带「召」「视」「瞻」等连用；多出现于叙事句。",usageHint:"「顾召」是「回头（招呼）」，先转身再叫人，两个动作连得很紧。",examples:[{text:"相如顾召赵御史书曰：“某年月日，秦王为赵王击缶。”",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"渑池会上秦王被迫击缶后，蔺相如回头叫赵国史官记下这一笔。",translation:"蔺相如回头招呼赵国的史官写道：「某年某月某日，秦王给赵王击缶。」",wordTranslation:"回头（看），教材注「顾：回头」"},{text:"百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。",source:"《项脊轩志》",author:"归有光",era:"明",context:"写项脊轩破旧狭小，每次挪书桌都找不到合适地方安放。",translation:"（这间）百年老屋，尘土泥水渗漏，雨水往下流；每次移动书桌，环顾四周都没有可以放置的地方。",wordTranslation:"环顾、四处看"},{text:"瞻顾遗迹，如在昨日，令人长号不自禁。",source:"《项脊轩志》",author:"归有光",era:"明",context:"归有光追忆祖母遗物与旧日情景，悲不能自已。",translation:"瞻望回顾（祖母留下的）旧迹，就像在昨天一样，让人忍不住放声大哭。",wordTranslation:"瞻望、回望（「瞻顾」同义连用）"}]},{id:"gu-s2",gloss:"引申义：看望拜访、顾及、转念（由「把目光/心思投向」引申）",modern:"拜访 / 顾及、顾念 / 只是、不过",scene:"不再指眼睛的动作，而指把注意力投向某人某事；三句分别落在「看望」「顾及」「转念/轻微转折」上。",usageHint:"这是「一词多义」最容易浑成一片的一组，务必按搭配细分：「三顾」＝拜访，「不顾」＝顾及，「顾吾念之」＝只是、不过。",examples:[{text:"先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事。",source:"《出师表》",author:"诸葛亮",era:"三国·蜀",context:"诸葛亮追述先帝三访草庐、咨询天下大事的知遇之恩。",translation:"先帝不因为我身份低微、见识浅陋，委屈自己，三次到草庐里来看望我，拿当世的大事询问我。",wordTranslation:"看望、拜访（「三顾」；「于草庐之中」为状语后置）"},{text:"大行不顾细谨，大礼不辞小让。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙劝刘邦不必拘礼告辞，赶紧脱身。",translation:"做大事不必顾及细枝末节，行大礼不必计较琐屑的谦让。",wordTranslation:"顾及、计较"},{text:"顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如向门客解释避让廉颇的用意。",translation:"只是我考虑到，强大的秦国不敢对赵国用兵的原因，只因为有我们两人在啊。",wordTranslation:"只是、不过（教材注「顾：只是，不过」，已虚化为副词）"}]}],flexUsage:{has:!0,types:["动词虚化为副词"],items:[{type:"动词「回头看」虚化为表轻微转折的副词「只是、不过」",text:"顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。",source:"《廉颇蔺相如列传》",explanation:"由「回过头来（再想）」引申为「只是、不过」，是实词虚化的典型路径，教材注释明确。"}]},ancientModern:{has:!0,items:[{ancient:"「顾」单用即可表示「回头看、看望」",modern:"现代「顾」单用多指「顾及、照顾」，「看」义只留在「回顾、环顾、光顾、三顾茅庐」等复合词中",text:"相如顾召赵御史书曰。",source:"《廉颇蔺相如列传》",explanation:"按今义「照顾」理解会完全读错。"}]},relatedPatterns:["adv-post"]},{id:"zuo",char:"坐",pinyin:"zuò",category:"实词",summary:"两读两义：坐下（动词）与通「座」的座位（名词）；另有「因……获罪」「因为」的引申义。",senses:[{id:"zuo-s1",gloss:"坐下、跪坐（动词）",modern:"坐下 / 坐着",scene:"描述宴饮、会客、休憩的姿态；古人席地跪坐，鸿门宴的「东向坐」「北向坐」还含座次尊卑。",usageHint:"鸿门宴座次一段是这一义项最密集的语料，注意「坐」与「侍」（陪侍）的地位差别。",examples:[{text:"项王、项伯东向坐；亚父南向坐——亚父者，范增也；沛公北向坐；张良西向侍。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"鸿门宴座次：项羽、项伯面东坐，范增面南坐，刘邦面北坐，张良面西陪侍，尊卑立见。",translation:"项王、项伯朝东坐；亚父朝南坐——亚父就是范增；沛公朝北坐；张良朝西陪侍。",wordTranslation:"坐下、就座（三处「坐」均为动词）"},{text:"樊哙从良坐。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项羽赐樊哙「坐」之后，樊哙挨着张良坐下。",translation:"樊哙挨着张良坐下。",wordTranslation:"坐下"},{text:"扪参历井仰胁息，以手抚膺坐长叹。",source:"《蜀道难》",author:"李白",era:"唐",context:"写行人攀越蜀道高阶时屏息抚胸、坐下长叹。",translation:"（山高得）可以摸到参星、越过井星，仰头屏住呼吸，用手抚着胸口坐下来长叹。",wordTranslation:"坐下"}]},{id:"zuo-s2",gloss:"通「座」，座位、席位（名词）",modern:"座位 / 席位 / 在场的人",scene:"「于坐」「置之坐上」「满坐」「其坐」等搭配中，「坐」指坐的地方或满座的人，不指动作。",usageHint:"《口技》教材「通假字」条明确写「满坐寂然（坐通座，座位）」，是最权威的判别依据。",examples:[{text:"请以剑舞，因击沛公于坐，杀之。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增命项庄借舞剑之机在座位上刺杀刘邦。",translation:"请（允许我）用舞剑（助兴），趁机在座位上袭击沛公，把他杀掉。",wordTranslation:"座位，通「座」（「于坐」＝在席位上）"},{text:"项王则受璧，置之坐上。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项羽收下张良代献的白璧，放在座位上。",translation:"项王接受了白璧，把它放在座位上。",wordTranslation:"座位，通「座」"},{text:"少顷，但闻屏障中抚尺一下，满坐寂然，无敢哗者。",source:"《口技》",author:"林嗣环",era:"清",context:"口技表演开场，醒木一拍，全场安静下来。",translation:"一会儿，只听见屏风里醒木一拍，全场（座位上的人）静悄悄的，没有敢大声说话的。",wordTranslation:"座位、满座的人，通「座」（教材通假字条明注）"}]}],flexUsage:{has:!0,types:["通假（坐通座）","动词引申为介词"],items:[{type:"通「座」，名词",text:"郑人有欲买履者，先自度其足，而置之其坐。",source:"《郑人买履》",explanation:"「置之其坐」＝把量好的尺码放在他的座位上；「坐」通「座」。同篇「至之市」的「之」是动词「到……去」。"},{type:"由「坐（罪）」引申为「因为、因……获罪」",text:"对曰：“齐人也，坐盗。”",source:"《晏子使楚》",explanation:"「坐盗」＝因偷盗而获罪；「坐」由「坐罪」引申为「因为、因……犯罪」，是实词引申的常见考点。"}]},ancientModern:{has:!0,items:[{ancient:"「坐」常通「座」，指座位",modern:"现代汉语「坐」只作动词，座位义写作「座」",text:"满坐寂然，无敢哗者。",source:"《口技》",explanation:"「满坐」今作「满座」；按今义把「满坐」理解为「都坐下」就译错了。"},{ancient:"「坐」可表示「因为、因……获罪」",modern:"现代「坐」无「因为」义",text:"齐人也，坐盗。",source:"《晏子使楚》",explanation:"「坐盗」应译「犯了偷盗的罪」，不是「坐着偷盗」。"}]},relatedPatterns:["judgment"]},{id:"jue",char:"绝",pinyin:"jué",category:"实词",summary:"义项跨度大：横渡/越过、断绝/停止/隔绝，以及「极、独特」；「绝境」是典型古今异义。",senses:[{id:"jue-s1",gloss:"横渡、越过、穿过",modern:"横渡 / 越过 / 直穿而过",scene:"后接江河、云气、山巅等空间障碍，主语借外物或高飞越过。",usageHint:"教材把「而绝江河」的「绝」明注为「横渡」；与现代「断绝」义毫无关系，是最易误译的一项。",examples:[{text:"假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。",source:"《劝学》",author:"荀子",era:"先秦",context:"荀子论证君子「善假于物」：借助车马船桨可以到达千里、横渡江河。",translation:"借助车马的人，不是脚走得快，却能到达千里；借助船只的人，并不善于游泳，却能横渡江河。",wordTranslation:"横渡（教材注「绝：横渡」）"},{text:"西当太白有鸟道，可以横绝峨眉巅。",source:"《蜀道难》",author:"李白",era:"唐",context:"写太白山以西只有鸟道，可由此横越峨眉山顶。",translation:"西边正对着太白山，只有飞鸟能过的小路，（靠它）可以横越峨眉山的峰顶。",wordTranslation:"横越、越过"},{text:"抟扶摇羊角而上者九万里，绝云气，负青天，然后图南，且适南冥也。",source:"《逍遥游》",author:"庄周",era:"先秦",context:"写大鹏乘旋风直上九万里，穿过云层、背负青天才向南飞。",translation:"（大鹏）乘着像羊角一样盘旋的暴风上升到九万里高空，穿过云气，背靠着青天，然后打算往南飞，将要到南海去。",wordTranslation:"穿过、超越"}]},{id:"jue-s2",gloss:"断绝、停止、消失；隔绝",modern:"断绝 / 停止 / 消失 / 与世隔绝",scene:"与「不」「无」「毕」「声」「缕」等搭配，指声音、联系、通路中断；「绝境」指与外界隔绝之地。",usageHint:"「绝境」古义是「与世隔绝的地方」，今义是「没有出路的困境」，方向完全不同。",examples:[{text:"其声呜呜然，如怨如慕，如泣如诉；余音袅袅，不绝如缕。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"写客人的洞箫声悠长婉转，尾音细得像一根不断绝的丝线。",translation:"那声音呜呜咽咽，像哀怨又像思慕，像哭泣又像倾诉；余音悠长，像细丝一样连绵不断。",wordTranslation:"断绝，「不绝」＝不中断"},{text:"自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"桃花源中人自述祖先为避秦乱带家人同乡来到与世隔绝之地。",translation:"（他们）自己说祖先为躲避秦朝的战乱，带领妻子儿女和同乡来到这个与世隔绝的地方，不再出去，于是和外面的人断绝了往来。",wordTranslation:"隔绝，「绝境」＝与外界隔绝的地方（古今异义）"},{text:"而大声发于水上，噌吰如钟鼓不绝。",source:"《石钟山记》",author:"苏轼",era:"北宋",context:"苏轼夜泊绝壁下，忽然水上响起像钟鼓般连续不断的大声，由此探得石钟山得名的实据。",translation:"忽然有宏大的声音从水面上发出，噌吰作响像钟鼓声连续不断。",wordTranslation:"停止、断绝，「不绝」＝不中断"},{text:"忽然抚尺一下，群响毕绝。",source:"《口技》",author:"林嗣环",era:"清",context:"口技表演收尾，醒木一拍，所有声响戛然而止。",translation:"忽然醒木一拍，各种声响全都停止了。",wordTranslation:"停止、消失"}]}],flexUsage:{has:!0,types:["动词引申为副词（极、非常）","形容词构成名词性短语"],items:[{type:"由「断绝、到了尽头」引申为副词「极、非常」",text:"满坐宾客无不伸颈，侧目，微笑，默叹，以为妙绝。",source:"《口技》",explanation:"「妙绝」＝奇妙到了极点。同义例见《与朱元思书》「自富阳至桐庐，一百许里，奇山异水，天下独绝」。此义项本版未单列义项（可靠例句不足三条），标「待核」备后续扩充。"},{type:"形容词「隔绝的」修饰「境」构成名词性短语",text:"率妻子邑人来此绝境，不复出焉。",source:"《桃花源记》",explanation:"「绝境」由形容词性「绝」+「境」构成名词性短语，指与世隔绝之地。"}]},ancientModern:{has:!0,items:[{ancient:"「绝」可指横渡（「绝江河」）",modern:"现代「绝」主要指断绝、穷尽，「横渡」义已消失",text:"假舟楫者，非能水也，而绝江河。",source:"《劝学》",explanation:"按今义把「绝江河」译成「断绝江河」是典型误译。"},{ancient:"「绝境」＝与世隔绝的地方",modern:"「绝境」＝毫无出路的困难境地",text:"率妻子邑人来此绝境。",source:"《桃花源记》",explanation:"词义感情色彩与指向都变了，属高考必考古今异义。"},{ancient:"「妻子」＝妻子和儿女",modern:"「妻子」＝配偶（女方）",text:"率妻子邑人来此绝境。",source:"《桃花源记》",explanation:"该句一句之内含「绝境」「妻子」两处古今异义，教材列为重点。"}]},relatedPatterns:["ellipsis"]},{id:"zou",char:"走",pinyin:"zǒu",category:"实词",summary:"古义「跑、逃跑」，引申为「奔向、通向」；今义「步行」，是最典型的古今异义实词。",senses:[{id:"zou-s1",gloss:"跑、奔跑、逃跑（本义）",modern:"跑 / 逃跑 / 奔",scene:"战败、遇险、捉拿等语境中指快速奔跑或逃走；常与「弃甲曳兵」「逾墙」「先」等搭配。",usageHint:"「弃甲曳兵而走」是「五十步笑百步」的出处，教材明注「走：跑」，绝不能译成「走」。",examples:[{text:"填然鼓之，兵刃既接，弃甲曳兵而走。",source:"《寡人之于国也》",author:"孟子及其弟子",era:"先秦",context:"孟子以战喻：战鼓一响、兵器相接，士兵就丢盔弃甲拖着兵器逃跑。",translation:"咚咚地敲起战鼓，兵器刀锋已经交接，（士兵）扔下铠甲拖着兵器逃跑。",wordTranslation:"跑、逃跑（教材注「走：跑」）"},{text:"步走，从郦山下，道芷阳，间行。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦脱身独骑，与樊哙等四人持剑盾徒步快跑，抄小路回霸上。",translation:"（刘邦等人）徒步奔跑，从郦山脚下，取道芷阳，抄小路走。",wordTranslation:"跑、快步奔走（「步走」＝徒步跑，非慢走）"},{text:"暮投石壕村，有吏夜捉人。老翁逾墙走，老妇出门看。",source:"《石壕吏》",author:"杜甫",era:"唐",context:"杜甫夜宿石壕村，差吏夜来抓丁，老翁翻墙逃走，老妇出门应付。",translation:"傍晚投宿石壕村，有差吏夜里来抓人。老翁翻过墙逃跑了，老妇出门去查看。",wordTranslation:"逃跑"},{text:"雄兔脚扑朔，雌兔眼迷离；双兔傍地走，安能辨我是雄雌？",source:"《木兰诗》",author:"佚名（北朝民歌）",era:"南北朝",context:"《木兰诗》结尾以双兔并跑难辨雄雌，比喻木兰从军不易被识破。",translation:"雄兔脚爱乱动，雌兔眼常眯着；两只兔子贴着地面一起跑，怎能分辨哪只是雄、哪只是雌呢？",wordTranslation:"跑"}]},{id:"zou-s2",gloss:"奔向、投奔、通向（后接处所）",modern:"奔向 / 投奔 / 通往",scene:"「走」后接地名或方向，指跑着前往某处；描述道路、山脉走向时译「通向、延伸」。",usageHint:"与 S1 的区别在于后面是否带目的地；「直走咸阳」主语是宫殿建筑，译「一直通向咸阳」。",examples:[{text:"今君乃亡赵走燕，燕畏赵，其势必不敢留君，而束君归赵矣。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如劝缪贤不要从赵国逃奔燕国，燕国必把他捆送回赵。",translation:"如今您竟然从赵国逃出去投奔燕国，燕国畏惧赵国，按情势一定不敢收留您，反而会把您捆起来送回赵国。",wordTranslation:"逃奔、投奔（后接处所「燕」）"},{text:"骊山北构而西折，直走咸阳。",source:"《阿房宫赋》",author:"杜牧",era:"唐",context:"写阿房宫依骊山向北兴建、再向西转折，一直延伸到咸阳。",translation:"（阿房宫）从骊山向北建起，再往西转折，一直通向咸阳。",wordTranslation:"通向、延伸（教材常注「走：趋向」）"},{text:"臣尝有罪，窃计欲亡走燕。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"缪贤自述曾犯罪想逃奔燕国，被门客蔺相如劝止。",translation:"我曾经犯了罪，私下打算逃出（赵国）奔往燕国。",wordTranslation:"逃奔、奔向（后接处所「燕」）"}]}],flexUsage:{has:!0,types:["词义引申（非词类活用）"],items:[{type:"「跑」引申为「趋向、通往」",text:"骊山北构而西折，直走咸阳。",source:"《阿房宫赋》",explanation:"由人快速奔向某地，引申为建筑物、道路朝某方向延伸。属词义引申，不是词类活用。"}]},ancientModern:{has:!0,items:[{ancient:"走＝跑、逃跑",modern:"走＝步行；文言的「跑」相当于现代的「走」，文言的「行」才接近现代「走」",text:"弃甲曳兵而走。",source:"《寡人之于国也》",explanation:"方向恰好互换，是高考翻译题最经典的古今异义陷阱。"},{ancient:"走＝奔向、通向",modern:"现代「走」无「通向」义，须译作「通往、延伸」",text:"直走咸阳。",source:"《阿房宫赋》",explanation:"按今义「一直走到咸阳」虽勉强可通，但主语是宫殿，应译「一直通向」。"}]},relatedPatterns:["ellipsis"]}],Le=[{id:"judgment",name:"判断句",category:"判断类",definition:"以名词、代词或名词性短语作谓语，对主语的性质、身份、关系作出肯定或否定判断的句子；文言一般不用判断词「是」，靠「者/也」、副词或语义直接表示。",markers:["……者，……也","……，……也","……者，……","乃","则","即","皆","诚","必","为","是","非（否定判断）"],rules:["见「者……也」「……也」「……者」格式，先按判断句处理，翻译时补出判断词「是」。","谓语前出现「乃、则、即、皆、诚、必」等副词，多为加强判断语气，仍译「就是 / 都是」。","「为」作动词表判断（如今人方为刀俎，我为鱼肉）；「非」表否定判断，译「不是」。","无任何标志时按语义判断（如「刘备天下枭雄」），不要硬加标志词。","句中「是」在先秦多作指示代词「这」，不要一律当判断词。"],examples:[{text:"师者，所以传道受业解惑也。",source:"《师说》",author:"韩愈",analysis:"典型的「……者，……也」格式；「所以」译「用来……的」，全句给「师」下定义。",translation:"老师，是用来传授道理、教授学业、解答疑难问题的人。"},{text:"此则岳阳楼之大观也。",source:"《岳阳楼记》",author:"范仲淹",analysis:"副词「则」表判断、句末「也」收束；「此」是指示代词作主语，不是判断词。",translation:"这就是岳阳楼的壮丽景象。"},{text:"如今人方为刀俎，我为鱼肉。",source:"《鸿门宴》",author:"司马迁",analysis:"用动词「为」表判断，两处对举；译时补「是」，并保留比喻色彩。",translation:"如今人家正是刀和砧板，我们是（砧板上的）鱼和肉。"}],examTips:"翻译题判为判断句却漏译「是」会直接扣分；注意「非……也」是否定判断，「此乃……也」的「乃」是判断副词而非「于是」。"},{id:"passive",name:"被动句",category:"被动类",definition:"主语是谓语动词所表示动作的承受者（受事）而非发出者的句子；分有标志被动与无标志（意念）被动两类。",markers:["为","为……所……","……为所……","见","见……于……","于","受……于……","被"],rules:["见「为 + 施事 + 所 + 动词」「为所 + 动词」，译「被……」。「为所」是省略施事的紧缩式。","见「见 + 动词」「见 + 动词 + 于 + 施事」，译「被」；「见」后若接动作且主语是受事，才按被动理解。","「动词 + 于 + 施事」常表被动（如「幸于赵王」），要与状语后置区分：看主语能否发出该动作。","「被」在先秦较少，汉以后渐多；现代汉译时统一补「被」。","无任何标志但主语明显是受事时（如「屈原放逐，乃赋离骚」），按意念被动翻译。"],examples:[{text:"不者，若属皆且为所虏！",source:"《鸿门宴》",author:"司马迁",analysis:"「为所」＝「为（之）所」，省略施事；主语「若属」是被俘虏的一方。",translation:"不这样的话，你们这些人都将被（他）俘虏！"},{text:"臣诚恐见欺于王而负赵，故令人持璧归，间至赵矣。",source:"《廉颇蔺相如列传》",author:"司马迁",analysis:"「见欺于王」是「见……于……」格式，「于」引出施事「王」；译「被大王欺骗」。",translation:"我实在担心被大王欺骗而对不起赵国，所以派人带着璧回去，从小路回到赵国了。"},{text:"不拘于时，学于余。",source:"《师说》",author:"韩愈",analysis:"前半「于」表被动，后半「于」引出对象「向我」；同一句里「于」两种用法，是名篇考点。",translation:"（李蟠）不被时俗拘束，向我学习。"}],examTips:"先看主语是施事还是受事，再找标志；「见」有时只表示「对我怎么样」（如「冀君实或见恕也」），不都是被动，须按上下文判断。"},{id:"ellipsis",name:"省略句",category:"省略类",definition:"文言里普遍省略主语、谓语、宾语、介词宾语或介词「于」等成分的句子；翻译时须联系上下文补出，句意才完整。",markers:["承前省","蒙后省","对话省","省「之」","省「于」","省谓语"],rules:["先通读上下文，判断缺哪个成分导致语义不完整。","省略主语最常用「承前省」：补出上一句出现过的人或物（如「见渔人」补「桃花源中人」）。","「与、以、为」等介词后常省宾语「之」（如「竖子不足与谋」＝「不足与之谋」）。","处所词前常省介词「于」（如「晋军函陵」＝「晋军于函陵」），翻译时补「在」。","对偶、排比句里常省谓语（如「一鼓作气，再而衰，三而竭」补「鼓」）。"],examples:[{text:"见渔人，乃大惊，问所从来。",source:"《桃花源记》",author:"陶渊明",analysis:"省主语「桃花源中人」，承上文「其中往来种作」补出；「问所从来」还省了宾语「之」（渔人）。",translation:"（桃花源里的人）看见渔人，于是非常吃惊，问（他）是从哪里来的。"},{text:"一鼓作气，再而衰，三而竭。",source:"《曹刿论战》",author:"左丘明",analysis:"「再」「三」后省谓语「鼓」，因前句「一鼓作气」而蒙后省略；补齐后语意才顺。",translation:"第一次击鼓振作起士气，第二次（击鼓）士气就衰减了，第三次（击鼓）士气就耗尽了。"},{text:"竖子不足与谋！",source:"《鸿门宴》",author:"司马迁",analysis:"介词「与」后省宾语「之」（指项庄等人）；范增摔碎玉斗后的愤语。",translation:"这小子不值得和（他）共谋大事！"},{text:"晋军函陵，秦军氾南。",source:"《烛之武退秦师》",author:"左丘明",analysis:"两处省介词「于」，且「军」是名词作动词「驻军」；该篇文言句式表明确标为省略句。",translation:"晋军驻扎在函陵，秦军驻扎在氾水南面。"}],examTips:"高考多把省略句放进翻译题考查，漏补省略成分按「关键信息缺失」扣分；补出的内容要用括号标在译文里。"},{id:"obj-front",name:"宾语前置",category:"倒装类",definition:"把本该在动词（或介词）后面的宾语提到前面以示强调的倒装句；有疑问句、否定句、提宾标志、代词宾语等固定条件。",markers:["何","谁","孰","安","奚","曷","不","未","毋","莫","之（提宾标志）","是（提宾标志）","唯……是……"],rules:["疑问句中疑问代词作宾语，宾语前置：「大王来何操」＝「大王来操何」。","否定句中代词作宾语，宾语前置：「古之人不余欺也」＝「不欺余」；「未之有也」＝「未有之也」。","用「之」「是」作提宾标志：「何厌之有」＝「有何厌」，「唯利是图」＝「唯图利」，标志词本身不译。","介词宾语也可前置：「何以战」＝「以何战」，「微斯人，吾谁与归」＝「吾与谁归」。","翻译时把宾语挪回动词（或介词）之后，并按现代汉语语序重排。"],examples:[{text:"夫晋，何厌之有？",source:"《烛之武退秦师》",author:"左丘明",analysis:"「之」是提宾标志，「何厌」是「有」的宾语；该篇句式表标为「即有何厌，疑问代词作宾语，宾语前置」。",translation:"晋国，哪会有满足（的时候）呢？"},{text:"不然，籍何以至此？",source:"《鸿门宴》",author:"司马迁",analysis:"疑问代词「何」作介词「以」的宾语而前置，「何以」＝「以何」，译「凭什么 / 怎么」。",translation:"不这样的话，我项籍怎么会到这种地步呢？"},{text:"句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。",source:"《师说》",author:"韩愈",analysis:"两个「之」都是提宾标志，「不知句读」「不解惑」；与「或师焉，或不焉」形成对比。",translation:"不懂得断句，不能解决疑惑，有的（前者）向老师学习，有的（后者）却不学，小的方面学了而大的方面丢弃了，我看不出他们明智在哪里。"},{text:"古之人不余欺也！",source:"《石钟山记》",author:"苏轼",analysis:"否定句代词「余」作宾语前置，「不余欺」＝「不欺余」；苏轼实地考察后发出的感叹。",translation:"古代的人没有欺骗我啊！"}],examTips:"「之」「是」作提宾标志时不译，误译成「的」是最常见错误；「何以」「何为」「谁与」等介宾前置要整体调序。"},{id:"attrib-post",name:"定语后置",category:"倒装类",definition:"把本该放在中心词前面的修饰语移到后面，常用「者」收句或「之」连接的倒装句；翻译时把定语挪回中心词前。",markers:["中心词 + 定语 + 者","中心词 + 之 + 定语 + 者","中心词 + 之 + 形容词","中心词 + 数量词","……者"],rules:["识别：名词之后还有一段描述性短语，且以「者」结尾或由「之」连接，多半是定语后置。","「中心词 + 定语 + 者」：「客有吹洞箫者」＝「有吹洞箫之客」。","「中心词 + 之 + 定语 + 者」：「石之铿然有声者」＝「铿然有声之石」。","「中心词 + 之 + 形容词」：「爪牙之利，筋骨之强」＝「利之爪牙，强之筋骨」，「之」是标志不译。","数量词作定语也常后置，翻译时一并调到中心词前并补出量词。"],examples:[{text:"客有吹洞箫者，倚歌而和之。",source:"《赤壁赋》",author:"苏轼",analysis:"「有吹洞箫者」是「客」的后置定语；译「有一位吹洞箫的客人」。",translation:"有一位吹洞箫的客人，按着歌声伴奏应和。"},{text:"石之铿然有声者，所在皆是也，而此独以钟名，何哉？",source:"《石钟山记》",author:"苏轼",analysis:"「之……者」结构，译「发出铿锵声响的石头」；是定语后置标志「之……者」的典型例。",translation:"（敲击时）发出铿锵声响的石头，到处都是，唯独这里用「钟」来命名，为什么呢？"},{text:"蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。",source:"《劝学》",author:"荀子",analysis:"「爪牙之利」「筋骨之强」＝「利之爪牙」「强之筋骨」，「之」是定语后置标志；句末「……也」是判断/因果判断。",translation:"蚯蚓没有锋利的爪牙、强健的筋骨，却能向上吃到泥土、向下喝到地下水，是因为用心专一。"}],examTips:"「之」在定语后置里不译，误当「的」会把语序译反；「求人可使报秦者」一类要补出「……的人」再调序。"},{id:"adv-post",name:"状语后置（介宾短语后置）",category:"倒装类",definition:"文言里由「于」「以」「乎」构成的介宾短语常放在动词（或形容词）之后作补语，按现代汉语应移到谓语前作状语。",markers:["于","以","乎","于……","以……"],rules:["看到「动词 + 于 + 名词」，先把「于……」提到动词前译，多数译「在 / 向 / 对 / 比 / 被」。","「以 + 名词 + 动词」或「动词 + 以 + 名词」，按「用……」「把……」「拿……」调序。","「乎」相当于「于」时同样后置（如「生乎吾前」「先乎吾」）。","比较句「形容词 + 于 + 对象」译「比……」，被动句「动词 + 于 + 施事」译「被……」，须按语义分流。","若「于」引出的是施事且主语是受事，则属被动句而非单纯的状语后置。"],examples:[{text:"壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。",source:"《赤壁赋》",author:"苏轼",analysis:"「于赤壁之下」后置，还原为「于赤壁之下泛舟游」。",translation:"壬戌年秋天，七月十六日，苏先生和客人在赤壁之下乘船游览。"},{text:"九月甲午，晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。",source:"《烛之武退秦师》",author:"左丘明",analysis:"该篇句式表明确标注「状语后置，应为以其于晋无礼，且于楚贰也」；「以」是连词「因为」。",translation:"九月甲午日，晋文公、秦穆公包围郑国，因为郑国曾对晋国无礼，并且从属晋国的同时又从属楚国。"},{text:"谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。",source:"《寡人之于国也》",author:"孟子及其弟子",analysis:"「以孝悌之义」「于道路」两处后置；还原为「以孝悌之义申之」「于道路不负戴」。",translation:"认真地兴办学校教育，把孝顺父母、敬爱兄长的道理反复讲给百姓听，头发花白的老人就不会在路上背着或顶着东西了。"}],examTips:"翻译时漏调序是主要失分点；「于」同时兼表处所、比较、被动、对象，先判语义再定译法。"},{id:"pred-front",name:"主谓倒装（谓语前置）",category:"倒装类",definition:"为强调谓语或表达强烈感叹，把谓语提到主语之前的倒装句；多出现在感叹句、疑问句中，翻译时把主语调前、谓语放回。",markers:["甚矣","渺渺兮","异哉","宜乎","快哉","……哉","……乎（句首谓语）"],rules:["句首是形容词/感叹性谓语，后接「主语 + 也/矣/乎/哉」等语气词，先考虑主谓倒装。","还原公式：「甚矣，汝之不惠」＝「汝之不惠甚矣」；「渺渺兮予怀」＝「予怀渺渺兮」。","翻译时按「主语 + 谓语」语序重排，并保留原文的感叹语气（「太……了」「多么……啊」）。","数量较少，但高考翻译题常与判断句、省略句连考。"],examples:[{text:"歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”",source:"《赤壁赋》",author:"苏轼",analysis:"「渺渺兮予怀」＝「予怀渺渺兮」，谓语「渺渺」前置以强化悠远惆怅的感叹。",translation:"歌词唱道：「桂木做的棹啊兰木做的桨，拍击着澄明的江水啊逆流而上。我的情怀多么悠远啊，遥望心上人啊在天的另一方。」"},{text:"敛以嫁时之衣，甚矣吾贫可知也。",source:"《南阳县君谢氏墓志铭》（2010 年高考语文江苏卷）",author:"欧阳修",analysis:"「甚矣吾贫」＝「吾贫甚矣」，谓语「甚」前置；同时「敛以嫁时之衣」兼状语后置与省略（省「其」）。查字典语文网真题解析明确标注为「谓语前置」。",translation:"用出嫁时的衣服（给她）穿上入棺，我的贫穷（到了极点），也就可想而知了。"}],examTips:"句首出现「甚矣」「异哉」「宜乎」且后面像主语时，先试着调回主谓语序；不要把它当成普通的句首状语。"},{id:"fixed",name:"固定句式",category:"固定结构类",definition:"由两个或多个虚词凝固成习惯搭配、有固定译法的句式；须整体记忆，不能逐字硬拆。",markers:["得无……乎","奈何","何……为","何以","孰与","所以……者，……也","不亦……乎","无乃……乎","其……乎","何如"],rules:["「得无……乎 / 无乃……乎」表揣测，译「恐怕……吧 / 莫非……吗」。","「奈何 / 如……何 / 若……何」译「怎么办 / 把……怎么样」。","「何……为 / 何以……为」表反问，译「为什么要……呢 / 哪里用得着……呢」。","「孰与」表比较，译「与……相比谁更…… / 比……怎么样」。","「所以……者，……也」表原因，译「……的原因，是……」；与现代因果连词「所以」不同。","「不亦……乎」表委婉反问，译「不也是……吗」。"],examples:[{text:"然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？",source:"《岳阳楼记》",author:"范仲淹",analysis:"「得无……乎」表揣测反问；「多会于此」同时是状语后置。",translation:"既然如此，那么（洞庭湖）向北通到巫峡，向南直到潇湘，被贬的官员和诗人们大多在这里聚会，观赏景物而生的感情，恐怕会有所不同吧？"},{text:"如今人方为刀俎，我为鱼肉，何辞为！",source:"《鸿门宴》",author:"司马迁",analysis:"「何……为」表反问，译「还告辞什么呢」；前半「为」是判断动词。",translation:"如今人家正是刀和砧板，我们是（砧板上的）鱼和肉，还告辞什么呢！"},{text:"秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？",source:"《阿房宫赋》",author:"杜牧",analysis:"「奈何」译「为什么 / 怎么」，带强烈诘问语气；「尽锱铢」极言搜刮之细。",translation:"秦始皇喜爱繁华奢侈，百姓也顾念自己的家。为什么搜刮（财宝）时连一锱一铢都不放过，挥霍起来却像对待泥沙一样呢？"}],examTips:"固定句式要整体记译法；「所以」「以为」「于是」「虽然」等看似现代词的结构，在文言里几乎都是两个词，须拆开理解。"}],an=[{id:"ch-xuci-pronoun",title:"虚词·指代与结构",description:"之、其、者、所：代词、结构助词与名词化，兼涉判断句、定语后置、宾语前置三大句式。",wordIds:["zhi","qi","zhe","suo"]},{id:"ch-xuci-conn",title:"虚词·连词与介词",description:"而、以、于、乃、为、则：关系与语气，是翻译题调语序、辨被动的主战场。",wordIds:["er","yi","yu","nai","wei","ze"]},{id:"ch-shici-military",title:"实词·军事与行止",description:"兵、走、去：一词多义与古今异义最密集的一组，适合作为入门第一章。",wordIds:["bing","zou","qu"]},{id:"ch-shici-action",title:"实词·动作与状态",description:"顾、坐、绝：本义与引申义跨度大，含通假与词类活用。",wordIds:["gu","zuo","jue"]},{id:"ch-pattern",title:"特殊句式专项",description:"从句式反查词条：判断、被动、省略、四类倒装与固定句式所牵涉的高
