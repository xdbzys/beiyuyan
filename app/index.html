dId:"wei",senseId:"wei-s3",text:"父为郭汜所害。",source:"2018·全国卷",wordTranslation:"表被动，被（郭汜）杀害"},{id:"gk2018-a2",wordId:"wei",senseId:"wei-s1",text:"世有名德，为西州豪族。",source:"2018·全国卷",wordTranslation:"是，成为西州豪族"},{id:"gk2018-a3",wordId:"ju",senseId:"ju-s2",text:"郡举上计吏，州辟别驾。",source:"2018·全国卷",wordTranslation:"推荐、选拔（为）上计吏"},{id:"gk2018-a4",wordId:"xu2",senseId:"xu2-s1",text:"魏明帝许焉，曹爽辅政，引为司马。",source:"2018·全国卷",wordTranslation:"答应、允许（了他）"},{id:"gk2018-a5",wordId:"huan",senseId:"huan-s2",text:"县多奸滑，积为人患。",source:"2018·全国卷",wordTranslation:"祸患、祸害"},{id:"gk2018-a6",wordId:"xi",senseId:"xi-s1",text:"涣以方略讨击，悉诛之。",source:"2018·全国卷",wordTranslation:"全都（杀掉）"},{id:"gk2018-a7",wordId:"yu",senseId:"yu-s1",text:"境内清夷，商人露宿于道。",source:"2018·全国卷",wordTranslation:"在（道路上）"},{id:"gk2018-a8",wordId:"qian",senseId:"qian-s2",text:"在温三年，迁兖州刺史。",source:"2018·全国卷",wordTranslation:"调动官职，升任兖州刺史"},{id:"gk2018-a9",wordId:"cong",senseId:"cong-s1",text:"永元十五年，从驾南巡，还为洛阳令。",source:"2018·全国卷",wordTranslation:"跟随（皇帝车驾）"},{id:"gk2018-a10",wordId:"jian2",senseId:"jian2-s2",text:"自王君在事，不见侵枉，故来报恩。",source:"2018·全国卷",wordTranslation:"表被动，被（侵扰冤枉）"},{id:"gk2018-a11",wordId:"chu",senseId:"chu-s3",text:"除户部郎中、京西转运副使。",source:"2018·全国卷",wordTranslation:"授官、任命（为户部郎中）"},{id:"gk2020-a1",wordId:"qing",senseId:"qing-s2",text:"轼恐不见容，请外，拜龙图阁学士、知杭州。",source:"2020·全国卷",wordTranslation:"请求（外调）"},{id:"gk2020-a2",wordId:"xu",senseId:"xu-s1",text:"提举官惊曰：“公姑徐之。”",source:"2020·全国卷",wordTranslation:"慢慢地、缓一缓"},{id:"gk2020-a3",wordId:"zhi",senseId:"zhi-s2",text:"未几，朝廷知法害民，罢之。",source:"2020·全国卷",wordTranslation:"代词，指这项法令"},{id:"gk2018-a12",wordId:"yi",senseId:"yi-s4",text:"京师称叹，以为涣有神算。",source:"2018·全国卷",wordTranslation:"认为（王涣有神算）"},{id:"gk2018-a13",wordId:"wei",senseId:"wei-s2",text:"帝为举哀，谥曰贞，赐茔田百亩。",source:"2018·全国卷",wordTranslation:"替（他）举哀"},{id:"gk2018-a14",wordId:"yi",senseId:"yi-s1",text:"由是一切以宽处之。",source:"2018·全国卷",wordTranslation:"用、拿（宽和的办法）"},{id:"gk2021-a1",wordId:"zhi",senseId:"zhi-s2",text:"上欲杀之，胄奏据法应流。",source:"2021·全国卷",wordTranslation:"代词，指这个假冒资荫的人"},{id:"gk2021-a2",wordId:"suo",senseId:"suo-s2",text:"法者，国家所以布大信于天下也。",source:"2021·全国卷",wordTranslation:"用来……的凭借"},{id:"gk2021-a3",wordId:"er",senseId:"er-s2",text:"卿欲守法，而使朕失信乎？",source:"2021·全国卷",wordTranslation:"表转折，却"}],id={"er-s4":[{text:"置之地，拔剑撞而破之。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增拔剑击碎玉斗。",scene:"两个动作先后相承，前一动作为后一动作的前提。",translation:"（把它）扔在地上，拔出剑来把它击碎。",wordTranslation:"表承接，就、接着（撞而破之＝撞碎它）"}],"er-s5":[{text:"而翁归，自与汝复算耳。",source:"《促织》",author:"蒲松龄",era:"清",context:"成名之妻责备儿子，说等你父亲回来再跟你算账。",scene:"「而」修饰亲属称谓，是第二人称代词而非连词。",translation:"你的父亲回来，自会跟你再算账。",wordTranslation:"你的，第二人称代词，修饰「翁」"}],"yi-s3":[{text:"不以物喜，不以己悲。",source:"《岳阳楼记》",author:"范仲淹",era:"北宋",context:"写古仁人超然于外物与自身得失。",scene:"「以」后接原因名词，译「因为」；两句互文。",translation:"不因为外物的好坏和自己的得失而或喜或悲。",wordTranslation:"因为、由于，表原因"}],"yu-s4":[{text:"于其身也，则耻师焉，惑矣。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈批评士大夫对孩子与对自己两种态度。",scene:"「于」引出对象「自身」，译「对于」。",translation:"对于他自己，却以从师为耻，真糊涂啊。",wordTranslation:"对于，引出对象"}],"wei-s4":[{text:"如今人方为刀俎，我为鱼肉，何辞为？",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙劝刘邦不必告辞。",scene:"句末「为」与疑问代词呼应，构成反问，不译。",translation:"现在人家正是刀和砧板，我们是鱼肉，还辞别什么呢？",wordTranslation:"句末语气词，表反问，可译为「呢」"}],"ze-s1":[{text:"项王曰：“壮士！赐之卮酒。”则与斗卮酒。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项羽赏樊哙酒。",scene:"「则」承接上文指令，表动作紧接发生。",translation:"项羽说：“壮士！赏他一杯酒。”（左右）就给了他一大杯酒。",wordTranslation:"就、便，表顺承"}],"ze-s2":[{text:"至则无可用，放之山下。",source:"《黔之驴》",author:"柳宗元",era:"唐",context:"黔之驴被运到后却派不上用场。",scene:"前后语意相反，「则」译「却」。",translation:"运到之后却没有用处，就把它放在山脚下。",wordTranslation:"却，表转折"}],"ze-s3":[{text:"入则无法家拂士，出则无敌国外患者，国恒亡。",source:"《生于忧患，死于安乐》",author:"孟子",era:"先秦",context:"孟子论忧患使国存、安乐使国亡。",scene:"「则」引出假设条件下的结果，与「入/出」配合。",translation:"（一个国家）内部如果没有守法度的大臣和辅佐君主的贤士，外部如果没有敌对国家和外来的忧患，这个国家常常会灭亡。",wordTranslation:"如果……就，表假设"}],"ye-s2":[{text:"师道之不传也久矣！",source:"《师说》",author:"韩愈",era:"唐",context:"感叹从师风尚失传已久。",scene:"主语与谓语之间加「也」，表停顿并提起下文。",translation:"从师学习的风尚不流传已经很久了！",wordTranslation:"句中语气词，表提顿，不译"}],"hu-s3":[{text:"浩浩乎如冯虚御风，而不知其所止。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"写泛舟江上飘然之感。",scene:"「乎」附在形容词后作词尾，相当于「……的样子」。",translation:"浩浩荡荡啊，像凌空驾风而行，却不知道将要停在哪里。",wordTranslation:"形容词词尾，……的样子"}],"nai-s2":[{text:"问今是何世，乃不知有汉，无论魏晋。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"桃花源中人不知外界朝代更替。",scene:"事实出乎意料，「乃」译「竟然」。",translation:"问现在是什么朝代，竟然不知道有过汉朝，更不必说魏朝和晋朝了。",wordTranslation:"竟然、却，表出乎意料"}],"nai-s3":[{text:"王师北定中原日，家祭无忘告乃翁。",source:"《示儿》",author:"陆游",era:"南宋",context:"陆游临终嘱咐儿子。",scene:"「乃」修饰「翁」，是第二人称领属代词。",translation:"朝廷的军队向北收复中原的那一天，家祭时不要忘了告诉你的父亲。",wordTranslation:"你的，第二人称代词"}],"qie-s1":[{text:"且壮士不死即已，死即举大名耳。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"陈胜激励戍卒起义。",scene:"「且」在句首推进一层，译「况且」。",translation:"况且壮士不死则已，要死就要成就一番大名。",wordTranslation:"况且、而且，表递进"}],"qie-s2":[{text:"臣死且不避，卮酒安足辞！",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙表示连死都不怕。",scene:"用「尚且」衬托下文「更不必说」，是让步连词。",translation:"我连死尚且不怕，一杯酒哪里值得推辞！",wordTranslation:"尚且，表让步"}],"ruo-s2":[{text:"其翼若垂天之云。",source:"《逍遥游》",author:"庄周",era:"先秦",context:"写鲲鹏之大。",scene:"「若」连接本体与喻体，译「像」。",translation:"它的翅膀就像悬挂在天空的云。",wordTranslation:"像、好像，表比喻"}],"ruo-s3":[{text:"若亡郑而有益于君，敢以烦执事。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武假设亡郑的后果。",scene:"「若」引出假设条件，与下文结果呼应。",translation:"如果灭掉郑国对您有好处，那就冒昧地拿这件事来麻烦您。",wordTranslation:"如果、假如，表假设"}],"suo-s3":[{text:"为国者无使为积威之所劫哉！",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵告诫治国者不要被积威胁迫。",scene:"「为……所……」是固定被动格式，缺一不可。",translation:"治理国家的人不要被别人积久的威势所胁迫啊！",wordTranslation:"与「为」构成「为……所……」被动格式"}],"yin-s2":[{text:"因人之力而敝之，不仁。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"晋文公论不可攻秦。",scene:"「因」带宾语「人之力」，作谓语动词。",translation:"依靠别人的力量却又损害他，这是不仁。",wordTranslation:"依靠、凭借，动词"}],"yin-s3":[{text:"项王即日因留沛公与饮。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项羽当日留下刘邦饮酒。",scene:"「因」位于主语后、动词前，表承接，译「于是」。",translation:"项羽当天就留下刘邦，和他一起饮酒。",wordTranslation:"于是、就，表承接"}],"yu2-s2":[{text:"吾与汝毕力平险，指通豫南，达于汉阴，可乎？",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"愚公与家人商量移山。",scene:"「与」连接两个并列的人，作连词「和」。",translation:"我和你们尽全力铲平险峻的大山，一直通到豫州南部，到达汉水南岸，可以吗？",wordTranslation:"和、同，连词"}],"yan-s3":[{text:"且焉置土石？",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"家人质疑挖出的土石往哪里放。",scene:"「焉」作疑问代词，代处所，译「哪里」。",translation:"况且把挖出的土石放到哪里去呢？",wordTranslation:"哪里，疑问代词，代处所"}],"he-s2":[{text:"水何澹澹，山岛竦峙。",source:"《观沧海》",author:"曹操",era:"东汉",context:"写海水荡漾、山岛高耸。",scene:"「何」修饰形容词，表程度深，译「多么」。",translation:"海水多么宽阔浩荡，山岛高高地耸立着。",wordTranslation:"多么，程度副词"}],"ai-s1":[{text:"予独爱莲之出淤泥而不染。",source:"《爱莲说》",author:"周敦颐",era:"北宋",context:"周敦颐以莲自况。",scene:"「爱」后接主谓短语作宾语，表喜爱。",translation:"我唯独喜爱莲花从淤泥里长出来却不沾染污秽。",wordTranslation:"喜爱、喜欢"}],"ai-s3":[{text:"爱其子，择师而教之。",source:"《师说》",author:"韩愈",era:"唐",context:"写人们疼爱子女的普遍心理。",scene:"「爱」带宾语「其子」，是疼爱、爱护。",translation:"（人们）疼爱自己的孩子，选择老师来教他。",wordTranslation:"疼爱、爱护"}],"an-s1":[{text:"风雨不动安如山。",source:"《茅屋为秋风所破歌》",author:"杜甫",era:"唐",context:"想象广厦庇护天下寒士。",scene:"「安」作形容词，修饰「如山」的状态，译「安稳」。",translation:"风雨中也不动摇，安稳得像山一样。",wordTranslation:"安稳、稳固，形容词"}],"an-s3":[{text:"安营扎寨。",source:"古代军语",author:"",era:"明清",context:"军队驻扎的常用说法。",scene:"「安」带宾语「营」，是「安置、扎下」的动词用法。",translation:"安置营帐，扎下寨子。",wordTranslation:"安置、安放，动词"}],"bei-s2":[{text:"信而见疑，忠而被谤，能无怨乎？",source:"《屈原列传》",author:"司马迁",era:"西汉",context:"司马迁评屈原忠而被疑。",scene:"「被」直接置于动词前表被动，与「见」对举。",translation:"诚信却被怀疑，忠诚却被诽谤，能没有怨恨吗？",wordTranslation:"表被动，被（诽谤）"}],"bing-s2":[{text:"收天下之兵，聚之咸阳。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"秦统一后收缴天下兵器。",scene:"「兵」指兵器，不是士兵，是高频误判点。",translation:"收缴天下的兵器，把它们聚集到咸阳。",wordTranslation:"兵器、武器"}],"bing-s3":[{text:"兵者，国之大事，死生之地，存亡之道，不可不察也。",source:"《孙子兵法·计篇》",author:"孙武",era:"先秦",context:"孙子开篇论战争的地位。",scene:"「兵」指战争、军事，抽象名词。",translation:"战争是国家的大事，关系到军民的生死、国家的存亡，不能不认真考察。",wordTranslation:"战争、军事"}],"dao-s2":[{text:"师道之不传也久矣，欲人之无惑也难矣！",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈感叹师道失传。",scene:"此句「道」是名词「风尚」，注意与「说、讲」的动词用法区分。",translation:"从师学习的风尚不流传已经很久了，想要人们没有疑惑就很难了！",wordTranslation:"风尚、传统（此处为名词，非「说」）"}],"dao-s3":[{text:"从郦山下，道芷阳间行。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦从小路逃走。",scene:"「道」带宾语「芷阳」，是「取道、经过」的动词。",translation:"从郦山脚下，取道芷阳，抄小路走。",wordTranslation:"取道、经过，动词"}],"de-s1":[{text:"所得表众亦极七八万耳。",source:"《赤壁之战》",author:"司马光",era:"北宋",context:"估计曹操所得刘表降兵数量。",scene:"「得」后接「表众」，是获得、得到。",translation:"所得到的刘表的兵众也最多不过七八万罢了。",wordTranslation:"得到、获得"}],"de-s3":[{text:"此言得之。",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵评六国赂秦之失。",scene:"「得」不带宾语，表「得当、说对了」，是形容词用法。",translation:"这话说对了（很得当）。",wordTranslation:"得当、正确，形容词"}],"gu-s1":[{text:"故木受绳则直，金就砺则利。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子以木材、金属喻学习。",scene:"「故」在句首承接上文推论，译「所以」。",translation:"所以木材经墨线量过就笔直，金属刀剑在磨刀石上磨过就锋利。",wordTranslation:"所以、因此，连词"}],"gu-s2":[{text:"广故数言欲亡，忿恚尉。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"吴广故意多次说要逃跑以激怒军官。",scene:"「故」修饰动词「言」，表主观故意。",translation:"吴广故意多次说要逃跑，来激怒军官。",wordTranslation:"故意、特意，副词"}],"ju-s1":[{text:"举所佩玉玦以示之者三。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增多次举玉玦示意项羽下手。",scene:"「举」带宾语「玉玦」，是举起、举起示意的动作。",translation:"（范增）多次举起佩带的玉玦向项王示意。",wordTranslation:"举起、抬起"}],"ju-s2":[{text:"傅说举于版筑之间。",source:"《生于忧患，死于安乐》",author:"孟子",era:"先秦",context:"孟子列举贤人起于微贱。",scene:"「举」是被动用法，「被举用、被选拔」。",translation:"傅说从筑墙的劳作之中被举用。",wordTranslation:"被举用、被选拔"}],"ju-s4":[{text:"今亡亦死，举大计亦死，等死，死国可乎？",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"陈胜分析起义得失。",scene:"「举」带宾语「大计」，是发动、举行。",translation:"现在逃跑也是死，发动起义也是死，同样是死，为国事而死可以吗？",wordTranslation:"发动、举行（起义）"}],"wang-s1":[{text:"王曰：“善。”乃下令。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"齐王采纳邹忌建议。",scene:"「王」作主语，是名词「君王」；读 wáng，非 wàng。",translation:"齐王说：“好。”于是下达命令。",wordTranslation:"君王、国王，名词"}],"wang-s2":[{text:"大楚兴，陈胜王。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"戍卒夜呼以神化起义。",scene:"「王」读 wàng，作谓语，是「称王」的动词用法。",translation:"大楚复兴，陈胜称王。",wordTranslation:"称王，读 wàng，动词"}],"ben-s3":[{text:"本诸理，作《非国语》。",source:"《非国语》序",author:"柳宗元",era:"唐",context:"柳宗元说明自己写作的依据。",scene:"「本」带宾语「诸理」，是推究、依据的动词。",translation:"依据情理来推究，写成《非国语》。",wordTranslation:"推究、依据，动词"}],"bing2-s3":[{text:"古人以俭为美德，今人乃以俭相诟病。",source:"《训俭示康》",author:"司马光",era:"北宋",context:"司马光感叹世风以俭为耻。",scene:"「病」作动词带宾语，是责备、非议。",translation:"古人把节俭当作美德，今人却因节俭互相讥议责备。",wordTranslation:"责备、非议，动词"}],"cha-s1":[{text:"徐而察之，则山下皆石穴罅。",source:"《石钟山记》",author:"苏轼",era:"北宋",context:"苏轼夜探石钟山。",scene:"「察」是仔细察看，与「观」的泛看不同。",translation:"慢慢地仔细观察，原来山下都是石头的洞穴和裂缝。",wordTranslation:"仔细察看，动词"}],"cha-s2":[{text:"小大之狱，虽不能察，必以情。",source:"《曹刿论战》",author:"左丘明",era:"先秦",context:"鲁庄公自陈断狱态度。",scene:"「察」指明察、弄清楚案情。",translation:"大大小小的案件，虽然不能件件明察，但一定按实情处理。",wordTranslation:"明察、弄清楚，动词"}],"chao-s1":[{text:"朝辞白帝彩云间，千里江陵一日还。",source:"《早发白帝城》",author:"李白",era:"唐",context:"李白遇赦东归。",scene:"「朝」读 zhāo，句首时间名词，是「早晨」。",translation:"清晨告别彩云缭绕的白帝城，千里之外的江陵一天就能到达。",wordTranslation:"早晨，读 zhāo"}],"chao-s2":[{text:"强国请服，弱国入朝。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写秦强盛时诸侯的臣服。",scene:"「朝」作动词，入朝拜见天子。",translation:"强国请求臣服，弱国前来朝拜。",wordTranslation:"朝见、朝拜，动词"}],"ceng-s1":[{text:"同是天涯沦落人，相逢何必曾相识。",source:"《琵琶行》",author:"白居易",era:"唐",context:"白居易听琵琶女身世后自伤。",scene:"「曾」修饰「相识」，表过去有过。",translation:"同样是流落天涯的人，相逢何必曾经相识呢。",wordTranslation:"曾经，副词"}],"cheng-s1":[{text:"乘鄂渚而反顾兮，欸秋冬之绪风。",source:"《涉江》",author:"屈原",era:"先秦",context:"屈原流放途中回望故国。",scene:"「乘」带处所宾语「鄂渚」，是登上。",translation:"登上鄂渚回头远望啊，哀叹秋冬的寒风。",wordTranslation:"登上，动词"}],"cheng-s3":[{text:"千乘之国，摄乎大国之间。",source:"《子路曾皙冉有公西华侍坐》",author:"孔子及弟子",era:"先秦",context:"子路言志，设想治理中等国家。",scene:"「乘」是兵车单位，一乘四马一车。",translation:"拥有一千辆兵车的国家，夹在大国之间。",wordTranslation:"兵车（四马一车为一乘），量词"}],"cheng2-s2":[{text:"诚能见可欲则思知足以自戒。",source:"《谏太宗十思疏》",author:"魏徵",era:"唐",context:"魏徵提出「十思」。",scene:"「诚」在句首表假设，译「如果」。",translation:"如果看见想要的东西，就想到知足来自我克制。",wordTranslation:"如果、果真，连词"}],"chu-s1":[{text:"黎明即起，洒扫庭除。",source:"《朱子家训》",author:"朱柏庐",era:"清",context:"家训开篇讲起居。",scene:"「除」作名词，指庭院台阶。",translation:"天亮就起床，打扫庭院台阶。",wordTranslation:"台阶，名词"}],"chu-s2":[{text:"当横行天下，为汉家除残去秽。",source:"《赤壁之战》",author:"司马光",era:"北宋",context:"周瑜论抗曹。",scene:"「除」与「去」对举，都是清除。",translation:"应当纵横天下，替汉朝清除残暴、去掉污秽。",wordTranslation:"清除、除掉，动词"}],"ci-s1":[{text:"其辞微，其志洁。",source:"《屈原列传》",author:"司马迁",era:"西汉",context:"司马迁评屈原作品。",scene:"「辞」指文辞、言辞，与「志」对举。",translation:"他的文辞含蓄，他的志趣高洁。",wordTranslation:"言辞、文辞，名词"}],"ci-s2":[{text:"臣以供养无主，辞不赴命。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密以祖母无人奉养为由推辞征召。",scene:"「辞」后接「不赴命」，是推辞。",translation:"我因为祖母无人奉养，推辞不去接受任命。",wordTranslation:"推辞、拒绝，动词"}],"ci-s3":[{text:"旦辞爷娘去，暮宿黄河边。",source:"《木兰诗》",author:"佚名",era:"北朝",context:"木兰代父从军离家。",scene:"「辞」带宾语「爷娘」，是辞别。",translation:"早晨辞别父母上路，晚上宿在黄河边。",wordTranslation:"辞别、告别，动词"}],"cong-s2":[{text:"小惠未遍，民弗从也。",source:"《曹刿论战》",author:"左丘明",era:"先秦",context:"曹刿评鲁庄公的小恩小惠。",scene:"「从」指服从、听从。",translation:"小恩小惠不能遍及百姓，百姓不会听从您。",wordTranslation:"听从、服从，动词"}],"cong-s3":[{text:"从是以后，不敢复言为河伯娶妇。",source:"《西门豹治邺》",author:"褚少孙",era:"西汉",context:"西门豹破迷信之后。",scene:"「从」表时间起点，译「由、自」。",translation:"从此以后，没有人敢再提给河伯娶媳妇的事。",wordTranslation:"由、自，介词"}],"dai-s1":[{text:"此殆天所以资将军。",source:"《隆中对》",author:"陈寿",era:"西晋",context:"诸葛亮论荆州益州之势。",scene:"「殆」是推测副词，译「大概」。",translation:"这大概是上天用来资助将军的。",wordTranslation:"大概、恐怕，副词"}],"dai-s2":[{text:"知足不辱，知止不殆。",source:"《老子》第四十四章",author:"老子",era:"先秦",context:"老子论知足知止。",scene:"「殆」与「辱」并列，是危险。",translation:"知道满足就不会受辱，知道适可而止就不会危险。",wordTranslation:"危险，形容词"}],"dai-s3":[{text:"殆有甚焉。",source:"《齐桓晋文之事》",author:"孟子",era:"先秦",context:"孟子论缘木求鱼之害。",scene:"「殆」表「恐怕、几乎」，语气比「必」轻。",translation:"恐怕比这还严重。",wordTranslation:"恐怕、几乎，副词"}],"dang-s1":[{text:"一夫当关，万夫莫开。",source:"《蜀道难》",author:"李白",era:"唐",context:"极写剑阁险要。",scene:"「当」是「把守、抵挡」，不是「应当」。",translation:"一个人把守关口，一万人也攻不开。",wordTranslation:"把守、抵挡，动词"}],"du-s1":[{text:"吾忘持度。",source:"《郑人买履》",author:"韩非",era:"先秦",context:"郑人到了集市才发现忘了带尺码。",scene:"「度」作名词，指量好的尺码。",translation:"我忘了带量好的尺码。",wordTranslation:"尺码、尺度，名词"}],"fei-s1":[{text:"城非不高也，池非不深也。",source:"《得道多助，失道寡助》",author:"孟子",era:"先秦",context:"孟子论地利不如人和。",scene:"「非不」双重否定，仍表判断否定「不是」。",translation:"城墙不是不高，护城河不是不深。",wordTranslation:"不是，表否定判断"}],"fei-s2":[{text:"是非之心，人皆有之。",source:"《孟子·告子上》",author:"孟子",era:"先秦",context:"孟子论四端。",scene:"「非」与「是」相对，指错的。",translation:"分辨对错的心，人人都有。",wordTranslation:"错、不对，形容词"}],"fei-s3":[{text:"非学无以致疑，非问无以广识。",source:"《问说》",author:"刘开",era:"清",context:"刘开论问与学的关系。",scene:"「非」后接动词，表一般否定「不」。",translation:"不学习就不能发现疑问，不请教就不能增广见识。",wordTranslation:"不，副词"}],"fu-s1":[{text:"复行数十步，豁然开朗。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"渔人穿过洞口。",scene:"「复」修饰「行」，表动作重复。",translation:"又走了几十步，突然开阔明亮起来。",wordTranslation:"又、再，副词"}],"fu2-s1":[{text:"负箧曳屣，行深山巨谷中。",source:"《送东阳马生序》",author:"宋濂",era:"明",context:"宋濂自述求学的艰辛。",scene:"「负」带宾语「箧」，是背着。",translation:"背着书箱、拖着鞋子，走在深山大谷中。",wordTranslation:"背、背负，动词"}],"fu2-s2":[{text:"负势竞上，互相轩邈。",source:"《与朱元思书》",author:"吴均",era:"南朝",context:"写富春江两岸群山。",scene:"「负」后接「势」，是依仗。",translation:"（群山）依仗高峻的地势争着向上，彼此比高比远。",wordTranslation:"依仗、凭借，动词"}],"fu2-s3":[{text:"吾上恐负朝廷，下恐愧吾师也。",source:"《左忠毅公逸事》",author:"方苞",era:"清",context:"史可法自述不敢懈怠。",scene:"「负」与「愧」对举，是辜负。",translation:"我对上怕辜负朝廷，对下怕愧对老师。",wordTranslation:"辜负、违背，动词"}],"gai-s2":[{text:"善始者实繁，克终者盖寡。",source:"《谏太宗十思疏》",author:"魏徵",era:"唐",context:"魏徵论创业与守成。",scene:"「盖」在谓语前表推测，译「大概」。",translation:"开头做得好的实在很多，能坚持到底的大概很少。",wordTranslation:"大概，副词"}],"gai-s3":[{text:"盖在殷忧，必竭诚以待下。",source:"《谏太宗十思疏》",author:"魏徵",era:"唐",context:"魏徵分析君主前后态度之变。",scene:"「盖」在句首引出原因，译「因为」。",translation:"因为在深重忧患之中，一定会竭尽诚意对待下属。",wordTranslation:"因为，连词"}],"gu2-s1":[{text:"荆轲顾笑武阳。",source:"《荆轲刺秦王》",author:"刘向",era:"西汉",context:"秦武阳在秦廷色变，荆轲回头安抚。",scene:"「顾」是回头看，不是一般的「看」。",translation:"荆轲回头对秦武阳笑了笑。",wordTranslation:"回头看，动词"}],"gu2-s2":[{text:"此人可就见，不可屈致也。将军宜枉驾顾之。",source:"《隆中对》",author:"陈寿",era:"西晋",context:"徐庶向刘备推荐诸葛亮。",scene:"「顾」是拜访、探望。",translation:"这个人只能去拜见，不能委屈他招来。将军应当屈尊去拜访他。",wordTranslation:"拜访、探望，动词"}],"gu3-s1":[{text:"臣闻求木之长者，必固其根本。",source:"《谏太宗十思疏》",author:"魏徵",era:"唐",context:"魏徵以树木喻治国。",scene:"「固」带宾语，是使动「使……稳固」。",translation:"我听说想要树木生长，一定要使它的根稳固。",wordTranslation:"使……稳固，使动用法"}],"gu3-s2":[{text:"至于颠覆，理固宜然。",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵论六国灭亡的必然。",scene:"「固」修饰「宜然」，是「本来」。",translation:"至于国家覆灭，道理本来就应该这样。",wordTranslation:"本来，副词"}],"gui-s1":[{text:"将军百战死，壮士十年归。",source:"《木兰诗》",author:"佚名",era:"北朝",context:"写将士征战多年。",scene:"「归」与「死」对举，是返回。",translation:"将军身经百战而死，壮士十年后归来。",wordTranslation:"返回、回来，动词"}],"gui-s2":[{text:"之子于归，宜其室家。",source:"《诗经·周南·桃夭》",author:"佚名",era:"先秦",context:"贺女子出嫁。",scene:"「归」特指女子出嫁，是高频古义。",translation:"这位姑娘出嫁了，会使她的家庭和顺。",wordTranslation:"女子出嫁，动词"}],"gui-s3":[{text:"江表英豪咸归附之。",source:"《赤壁之战》",author:"司马光",era:"北宋",context:"写孙权在江东深得人心。",scene:"「归」与「附」连用，是归附。",translation:"江南的英雄豪杰都归附他。",wordTranslation:"归附、归依，动词"}],"guo-s1":[{text:"国破山河在，城春草木深。",source:"《春望》",author:"杜甫",era:"唐",context:"安史之乱中杜甫陷长安。",scene:"「国」指国都长安，不是整个国家。",translation:"国都沦陷了，山河依旧存在；春天的长安城草木丛生。",wordTranslation:"国都、京城，名词"}],"guo-s2":[{text:"忧劳可以兴国，逸豫可以亡身。",source:"《伶官传序》",author:"欧阳修",era:"北宋",context:"欧阳修总结后唐兴亡。",scene:"「国」与「身」对举，指国家。",translation:"忧劳可以使国家兴盛，安逸享乐可以使自身灭亡。",wordTranslation:"国家，名词"}],"guo2-s2":[{text:"过而能改，善莫大焉。",source:"《左传·宣公二年》",author:"左丘明",era:"先秦",context:"论改过之善。",scene:"「过」作动词，是犯错。",translation:"犯了错能够改正，没有比这更大的好事了。",wordTranslation:"犯错、有过失，动词"}],"guo2-s3":[{text:"无乃尔是过与？",source:"《季氏将伐颛臾》",author:"孔子及弟子",era:"先秦",context:"孔子责备冉有、子路。",scene:"「过」作动词带宾语「尔」，是责备。",translation:"恐怕该责备你们了吧？",wordTranslation:"责备、责怪，动词"}],"hen-s2":[{text:"商女不知亡国恨，隔江犹唱后庭花。",source:"《泊秦淮》",author:"杜牧",era:"唐",context:"杜牧夜泊秦淮。",scene:"「恨」是怨恨、痛惜，不是今义的「仇恨」。",translation:"歌女不懂亡国的痛恨，隔着江水还在唱《玉树后庭花》。",wordTranslation:"怨恨、痛惜，名词"}],"hu2-s1":[{text:"田园将芜胡不归？",source:"《归去来兮辞》",author:"陶渊明",era:"东晋",context:"陶渊明决意辞官。",scene:"「胡」在疑问句中表原因，译「为什么」。",translation:"田园快要荒芜了，为什么还不回去？",wordTranslation:"为什么，疑问代词"}],"hu2-s2":[{text:"但使龙城飞将在，不教胡马度阴山。",source:"《出塞》",author:"王昌龄",era:"唐",context:"边塞诗怀古伤今。",scene:"「胡」指北方少数民族，是名词。",translation:"只要有龙城飞将在，就不会让胡人的战马越过阴山。",wordTranslation:"胡人、北方民族，名词"}],"ji-s1":[{text:"臣少多疾病，九岁不行。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密自述幼年体弱。",scene:"「疾」与「病」连用，指疾病。",translation:"我小时候常生病，九岁还不能走路。",wordTranslation:"疾病，名词"}],"ji-s2":[{text:"疾风知劲草，板荡识诚臣。",source:"《赐萧瑀》",author:"李世民",era:"唐",context:"唐太宗赞萧瑀。",scene:"「疾」修饰「风」，是急速。",translation:"猛烈的风中才能看出坚韧的草，动荡的世道才能识别忠诚的臣。",wordTranslation:"急速、猛烈，形容词"}],"ji-s3":[{text:"君子疾夫舍曰欲之而必为之辞。",source:"《季氏将伐颛臾》",author:"孔子及弟子",era:"先秦",context:"孔子批评冉有的托辞。",scene:"「疾」带宾语（夫……辞），是痛恨。",translation:"君子痛恨那种不说自己想要，却一定要另找借口的态度。",wordTranslation:"痛恨、厌恶，动词"}],"ji2-s1":[{text:"及日中则如盘盂。",source:"《两小儿辩日》",author:"列御寇",era:"先秦",context:"小儿论日之远近。",scene:"「及」表时间到达，译「到」。",translation:"到了正午就像盘子和盂一样（小）。",wordTranslation:"到、等到，动词"}],"ji2-s2":[{text:"郯子之徒，其贤不及孔子。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈论圣人无常师。",scene:"「及」表比较，是比得上。",translation:"郯子这些人，他们的贤能都比不上孔子。",wordTranslation:"比得上、赶得上，动词"}],"ji2-s3":[{text:"及其所之既倦，情随事迁。",source:"《兰亭集序》",author:"王羲之",era:"东晋",context:"王羲之感慨人生。",scene:"「及」在句首，引出时间，译「等到」。",translation:"等到对已经得到的东西感到厌倦，感情就随着事物变化了。",wordTranslation:"等到，介词"}],"ji3-s2":[{text:"哙即带剑拥盾入军门。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙闯帐护主。",scene:"「即」修饰动作，表立即。",translation:"樊哙立刻带着剑、拿着盾闯入军门。",wordTranslation:"立即、就，副词"}],"ji3-s3":[{text:"即捕得三两头，又劣弱不中于款。",source:"《促织》",author:"蒲松龄",era:"清",context:"成名捕蟋蟀的艰难。",scene:"「即」表让步，译「即使」。",translation:"即使捉到两三只，又瘦弱不合规格。",wordTranslation:"即使，连词"}],"ji4-s1":[{text:"既加冠，益慕圣贤之道。",source:"《送东阳马生序》",author:"宋濂",era:"明",context:"宋濂自述成年后求学。",scene:"「既」表动作已完成，译「已经」。",translation:"已经成年，更加仰慕圣贤的学说。",wordTranslation:"已经，副词"}],"ji4-s2":[{text:"既自以心为形役，奚惆怅而独悲？",source:"《归去来兮辞》",author:"陶渊明",era:"东晋",context:"陶渊明反思出仕。",scene:"「既」在句首表「既然」。",translation:"既然自己让心灵被形体役使，为什么还惆怅独自悲伤？",wordTranslation:"既然，连词"}],"jia-s1":[{text:"君子生非异也，善假于物也。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子论学习要善于借助外物。",scene:"「假」后接「于物」，是借助。",translation:"君子的本性跟一般人没什么不同，只是善于借助外物罢了。",wordTranslation:"借助、凭借，动词"}],"jia-s2":[{text:"晋侯复假道于虞以伐虢。",source:"《左传·僖公五年》",author:"左丘明",era:"先秦",context:"假道伐虢的典故。",scene:"「假」带宾语「道」，是借。",translation:"晋侯又向虞国借路来攻打虢国。",wordTranslation:"借，动词"}],"jian-s1":[{text:"谈笑间，樯橹灰飞烟灭。",source:"《念奴娇·赤壁怀古》",author:"苏轼",era:"北宋",context:"苏轼怀想赤壁之战。",scene:"「间」表时间之中，译「……之间」。",translation:"谈笑之间，敌人的战船就化为灰烬。",wordTranslation:"……之间、顷刻，名词"}],"jian-s3":[{text:"数月之后，时时而间进。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"写齐王纳谏后的变化。",scene:"「间」读 jiàn，表断断续续。",translation:"几个月以后，还不时地有人偶尔进谏。",wordTranslation:"间或、偶尔，副词"}],"jian2-s1":[{text:"见贤思齐焉，见不贤而内自省也。",source:"《论语·里仁》",author:"孔子及弟子",era:"先秦",context:"孔子论修身。",scene:"「见」是看见，与「视」的主动看有别。",translation:"看见贤人就想着向他看齐，看见不贤的人就反省自己。",wordTranslation:"看见、见到，动词"}],"jian2-s3":[{text:"才美不外见。",source:"《马说》",author:"韩愈",era:"唐",context:"韩愈叹千里马不被识。",scene:"「见」读 xiàn，通「现」，是显现。",translation:"才能和美好的素质不能表现在外面。",wordTranslation:"通「现」，显现，读 xiàn"}],"jie-s1":[{text:"少年大骇，急解令休止。",source:"《促织》",author:"蒲松龄",era:"清",context:"两只蟋蟀相斗。",scene:"「解」是分开、解开。",translation:"少年大惊，急忙分开它们让停下来。",wordTranslation:"分开、解开，动词"}],"jiu-s1":[{text:"侯生视公子色终不变，乃谢客就车。",source:"《信陵君窃符救赵》",author:"司马迁",era:"西汉",context:"信陵君迎侯生。",scene:"「就」带宾语「车」，是登上、靠近。",translation:"侯生看公子脸色始终不变，才辞别客人上了车。",wordTranslation:"登上、接近，动词"}],"jiu-s2":[{text:"自是指物作诗立就。",source:"《伤仲永》",author:"王安石",era:"北宋",context:"仲永天资过人。",scene:"「就」表完成，译「完成」。",translation:"从此指定事物让他作诗，立刻就能完成。",wordTranslation:"完成、成功，动词"}],"jue-s1":[{text:"则请立太子为王，以绝秦望。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如劝赵王做好最坏打算。",scene:"「绝」带宾语「望」，是断绝。",translation:"那就请立太子为王，以此断绝秦国的念头。",wordTranslation:"断绝、断绝念头，动词"}],"jue-s2":[{text:"佛印绝类弥勒，袒胸露乳。",source:"《核舟记》",author:"魏学洢",era:"明",context:"描写核舟上的佛印。",scene:"「绝」修饰「类」，表程度极深，译「极、非常」。",translation:"佛印极像弥勒佛，敞开胸襟露出乳部。",wordTranslation:"极、非常，副词"}],"jue-s3":[{text:"假舟楫者，非能水也，而绝江河。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子论借助外物。",scene:"「绝」带宾语「江河」，是横渡。",translation:"借助船只的人，并不是会游泳，却能横渡江河。",wordTranslation:"横渡，动词"}],"kan-s1":[{text:"更那堪冷落清秋节！",source:"《雨霖铃》",author:"柳永",era:"北宋",context:"写离别之苦。",scene:"「堪」表承受，多用于否定或反问。",translation:"又怎么忍受得了这冷落凄清的秋天！",wordTranslation:"忍受、承受，动词"}],"kan-s2":[{text:"千载谁堪伯仲间。",source:"《书愤》",author:"陆游",era:"南宋",context:"陆游赞诸葛亮。",scene:"「堪」表能够，与「能」近。",translation:"千百年来谁能和他相比呢。",wordTranslation:"能够、可以，动词"}],"ke-s1":[{text:"攻之不克，围之不继。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武分析秦军处境。",scene:"「克」是战胜、攻下。",translation:"攻打它不能取胜，包围它又没有后援。",wordTranslation:"战胜、攻下，动词"}],"ke-s2":[{text:"克勤于邦，克俭于家。",source:"《尚书·大禹谟》",author:"佚名",era:"先秦",context:"称颂大禹的德行。",scene:"「克」后接形容词，表能够。",translation:"能为国事勤劳，能为家事节俭。",wordTranslation:"能够，动词"}],"lian-s1":[{text:"可怜身上衣正单，心忧炭贱愿天寒。",source:"《卖炭翁》",author:"白居易",era:"唐",context:"写卖炭翁的困苦。",scene:"「可怜」是值得怜悯，与「可爱」的古义要分清。",translation:"可怜他身上衣服单薄，心里却忧虑炭贱希望天更冷。",wordTranslation:"怜悯、值得同情，动词"}],"lian-s2":[{text:"丈夫亦爱怜其少子乎？",source:"《触龙说赵太后》",author:"刘向",era:"西汉",context:"触龙与赵太后论爱子。",scene:"「怜」与「爱」连用，是疼爱。",translation:"男人也疼爱他的小儿子吗？",wordTranslation:"疼爱、爱惜，动词"}],"mi-s1":[{text:"奉之弥繁，侵之愈急。",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵论赂秦之害。",scene:"「弥」与「愈」对举，都是更加。",translation:"送给秦国的越多，秦国侵略得越急。",wordTranslation:"更加、越，副词"}],"mi-s2":[{text:"夜雪初霁，荠麦弥望。",source:"《扬州慢》",author:"姜夔",era:"南宋",context:"写扬州战后荒凉。",scene:"「弥」修饰「望」，是满眼、遍。",translation:"夜雪初晴，满眼都是荠菜和野麦。",wordTranslation:"满、遍，动词"}],"mo-s1":[{text:"宫妇左右莫不私王。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"邹忌分析齐王受蒙蔽。",scene:"「莫」是无定代词，译「没有谁」。",translation:"宫中的妃子和近臣没有谁不偏爱大王。",wordTranslation:"没有谁，无定代词"}],"mo-s2":[{text:"莫愁前路无知己，天下谁人不识君。",source:"《别董大》",author:"高适",era:"唐",context:"送别友人。",scene:"「莫」表禁止，译「不要」。",translation:"不要担心前路没有知己，天下有谁不认识你呢。",wordTranslation:"不要，副词"}],"nei-s1":[{text:"内立法度，务耕织，修守战之具。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写秦孝公变法图强。",scene:"「内」与下文「外」对举，指对内。",translation:"对内建立法规制度，致力于耕作纺织，修造防守作战的器械。",wordTranslation:"对内、内部，名词作状语"}],"nei-s2":[{text:"距关，毋内诸侯。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"沛公入关后有人献计。",scene:"「内」通「纳」，读 nà，是接纳。",translation:"把守住函谷关，不要放诸侯进来。",wordTranslation:"通「纳」，接纳、放进来"}],"qi2-s1":[{text:"会天大雨，道不通，度已失期。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"戍卒遇雨误期。",scene:"「期」指期限，误期按秦法当斩。",translation:"恰逢下大雨，道路不通，估计已经误了期限。",wordTranslation:"期限，名词"}],"qi2-s2":[{text:"与老人期，后，何也？",source:"《史记·留侯世家》",author:"司马迁",era:"西汉",context:"黄石公责备张良迟到。",scene:"「期」带宾语「老人」，是约定。",translation:"和老人约好见面，却迟到了，为什么？",wordTranslation:"约定、约会，动词"}],"qi3-s1":[{text:"而世之奇伟、瑰怪、非常之观，常在于险远。",source:"《游褒禅山记》",author:"王安石",era:"北宋",context:"王安石论游洞之得。",scene:"「奇」修饰「观」，是奇特。",translation:"而世上的奇妙雄伟、珍异奇特、非同寻常的景象，常常在险远的地方。",wordTranslation:"奇特、奇妙，形容词"}],"qi3-s2":[{text:"舟首尾长约八分有奇。",source:"《核舟记》",author:"魏学洢",era:"明",context:"写核舟长度。",scene:"「奇」读 jī，表零数。",translation:"船从头到尾长约八分多一点。",wordTranslation:"零数、余数，读 jī"}],"qian-s1":[{text:"出自幽谷，迁于乔木。",source:"《诗经·小雅·伐木》",author:"佚名",era:"先秦",context:"以鸟迁高树喻人迁善。",scene:"「迁」表移动、搬迁。",translation:"从幽深的山谷飞出来，迁到高大的树上。",wordTranslation:"迁移、搬迁，动词"}],"qian-s2":[{text:"再迁为太史令。",source:"《张衡传》",author:"范晔",era:"南朝",context:"记张衡官职变动。",scene:"「迁」表官职调动，可升可平调。",translation:"两次调任后做了太史令。",wordTranslation:"调动官职，动词"}],"qing-s2":[{text:"寡人窃闻赵王好音，请奏瑟。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"秦王在渑池之会上要赵王奏瑟。",scene:"「请」是请对方做某事，语气客气。",translation:"我私下听说赵王喜欢音乐，请（您）弹瑟。",wordTranslation:"请、请求（对方做），动词"}],"qiong-s1":[{text:"穷且益坚，不坠青云之志。",source:"《滕王阁序》",author:"王勃",era:"唐",context:"王勃自勉。",scene:"「穷」指处境困厄，不是缺钱。",translation:"处境越艰难，意志越坚定，不放弃远大志向。",wordTranslation:"困厄、不得志，形容词"}],"qiong-s2":[{text:"复前行，欲穷其林。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"渔人继续探路。",scene:"「穷」带宾语「其林」，是走到尽头。",translation:"又往前走，想走到那片桃林的尽头。",wordTranslation:"穷尽、走到尽头，动词"}],"qiu-s1":[{text:"求人可使报秦者，未得。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"赵王寻找出使秦国的人。",scene:"「求」是寻找、访求。",translation:"寻找一个可以出使回复秦国的人，没有找到。",wordTranslation:"寻找、访求，动词"}],"qiu-s2":[{text:"不求闻达于诸侯。",source:"《出师表》",author:"诸葛亮",era:"三国",context:"诸葛亮自述本志。",scene:"「求」是谋求、追求。",translation:"不谋求在诸侯中扬名显达。",wordTranslation:"谋求、追求，动词"}],"qu-s1":[{text:"逝将去女，适彼乐土。",source:"《诗经·魏风·硕鼠》",author:"佚名",era:"先秦",context:"写农人想离开剥削者。",scene:"「去」是离开，与今义「前往」相反。",translation:"发誓要离开你，到那快乐的地方去。",wordTranslation:"离开，动词"}],"qu-s2":[{text:"去村四里有森林。",source:"《冯婉贞》",author:"徐珂",era:"清",context:"记冯婉贞抗敌。",scene:"「去」表距离，译「距、离」。",translation:"距离村子四里有一片森林。",wordTranslation:"距离、离，动词"}],"quan-s2":[{text:"劝君更尽一杯酒，西出阳关无故人。",source:"《送元二使安西》",author:"王维",era:"唐",context:"送别友人。",scene:"「劝」是劝请，不含「劝阻」。",translation:"劝你再干一杯酒，向西出了阳关就没有老朋友了。",wordTranslation:"劝请、劝说，动词"}],"que-s1":[{text:"却匈奴七百余里。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写蒙恬北击匈奴。",scene:"「却」带宾语，是使动「使……退却」。",translation:"使匈奴退却七百多里。",wordTranslation:"使……退却，使动用法"}],"que-s2":[{text:"却看妻子愁何在，漫卷诗书喜欲狂。",source:"《闻官军收河南河北》",author:"杜甫",era:"唐",context:"杜甫闻收复失地。",scene:"「却」是回头看，不是转折连词。",translation:"回头看妻子儿女，忧愁不知哪里去了；胡乱卷起诗书，高兴得快要发狂。",wordTranslation:"回头看，动词"}],"ru-s1":[{text:"纵一苇之所如，凌万顷之茫然。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"写泛舟江上。",scene:"「如」是往、到……去。",translation:"任凭小船飘去，越过那茫茫万顷的江面。",wordTranslation:"往、到……去，动词"}],"ru-s2":[{text:"不如因善遇之。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项伯劝项羽善待刘邦。",scene:"「不如」是比较，译「比不上」。",translation:"不如趁此好好对待他。",wordTranslation:"比得上，动词"}],"shan-s1":[{text:"君子生非异也，善假于物也。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子论借助外物。",scene:"「善」后接动词，是擅长。",translation:"君子的本性并无不同，只是善于借助外物。",wordTranslation:"善于、擅长，动词"}],"shao-s1":[{text:"少小离家老大回，乡音无改鬓毛衰。",source:"《回乡偶书》",author:"贺知章",era:"唐",context:"写久客归乡。",scene:"「少」读 shào，指年少。",translation:"年少时离开家，年老才回来，乡音没改鬓发却已稀疏。",wordTranslation:"年轻、年少，读 shào"}],"shao-s2":[{text:"太后之色少解。",source:"《触龙说赵太后》",author:"刘向",era:"西汉",context:"触龙劝说后，太后怒气稍减。",scene:"「少」读 shǎo，修饰「解」，是稍微。",translation:"太后的脸色稍微缓和了一些。",wordTranslation:"稍微，副词"}],"she-s1":[{text:"北涉玄灞，清月映郭。",source:"《山中与裴秀才迪书》",author:"王维",era:"唐",context:"王维夜游山中。",scene:"「涉」带水名，是渡水。",translation:"向北渡过深青色的灞水，清朗的月光映着城郭。",wordTranslation:"渡水，动词"}],"sheng-s2":[{text:"胜地不常，盛筵难再。",source:"《滕王阁序》",author:"王勃",era:"唐",context:"王勃感慨盛会难再。",scene:"「胜」修饰「地」，是优美的、著名的。",translation:"美好的地方不会常有，盛大的宴会难以再逢。",wordTranslation:"优美的、著名的，形容词"}],"shi-s1":[{text:"儿童相见不相识，笑问客从何处来。",source:"《回乡偶书》",author:"贺知章",era:"唐",context:"写久客归乡的陌生感。",scene:"「识」是认识、认得。",translation:"孩子们见了我都不认识，笑着问客人从哪里来。",wordTranslation:"认识、认得，动词"}],"shi-s2":[{text:"因笑谓迈曰：「汝识之乎？」",source:"《石钟山记》",author:"苏轼",era:"北宋",context:"苏轼向儿子苏迈解释水声成因。",scene:"「识」读 zhì，通「志」，是记住。",translation:"于是笑着对苏迈说：「你记住这个道理了吗？」",wordTranslation:"通「志」，记住，读 zhì"}],"shi2-s1":[{text:"乃使蒙恬北筑长城而守藩篱。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写秦始皇派蒙恬守边。",scene:"「使」带人名宾语，是派遣。",translation:"于是派蒙恬到北方修筑长城、守卫边境。",wordTranslation:"派遣，动词"}],"shi2-s2":[{text:"使人之所恶莫甚于死者，则凡可以辟患者何不为也？",source:"《鱼我所欲也》",author:"孟子",era:"先秦",context:"孟子论舍生取义。",scene:"「使」在句首表假设，译「假使」。",translation:"假使人们所厌恶的没有超过死亡的，那么凡是能躲避祸患的事有什么不做呢？",wordTranslation:"假使、如果，连词"}],"shi3-s1":[{text:"是日也，天朗气清，惠风和畅。",source:"《兰亭集序》",author:"王羲之",era:"东晋",context:"写兰亭雅集当日天气。",scene:"「是」修饰「日」，是指示代词「这」。",translation:"这一天，天气晴朗，空气清新，微风和暖。",wordTranslation:"这、此，指示代词"}],"shi3-s2":[{text:"是己而非人，俗之同病。",source:"《问说》",author:"刘开",era:"清",context:"刘开批评自以为是的学风。",scene:"「是」作意动，是「认为对」，与「非」对举。",translation:"认为自己正确、认为别人错误，是世俗的共同毛病。",wordTranslation:"认为对（意动），与「非」相对"}],"shi4-s1":[{text:"适莽苍者，三餐而反，腹犹果然。",source:"《逍遥游》",author:"庄周",era:"先秦",context:"庄子论远近与准备。",scene:"「适」带处所宾语，是到……去。",translation:"到近郊去的人，只带三餐饭当天回来，肚子还饱饱的。",wordTranslation:"到……去，动词"}],"shi4-s3":[{text:"适有孤鹤，横江东来。",source:"《后赤壁赋》",author:"苏轼",era:"北宋",context:"写夜游赤壁时见鹤。",scene:"「适」修饰「有」，表恰好。",translation:"恰好有一只孤鹤，横穿江面从东边飞来。",wordTranslation:"恰好、正好，副词"}],"shu-s1":[{text:"一男附书至，二男新战死。",source:"《石壕吏》",author:"杜甫",era:"唐",context:"老妇诉说家中遭遇。",scene:"「书」是书信、家信。",translation:"一个儿子捎信回来，两个儿子刚刚战死。",wordTranslation:"书信、家信，名词"}],"shu2-s1":[{text:"吾孰与徐公美？",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"邹忌问妻子自己与徐公谁美。",scene:"「孰」表选择问，译「谁、哪一个」。",translation:"我同徐公相比谁更美？",wordTranslation:"谁、哪一个，疑问代词"}],"shu2-s2":[{text:"明日，徐公来，孰视之，自以为不如。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"邹忌见到徐公本人。",scene:"「孰」通「熟」，是仔细。",translation:"第二天徐公来了，邹忌仔细看他，自认为不如。",wordTranslation:"通「熟」，仔细，副词"}],"shu3-s1":[{text:"有良田美池桑竹之属。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"写桃花源中的景物。",scene:"「属」表类别，译「类」。",translation:"有肥沃的田地、美丽的池塘和桑树竹子之类。",wordTranslation:"类、之类，名词"}],"shu4-s2":[{text:"扶苏以数谏故，上使外将兵。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"写扶苏被派往外地的原因。",scene:"「数」读 shuò，修饰「谏」，是屡次。",translation:"扶苏因为多次劝谏的缘故，皇上派他到外面带兵。",wordTranslation:"屡次、多次，读 shuò"}],"shuai-s1":[{text:"率疲弊之卒，将数百之众。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写陈涉起义的兵力。",scene:"「率」带宾语「卒」，是率领。",translation:"率领疲惫困乏的士兵，带着几百人的队伍。",wordTranslation:"率领、带领，动词"}],"shuo-s2":[{text:"学而时习之，不亦说乎？",source:"《论语·学而》",author:"孔子及弟子",era:"先秦",context:"《论语》开篇。",scene:"「说」读 yuè，通「悦」，是高兴。",translation:"学了又按时温习，不也很愉快吗？",wordTranslation:"通「悦」，高兴，读 yuè"}],"shuo-s3":[{text:"鲰生说我曰：「距关，毋内诸侯。」",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"沛公转述他人建议。",scene:"「说」读 shuì，是劝说、游说。",translation:"有个浅陋的小人劝我说：「把守住函谷关，不要放诸侯进来。」",wordTranslation:"劝说、游说，读 shuì"}],"si-s2":[{text:"燕王私握臣手曰：「愿结友。」",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如陈述自己曾受燕王私托。",scene:"「私」修饰「握」，是私下、暗中。",translation:"燕王私下握着我的手说：「愿意结交为友。」",wordTranslation:"私下、暗中，副词"}],"su-s1":[{text:"素所自树立使然也。",source:"《报任安书》",author:"司马迁",era:"西汉",context:"司马迁论人受辱的根源。",scene:"「素」修饰「所自树立」，是向来。",translation:"是他向来立身处世的方式造成的。",wordTranslation:"向来、一向，副词"}],"su-s2":[{text:"新人工织缣，故人工织素。",source:"《上山采蘼芜》",author:"佚名",era:"汉",context:"弃妇与新人对比。",scene:"「素」指白色的细绢，与「缣」对举。",translation:"新人擅长织黄绢，旧人擅长织白绢。",wordTranslation:"白色的细绢，名词"}],"tu-s1":[{text:"徒善不足以为政。",source:"《孟子·离娄上》",author:"孟子",era:"先秦",context:"孟子论仁政需法度配合。",scene:"「徒」修饰「善」，是只、仅仅。",translation:"只有善心不足以治理好政事。",wordTranslation:"只、仅仅，副词"}],"tu-s2":[{text:"少壮不努力，老大徒伤悲。",source:"《长歌行》",author:"佚名",era:"汉",context:"劝人惜时。",scene:"「徒」修饰「伤悲」，是白白地。",translation:"年轻时不努力，年老时只能白白悲伤。",wordTranslation:"白白地、空，副词"}],"wang2-s1":[{text:"亡去不义，不可不语。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项伯决定告诉张良。",scene:"「亡」是逃走，与「去」连用。",translation:"逃走是不义气的，不能不告诉他。",wordTranslation:"逃走、逃亡，动词"}],"wang3-s1":[{text:"吾视其辙乱，望其旗靡。",source:"《曹刿论战》",author:"左丘明",era:"先秦",context:"曹刿判断齐军败退。",scene:"「望」是远看，与「视」的近看相对。",translation:"我看他们的车轮印乱了，望远看他们的旗帜也倒了。",wordTranslation:"远看、瞭望，动词"}],"e-s1":[{text:"死亦我所恶。",source:"《鱼我所欲也》",author:"孟子",era:"先秦",context:"孟子论舍生取义。",scene:"「恶」读 wù，是厌恶。",translation:"死亡也是我所厌恶的。",wordTranslation:"厌恶、憎恨，读 wù"}],"e-s2":[{text:"恶在其为民父母也？",source:"《孟子·梁惠王上》",author:"孟子",era:"先秦",context:"孟子批评不行仁政的君主。",scene:"「恶」读 wū，表反问处所，译「哪里」。",translation:"他作为百姓父母官的道理又在哪里呢？",wordTranslation:"哪里、怎么，读 wū"}],"wei2-s1":[{text:"微夫人之力不及此。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"晋文公论不攻秦的原因。",scene:"「微」表假设否定，译「如果没有」。",translation:"如果没有那个人的力量，我不会有今天。",wordTranslation:"如果没有，表假设否定"}],"xiang-s1":[{text:"枝枝相覆盖，叶叶相交通。",source:"《孔雀东南飞》",author:"佚名",era:"汉",context:"写墓地树木交错。",scene:"「相」表互相，修饰动词。",translation:"枝枝叶叶互相覆盖交错。",wordTranslation:"互相，副词"}],"xie-s1":[{text:"秦王恐其破璧，乃辞谢。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如持璧睨柱，秦王怕他撞碎。",scene:"「谢」是道歉、谢罪。",translation:"秦王怕他撞碎宝玉，就婉言道歉。",wordTranslation:"道歉、谢罪，动词"}],"xie-s2":[{text:"哙拜谢，起，立而饮之。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙受项羽赐酒。",scene:"「谢」是感谢、拜谢。",translation:"樊哙拜谢，起身，站着把酒喝了。",wordTranslation:"感谢、拜谢，动词"}],"xin-s1":[{text:"烟涛微茫信难求。",source:"《梦游天姥吟留别》",author:"李白",era:"唐",context:"写天姥山难寻。",scene:"「信」修饰「难求」，是确实。",translation:"烟波浩渺，实在难以寻求。",wordTranslation:"确实、实在，副词"}],"xing-s1":[{text:"清风徐来，水波不兴。",source:"《赤壁赋》",author:"苏轼",era:"北宋",context:"写赤壁江面。",scene:"「兴」指兴起、涌起。",translation:"清风缓缓吹来，水面波澜不起。",wordTranslation:"兴起、涌起，动词"}],"xing-s2":[{text:"兴尽悲来，识盈虚之有数。",source:"《滕王阁序》",author:"王勃",era:"唐",context:"王勃由乐转悲。",scene:"「兴」读 xìng，指兴致。",translation:"兴致尽了悲哀袭来，认识到事物的盛衰自有定数。",wordTranslation:"兴致，读 xìng"}],"xing3-s1":[{text:"幸可广问讯，不得便相许。",source:"《孔雀东南飞》",author:"佚名",era:"汉",context:"刘母回复媒人。",scene:"「幸」表希望，是委婉的敬辞。",translation:"希望你可以多方打听，不能就这样答应。",wordTranslation:"希望，表祈使的敬辞"}],"xing3-s2":[{text:"缦立远视，而望幸焉。",source:"《阿房宫赋》",author:"杜牧",era:"唐",context:"写宫女盼望皇帝临幸。",scene:"「幸」指帝王到来、宠幸。",translation:"久久站着远望，盼望皇帝来临幸。",wordTranslation:"帝王宠幸、到来，动词"}],"xiu-s1":[{text:"修守战之具，外连衡而斗诸侯。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写秦孝公改革。",scene:"「修」带宾语「具」，是修造。",translation:"修造防守作战的器械，对外连衡使诸侯相斗。",wordTranslation:"修造、整治，动词"}],"xiu-s2":[{text:"此地有崇山峻岭，茂林修竹。",source:"《兰亭集序》",author:"王羲之",era:"东晋",context:"写兰亭周围景物。",scene:"「修」修饰「竹」，是长、高。",translation:"这里有高峻的山岭、茂密的树林和修长的竹子。",wordTranslation:"长、高，形容词"}],"yang-s1":[{text:"以其乃华山之阳名之也。",source:"《游褒禅山记》",author:"王安石",era:"北宋",context:"王安石考订山名来历。",scene:"「阳」指山的南面，是方位专名用法。",translation:"因为它在华山的南面而这样命名。",wordTranslation:"山的南面，名词"}],"yao-s1":[{text:"便要还家，设酒杀鸡作食。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"桃花源中人邀请渔人到家。",scene:"「要」读 yāo，通「邀」，是邀请。",translation:"就邀请他到自己家里去，摆酒杀鸡做饭。",wordTranslation:"通「邀」，邀请，读 yāo"}],"yao-s2":[{text:"要之，治平之久，天地不能不生人。",source:"《治平篇》",author:"洪亮吉",era:"清",context:"洪亮吉论人口增长。",scene:"「要之」是「总之」，用于总结上文。",translation:"总之，太平的时间久了，天地不能不使人繁衍。",wordTranslation:"总之，用于总括"}],"yi2-s1":[{text:"今大王亦宜斋戒五日。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如要求秦王斋戒。",scene:"「宜」表应当，语气比「必」委婉。",translation:"现在大王也应该斋戒五天。",wordTranslation:"应当、应该，副词"}],"yi2-s2":[{text:"宜其渥然丹者为槁木。",source:"《秋声赋》",author:"欧阳修",era:"北宋",context:"欧阳修写秋气摧折万物。",scene:"「宜」在句首，表「当然、无怪乎」。",translation:"难怪那些红润的面容变成了枯木。",wordTranslation:"当然、无怪乎，副词"}],"yi3-s1":[{text:"秦无亡矢遗镞之费。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写诸侯攻秦的损失。",scene:"「遗」是丢失、遗失。",translation:"秦国没有丢失一支箭、一个箭头的耗费。",wordTranslation:"丢失、遗失，动词"}],"yi3-s2":[{text:"厚遗秦王宠臣中庶子蒙嘉。",source:"《荆轲刺秦王》",author:"刘向",era:"西汉",context:"荆轲重金贿赂秦王宠臣。",scene:"「遗」读 wèi，是赠送。",translation:"用厚礼赠送给秦王的宠臣中庶子蒙嘉。",wordTranslation:"赠送、给予，读 wèi"}],"yi4-s1":[{text:"静女其娈，贻我彤管。",source:"《诗经·邶风·静女》",author:"佚名",era:"先秦",context:"写恋人赠物。",scene:"「贻」是赠送，与「遗」音义相近。",translation:"娴静的姑娘真美丽，送我一枝红管草。",wordTranslation:"赠送，动词"}],"yi5-s1":[{text:"罢夫羸老易子而咬其骨。",source:"《论积贮疏》",author:"贾谊",era:"西汉",context:"写灾年饥荒惨状。",scene:"「易」是交换。",translation:"疲弱衰老的人交换孩子来吃。",wordTranslation:"交换，动词"}],"yin2-s1":[{text:"指通豫南，达于汉阴。",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"愚公规划移山后的通路。",scene:"「阴」指水的南面，与「阳」相对。",translation:"一直通到豫州南部，到达汉水南岸。",wordTranslation:"水的南面，名词"}],"you-s2":[{text:"东西植松柏，左右种梧桐。",source:"《孔雀东南飞》",author:"佚名",era:"汉",context:"写墓地树木。",scene:"「左右」是方位，指两旁。",translation:"东西两边种上松柏，左右两旁种上梧桐。",wordTranslation:"右边、两旁，方位名词"}],"zao-s1":[{text:"造饮辄尽，期在必醉。",source:"《五柳先生传》",author:"陶渊明",era:"东晋",context:"写五柳先生饮酒。",scene:"「造」是到、往。",translation:"去喝酒总是把酒喝完，希望一定喝醉。",wordTranslation:"到、往，动词"}],"zhi2-s1":[{text:"知之为知之，不知为不知，是知也。",source:"《论语·为政》",author:"孔子及弟子",era:"先秦",context:"孔子论对待知识的态度。",scene:"前三个「知」是知道，末一个通「智」。",translation:"知道就是知道，不知道就是不知道，这才是明智。",wordTranslation:"知道、懂得，动词"}],"zhi2-s2":[{text:"小知不及大知，小年不及大年。",source:"《逍遥游》",author:"庄周",era:"先秦",context:"庄子论境界大小。",scene:"「知」读 zhì，通「智」，指智慧。",translation:"小智比不上大智，短寿比不上长寿。",wordTranslation:"通「智」，智慧，读 zhì"}],"zhi3-s1":[{text:"然秦以区区之地，致万乘之势。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"写秦由小到大。",scene:"「致」表达到，带宾语「势」。",translation:"然而秦国凭借狭小的地盘，达到万辆兵车的国势。",wordTranslation:"达到、获得，动词"}],"zhi4-s1":[{text:"乃令张仪佯去秦，厚币委质事楚。",source:"《屈原列传》",author:"司马迁",era:"西汉",context:"写张仪欺楚。",scene:"「质」是信物，引申为做人质的凭证。",translation:"于是让张仪假装离开秦国，带着厚礼和信物去侍奉楚国。",wordTranslation:"信物、人质，名词"}],"zhu-s1":[{text:"献诸抚军。",source:"《促织》",author:"蒲松龄",era:"清",context:"成名把蟋蟀献给巡抚。",scene:"「诸」是「之于」的合音兼词。",translation:"把它献给巡抚。",wordTranslation:"兼词，等于「之于」"}],"zei-s2":[{text:"贼仁者谓之贼。",source:"《孟子·梁惠王下》",author:"孟子",era:"先秦",context:"孟子论弑君。",scene:"「贼」作动词，是残害。",translation:"残害仁德的人叫作「贼」。",wordTranslation:"残害、伤害，动词"}],"zu2-s1":[{text:"卒廷见相如，毕礼而归之。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"秦王最终接见蔺相如。",scene:"「卒」修饰全句，表最终、终于。",translation:"最终在朝廷上接见蔺相如，完成礼节后送他回去。",wordTranslation:"终于、最终，副词"}],"zu2-s2":[{text:"卒然边境有急，数千百万之众，国胡以馈之？",source:"《论积贮疏》",author:"贾谊",era:"西汉",context:"贾谊论积贮的重要。",scene:"「卒」读 cù，通「猝」，是突然。",translation:"突然边境有紧急情况，成千上百万的军队，国家拿什么供养他们？",wordTranslation:"通「猝」，突然，读 cù"}],"zuo2-s2":[{text:"但坐观罗敷。",source:"《陌上桑》",author:"佚名",era:"汉",context:"写路人因看罗敷而误事。",scene:"「坐」表原因，译「因为」。",translation:"只因为看罗敷（耽误了活）。",wordTranslation:"因为，介词"}],"xiang2-s1":[{text:"寻向所志，遂迷，不复得路。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"渔人再寻桃花源。",scene:"「向」指从前、先前。",translation:"寻找先前所做的标记，竟然迷失了，再也找不到路。",wordTranslation:"从前、先前，副词"}],"xiang2-s2":[{text:"向晚意不适，驱车登古原。",source:"《登乐游原》",author:"李商隐",era:"唐",context:"傍晚登原遣怀。",scene:"「向晚」是接近傍晚。",translation:"傍晚时心情不好，驾车登上乐游原。",wordTranslation:"接近、将近，动词"}],"ye2-s1":[{text:"先帝创业未半而中道崩殂。",source:"《出师表》",author:"诸葛亮",era:"三国",context:"诸葛亮追述先主。",scene:"「业」指事业、基业。",translation:"先帝开创的事业还没完成一半就中途去世。",wordTranslation:"事业、基业，名词"}],"chao-s3":[{text:"朝廷之臣莫不畏王，四境之内莫不有求于王。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"邹忌分析齐王受蒙蔽之深。",scene:"「朝」读 cháo，指朝廷。",translation:"朝廷上的臣子没有谁不怕大王，全国范围内没有谁不有求于大王。",wordTranslation:"朝廷，名词"}],"cheng-s2":[{text:"乘醉听箫鼓，吟赏烟霞。",source:"《望海潮》",author:"柳永",era:"北宋",context:"写杭州游乐之盛。",scene:"「乘」表趁着某种状态。",translation:"趁着醉意听箫鼓，吟诗欣赏烟霞。",wordTranslation:"趁着、凭借，动词"}],"cheng2-s3":[{text:"精诚所至，金石为开。",source:"《后汉书·广陵思王荆传》",author:"范晔",era:"南朝",context:"论至诚的力量。",scene:"「诚」作名词，指诚心。",translation:"真诚所到之处，金石也能被打开。",wordTranslation:"诚心、真诚，名词"}],"dang-s3":[{text:"臣知欺大王之罪当诛。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如请就汤镬。",scene:"「当」表按律判处，译「判处、应当」。",translation:"我知道欺骗大王的罪应当处死。",wordTranslation:"判处、该当，动词"}],"jiu-s3":[{text:"臣具以表闻，辞不就职。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密辞谢任命。",scene:"「就」带宾语「职」，是赴任、就任。",translation:"我把情况详细上表奏明，推辞不去就职。",wordTranslation:"赴任、就任，动词"}],"lei-s1":[{text:"中绘殿阁，类兰若。",source:"《促织》",author:"蒲松龄",era:"清",context:"描写蟋蟀笼中的景致。",scene:"「类」表相似，译「像」。",translation:"中间画着殿阁，像寺院一样。",wordTranslation:"像、类似，动词"}],"qian-s3":[{text:"感斯人言，是夕始觉有迁谪意。",source:"《琵琶行》序",author:"白居易",era:"唐",context:"白居易听琵琶女身世后自伤。",scene:"「迁」指贬谪、放逐。",translation:"被这个人的话触动，这天晚上才感到有被贬谪的意味。",wordTranslation:"贬谪、放逐，动词"}],"qing-s1":[{text:"事急矣，请奉命求救于孙将军。",source:"《赤壁之战》",author:"司马光",era:"北宋",context:"诸葛亮请命出使东吴。",scene:"「请」是请允许我，表谦敬。",translation:"事情紧急了，请允许我奉命向孙将军求救。",wordTranslation:"请允许我，表谦敬"}],"shan-s2":[{text:"余宗老涂山，左公甥也，与先君子善。",source:"《左忠毅公逸事》",author:"方苞",era:"清",context:"方苞交代与左光斗的渊源。",scene:"「善」带介词宾语，是交好。",translation:"我的族中长辈涂山，是左公的外甥，和我父亲交好。",wordTranslation:"与……交好，动词"}],"si-s1":[{text:"不宜偏私，使内外异法也。",source:"《出师表》",author:"诸葛亮",era:"三国",context:"诸葛亮谏刘禅赏罚公平。",scene:"「私」指偏私、私心。",translation:"不应当偏袒徇私，使宫内宫外法度不同。",wordTranslation:"偏私、私心，名词"}],"tang-s1":[{text:"臣侍汤药，未曾废离。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密陈述侍奉祖母。",scene:"「汤」指汤药，由「热水」引申。",translation:"我侍奉她喝汤药，从未停止离开。",wordTranslation:"汤药、热水，名词"}],"tang-s2":[{text:"汤汤乎若流水。",sou
