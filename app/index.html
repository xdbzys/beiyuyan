  <script>
  (function () {
    'use strict';
    try {
      /* 与 src/update.js 的 resolveFrom() 同一规则：new URL 解析后继承当前页查询串，
         保证 ?sharecode=... 分享凭据透传到同源静态资源，冷启动首次导航不触发 403。 */
      function resolveFrom(rel) {
        var url = new URL(rel, window.location.href);
        new URLSearchParams(window.location.search).forEach(function (value, key) {
          if (!url.searchParams.has(key)) url.searchParams.append(key, value);
        });
        return url.href;
      }
      function addLink(rel, href, attrs) {
        var link = document.createElement('link');
        link.setAttribute('rel', rel);
        Object.keys(attrs || {}).forEach(function (key) {
          link.setAttribute(key, attrs[key]);
        });
        link.setAttribute('href', href);
        document.head.appendChild(link);
      }
      /* 静态 <link> 已从部署版移除，改由本段在解析阶段动态创建，避免提前发出无凭据请求。 */
      addLink('manifest', resolveFrom('./manifest.webmanifest'));
      addLink('icon', resolveFrom('./icon.svg'), { type: 'image/svg+xml' });
      addLink('apple-touch-icon', resolveFrom('./icon-192.png'), { sizes: '192x192' });
      var meta = document.createElement('meta');
      meta.setAttribute('name', 'mobile-web-app-capable');
      meta.setAttribute('content', 'yes');
      document.head.appendChild(meta);
      /* SW 注册仅 http/https 且支持 serviceWorker 时执行，file:// 完全跳过。 */
      var protocol = window.location.protocol;
      if (protocol !== 'http:' && protocol !== 'https:') return;
      if (!('serviceWorker' in navigator)) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register(resolveFrom('./sw.js')).catch(() => {});
      });
    } catch (error) { /* 静默降级，绝不阻塞背诵主流程 */ }
  })();

anslation:"鄙，边远的地方"},{text:"越国以鄙远，君知其难也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武论晋灭郑后必欲西扩。",translation:"越过晋国把远方的郑国当作边邑，您知道那是很难的。",wordTranslation:"鄙，把……当作边邑（意动）"}]},{id:"bi-s2",gloss:"形容词，浅陋、见识短浅",modern:"浅陋 / 见识短",scene:"多形容人的见识、地位。",usageHint:"「肉食者鄙」指居高位者目光短浅。",examples:[{text:"肉食者鄙，未能远谋。",source:"《曹刿论战》",author:"左丘明",era:"先秦",context:"曹刿论当权者目光短浅。",translation:"当权的人目光短浅，不能深谋远虑。",wordTranslation:"鄙，浅陋、见识短"},{text:"先帝不以臣卑鄙，猥自枉屈。",source:"《出师表》",author:"诸葛亮",era:"三国",context:"诸葛亮自谦出身低微。",translation:"先帝不因为我身份低微、见识短浅，委屈地降低身份。",wordTranslation:"鄙，见识短浅（卑鄙=身份低微、见识短浅）"}]},{id:"bi-s3",gloss:"动词，轻视、看不起",modern:"轻视 / 看不起",scene:"后接人作宾语。",usageHint:"「鄙」作谓语带宾语多为「轻视」。",examples:[{text:"孔子鄙其小器。",source:"《训俭示康》",author:"司马光",era:"北宋",context:"孔子评管仲器量狭小。",translation:"孔子轻视他器量狭小。",wordTranslation:"鄙，轻视"}]}],gaokaoHints:[{type:"高考资料",text:"「越国以鄙远」的「鄙」为意动，译「把……当作边邑」，是翻译题高频采分点。",ref:"高考·文言实词"}],flexUsage:{has:!0,items:[{type:"意动用法",text:"越国以鄙远。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",explanation:"「鄙」名词意动，把远方的郑国当作边邑。"}]},ancientModern:{has:!0,items:[{ancient:"卑鄙：身份低微、见识短浅",modern:"卑鄙：品行恶劣",text:"先帝不以臣卑鄙。",source:"《出师表》",author:"诸葛亮",explanation:"古今异义，今指品德恶劣，古为中性自谦。"}]}},{id:"bing2",char:"病",pinyin:"bìng",category:"实词",pos:"名词/动词/形容词",summary:"疾病；患病；困苦、疲惫；担心、责备；重。",examPoint:"考点：① 名词，疾病（「君之病在肌肤」）；② 动词，患病；③ 形容词，困苦不堪（「久已病矣」）；④ 动词，担心、忧虑（「君子病无能焉」）；⑤ 形容词，疲惫（「今日病矣」）。高考重「困苦」「担心」两个引申义。",senses:[{id:"bing2-s1",gloss:"名词，疾病；动词，患病",modern:"病 / 生病",scene:"本义。",usageHint:"「病」与「疾」义近，「病」多指重病。",examples:[{text:"君之病在肌肤，不治将益深。",source:"《扁鹊见蔡桓公》",author:"韩非",era:"先秦",context:"扁鹊屡劝桓公治病。",translation:"您的病在肌肤里，不治将会更加严重。",wordTranslation:"病，疾病"},{text:"相如每朝时，常称病。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如避让廉颇。",translation:"蔺相如每逢上朝时，常常声称有病。",wordTranslation:"病，生病"}]},{id:"bing2-s2",gloss:"形容词，困苦不堪；疲惫",modern:"困苦 / 疲惫",scene:"形容处境或身体状态。",usageHint:"「久已病矣」指困苦到极点。",examples:[{text:"向吾不为斯役，则久已病矣。",source:"《捕蛇者说》",author:"柳宗元",era:"唐",context:"蒋氏自述捕蛇虽险却免于困苦。",translation:"从前我要是不干这差事，早就困苦不堪了。",wordTranslation:"病，困苦不堪"},{text:"今日病矣，予助苗长矣。",source:"《孟子·公孙丑上》",author:"孟轲",era:"先秦",context:"揠苗助长寓言。",translation:"今天我累坏了，我帮助禾苗长高了。",wordTranslation:"病，疲惫"}]},{id:"bing2-s3",gloss:"动词，担心、忧虑；责备",modern:"担心 / 责备",scene:"后接所忧之事。",usageHint:"「病无能」即担心没有才能。",examples:[{text:"君子病无能焉，不病人之不己知也。",source:"《论语·卫灵公》",author:"孔子及弟子",era:"先秦",context:"孔子论君子当自责。",translation:"君子只担心自己没有才能，不担心别人不了解自己。",wordTranslation:"病，担心"}]}],gaokaoHints:[{type:"高考资料",text:"「病」由「疾病」引申为「困苦」「担心」，翻译时须据语境选义，不可一律译「生病」。",ref:"高考·文言实词"}]},{id:"cha",char:"察",pinyin:"chá",category:"实词",pos:"动词",summary:"观察、仔细看；明察、考察；推举、选拔。",examPoint:"考点：① 动词，观察、看（「俯察品类之盛」）；② 动词，考察、明察（「察邻国之政」）；③ 动词，推举、选拔（「察臣孝廉」，汉代察举制）。高考重「考察」与「推举」两义。",senses:[{id:"cha-s1",gloss:"动词，观察、仔细看",modern:"观察 / 看",scene:"后接所看之物。",usageHint:"「察」本义为细看。",examples:[{text:"仰观宇宙之大，俯察品类之盛。",source:"《兰亭集序》",author:"王羲之",era:"东晋",context:"兰亭集会极目游观。",translation:"抬头观望宇宙的广大，低头细看万物的繁盛。",wordTranslation:"察，观察"}]},{id:"cha-s2",gloss:"动词，考察、明察",modern:"考察 / 明察",scene:"后接政事、情理。",usageHint:"「察邻国之政」即考察邻国政事。",examples:[{text:"察邻国之政，无如寡人之用心者。",source:"《寡人之于国也》",author:"孟轲",era:"先秦",context:"梁惠王自夸治国用心。",translation:"考察邻国的政事，没有像我这样尽心的。",wordTranslation:"察，考察"}]},{id:"cha-s3",gloss:"动词，推举、选拔",modern:"推举 / 选拔",scene:"汉代察举制用语。",usageHint:"「察臣孝廉」即推举我为孝廉。",examples:[{text:"前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密陈说曾被举荐。",translation:"先前太守逵推举我为孝廉，后来刺史荣又推举我为秀才。",wordTranslation:"察，推举（与「举」互文）"}]}],gaokaoHints:[{type:"文言文资料",text:"「察」在汉代指「察举」，与「举」同义连用，翻译为「推举、选拔」。",ref:"《陈情表》注"}]},{id:"chao",char:"朝",pinyin:"zhāo / cháo",category:"实词",pos:"名词/动词",summary:"早晨（zhāo）；朝见、朝拜；朝廷。",examPoint:"考点：① 名词，早晨（读 zhāo，「朝服衣冠」）；② 动词，朝见、朝拜（「相如每朝时」）；③ 名词，朝廷（「入朝见威王」）。「朝」为多音多义字，须据义定音。",senses:[{id:"chao-s1",gloss:"名词，早晨（zhāo）",modern:"早晨",scene:"表时间。",usageHint:"读 zhāo。",examples:[{text:"朝服衣冠，窥镜，谓其妻曰……",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"先秦",context:"邹忌晨起照镜。",translation:"早晨穿好衣服戴上帽子，照着镜子，对他的妻子说……",wordTranslation:"朝，早晨"}]},{id:"chao-s2",gloss:"动词，朝见、朝拜",modern:"朝见 / 朝拜",scene:"臣下见君或诸侯相见。",usageHint:"读 cháo。",examples:[{text:"相如每朝时，常称病，不欲与廉颇争列。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如避让廉颇。",translation:"蔺相如每逢上朝时，常常声称有病，不愿与廉颇争位次。",wordTranslation:"朝，上朝、朝见"}]},{id:"chao-s3",gloss:"名词，朝廷",modern:"朝廷",scene:"指君主听政之处。",usageHint:"读 cháo。",examples:[{text:"于是入朝见威王。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"先秦",context:"邹忌入朝进谏。",translation:"于是（邹忌）进入朝廷拜见齐威王。",wordTranslation:"朝，朝廷"}]}],gaokaoHints:[{type:"高考资料",text:"「朝」多音多义：zhāo 早晨、cháo 朝见/朝廷，文言翻译与断句常借读音辨义。",ref:"高考·文言实词"}]},{id:"ceng",char:"曾",pinyin:"céng / zēng",category:"实词",pos:"副词",summary:"曾经（céng）；竟然、竟（céng）；通「增」，增加（zēng）。",examPoint:"考点：① 副词，曾经（「人道寄奴曾住」）；② 副词，竟然、竟（「曾不若孀妻弱子」）；③ 通「增」，增加（「曾益其所不能」）。「曾不」连用表「竟不」，是高频易错。",senses:[{id:"ceng-s1",gloss:"副词，曾经",modern:"曾经",scene:"表过去的经历。",usageHint:"读 céng。",examples:[{text:"斜阳草树，寻常巷陌，人道寄奴曾住。",source:"《永遇乐·京口北固亭怀古》",author:"辛弃疾",era:"南宋",context:"怀古凭吊刘裕旧居。",translation:"斜阳照着草木，普通的街巷，人们说刘裕曾在这里住过。",wordTranslation:"曾，曾经"}]},{id:"ceng-s2",gloss:"副词，竟然、竟",modern:"竟然 / 竟",scene:"加强语气，多与「不」连用。",usageHint:"「曾不」=竟不。",examples:[{text:"以君之力，曾不能损魁父之丘。",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"家人质疑愚公之力。",translation:"凭您的力量，竟不能削平魁父这座小山。",wordTranslation:"曾，竟、竟然"},{text:"曾不若孀妻弱子。",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"智叟讥笑愚公。",translation:"竟比不上寡妇和小孩。",wordTranslation:"曾，竟"}]},{id:"ceng-s3",gloss:"通「增」，增加（zēng）",modern:"增加",scene:"通假用法。",usageHint:"「曾益」即「增益」。",examples:[{text:"所以动心忍性，曾益其所不能。",source:"《生于忧患，死于安乐》",author:"孟轲",era:"先秦",context:"论磨难使人增长才干。",translation:"用来使他的心惊动，使他的性格坚忍，增加他所不具备的才能。",wordTranslation:"曾，通「增」，增加"}]}],gaokaoHints:[{type:"高考资料",text:"「曾不」是固定搭配，译「竟然不」，常出现在翻译题中，易误译为「曾经不」。",ref:"高考·文言实词"}],ancientModern:{has:!0,items:[{ancient:"曾：通「增」，增加",modern:"曾：曾经",text:"曾益其所不能。",source:"《生于忧患，死于安乐》",author:"孟轲",explanation:"通假字，「曾」通「增」。"}]}},{id:"cheng",char:"乘",pinyin:"chéng / shèng",category:"实词",pos:"动词/量词",summary:"乘坐、登上；趁着、凭借；量词，兵车（shèng）。",examPoint:"考点：① 动词，登上（「乘彼垝垣」）；② 动词，趁着、凭借（「因利乘便」）；③ 量词，古代四马一车为一乘（「万乘之 2",char:"向",pinyin:"xiàng",category:"实词",pos:"副词/动词",summary:"从前、先前；接近；朝向。",examPoint:"考点：① 副词，从前、先前（「向吾不为斯役」）；② 动词，接近（「向昏黑」）；③ 动词，朝向。高考重「从前」义。",senses:[{id:"xiang2-s1",gloss:"副词，从前、先前",modern:"从前 / 先前",scene:"表过去。",usageHint:"「向吾」即从前我。",examples:[{text:"向吾不为斯役，则久已病矣。",source:"《捕蛇者说》",author:"柳宗元",era:"唐",context:"蒋氏自述捕蛇虽险却免于困苦。",translation:"从前我要是不干这差事，早就困苦不堪了。",wordTranslation:"向，从前"}]},{id:"xiang2-s2",gloss:"动词，接近",modern:"接近",scene:"表临近。",usageHint:"「向昏黑」即接近天黑。",examples:[{text:"俄顷风定云墨色，秋天漠漠向昏黑。",source:"《茅屋为秋风所破歌》",author:"杜甫",era:"唐",context:"写秋夜屋破之景。",translation:"一会儿风停了，云变成墨色，秋日的天空阴沉迷蒙，渐渐接近天黑。",wordTranslation:"向，接近"}]}],gaokaoHints:[{type:"高考资料",text:"「向」作副词表「从前」是古义高频，与今义「方向/朝向」须区分。",ref:"高考·文言实词"}]},{id:"ye2",char:"业",pinyin:"yè",category:"实词",pos:"名词/副词",summary:"事业、学业；已经。",examPoint:"考点：① 名词，事业、学业（「业精于勤」）；② 副词，已经（「若业为吾所有」）。「业」表「已经」是高频。",senses:[{id:"ye2-s1",gloss:"名词，事业、学业",modern:"事业 / 学业",scene:"表所从事之事。",usageHint:"「业精」即学业精进。",examples:[{text:"业精于勤，荒于嬉；行成于思，毁于随。",source:"《进学解》",author:"韩愈",era:"唐",context:"韩愈论治学。",translation:"学业靠勤奋才能精进，因嬉戏而荒废；德行靠思考才能形成，因随波逐流而毁坏。",wordTranslation:"业，学业"}]},{id:"ye2-s2",gloss:"副词，已经",modern:"已经",scene:"表完成。",usageHint:"「业为」即已经成了。",examples:[{text:"若业为吾所有，必高束焉，庋藏焉。",source:"《黄生借书说》",author:"袁枚",era:"清",context:"论借书与藏书之别。",translation:"如果已经被我所有，就一定把它捆起来放在高处，收藏起来。",wordTranslation:"业，已经"}]}],gaokaoHints:[{type:"高考资料",text:"「业」作副词表「已经」是古义高频，须与今义「事业」区分。",ref:"高考·文言实词"}]}],wn=[{id:"zhi",char:"之",pinyin:"zhī",category:"虚词",pos:"代词/助词/动词",summary:"文言最高频虚词。核心用法：结构助词「的」、主谓间取消句子独立性（不译）、代词（代人/事/物）、宾语前置标志（不译）、动词「到……去」。",examPoint:"考点：① 结构助词「的」用于定语与中心语之间；② 主谓之间取消独立性，不译（前后是「主+谓」而非「修饰语+名词」）；③ 代词作宾语，译时要补出指代对象；④ 宾语前置标志（「句读之不知」）；⑤ 偶尔实化为动词「到……去」。高考翻译常考补出指代与判读「不译」两项。",senses:[{id:"zhi-s1",gloss:"结构助词，相当于「的」，连接定语与中心语",modern:"的",scene:"名词性偏正结构里，前项修饰后项；译时把「之」换成「的」。",usageHint:"与 S3 区分：S1 前后是「修饰语+名词」，S3 前后是「主语+谓语」。",examples:[{text:"古之学者必有师。",source:"《师说》",author:"韩愈",era:"唐",context:"开篇立论：自古以来求学的人一定有老师。",translation:"古代求学的人必定有老师。",wordTranslation:"的，连接定语「古」与中心语「学者」"},{text:"是寡人之过也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"郑文公向烛之武认错。",translation:"这是我的过错。",wordTranslation:"的，连接领属定语「寡人」与「过」"},{text:"此则岳阳楼之大观也。",source:"《岳阳楼记》",author:"范仲淹",era:"北宋",context:"总写巴陵胜状。",translation:"这就是岳阳楼的壮丽景象。",wordTranslation:"的，连接定语「岳阳楼」与中心语「大观」"}]},{id:"zhi-s2",gloss:"代词，代人、代物、代事，多作宾语",modern:"他 / 她 / 它 / 这件事",scene:"动词或介词之后，指代上文已出现的人、物或事件。",usageHint:"高考翻译题常考「补出指代对象」，如「公从之」要译成「听从了他（的建议）」。",examples:[{text:"公从之。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"郑文公采纳佚之狐建议。",translation:"郑文公听从了他（佚之狐的建议）。",wordTranslation:"他 / 这件事，代佚之狐的建议"},{text:"爱其子，择师而教之。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈批评人们疼爱孩子却自己耻于从师。",translation:"（人们）疼爱自己的孩子，选择老师来教他。",wordTranslation:"他，代前文的「其子」"},{text:"项王则受璧，置之坐上。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"张良代刘邦献白璧。",translation:"项王接受了白璧，把它放在座位上。",wordTranslation:"它，代白璧"}]},{id:"zhi-s3",gloss:"结构助词，用在主谓之间，取消句子独立性，不译",modern:"不译（把主谓结构变成短语）",scene:"一个本可独立的「主语+谓语」被当作句子的主语、宾语或状语使用时，中间加「之」。",usageHint:"识别口诀：「之」后若是动词/形容词且能还原成主谓句，多半是取消独立性，不是「的」。",examples:[{text:"臣之壮也，犹不如人；今老矣，无能为也已。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武推辞出使。",translation:"我壮年的时候，尚且不如别人；现在老了，不能干什么了。",wordTranslation:"不译，用在主谓「臣壮」之间，取消独立性作时间状语"},{text:"行李之往来，共其乏困，君亦无所害。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武劝秦伯留郑作东道主。",translation:"出使的人来来往往，（郑国）供给他们缺少的东西，对您也没有什么害处。",wordTranslation:"不译，用在主谓「行李往来」之间，取消独立性"},{text:"邻之厚，君之薄也。",source:"《烛之武退秦师》",author:"左丘明",era:"先秦",context:"烛之武指出灭郑只会使晋强秦弱。",translation:"邻国（晋国）势力雄厚了，就是您秦国势力削弱了。",wordTranslation:"不译，两处「之」都用在主谓之间"}]},{id:"zhi-s4",gloss:"宾语前置的标志，不译",modern:"不译（宾语前置标志）",scene:"否定句/疑问句代词宾语前置，或「唯……是……」结构中，动词与宾语之间加「之」。",usageHint:"「句读之不知，惑之不解」「唯利是图」中「之」是提宾标志，还原即「不知句读」。",examples:[{text:"句读之不知，惑之不解，或师焉，或不焉。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈批评时人不知从师，小的方面学了大的却放弃。",translation:"不懂得断句，不能解决疑惑，有的向老师学，有的不向老师学。",wordTranslation:"不译，宾语前置标志（不知句读 / 不解惑）"},{text:"宋何罪之有？",source:"《公输》",author:"墨翟",era:"先秦",context:"墨子责问楚王攻宋的理由。",translation:"宋国有什么罪过呢？",wordTranslation:"不译，宾语前置标志（有何罪）"}]},{id:"zhi-s5",gloss:"动词，到……去、往",modern:"到 / 往",scene:"后接处所，作谓语，是虚词实化，备考按一词多义记。",usageHint:"与助词/代词用法区分：S5 后接地点名词且作谓语。",examples:[{text:"项伯乃夜驰之沛公军，私见张良，具告以事。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项伯连夜赶往刘邦军营告知项羽将袭。",translation:"项伯就连夜骑马跑到沛公的军营，私下会见张良，把事情全都告诉了他。",wordTranslation:"到……去，后接处所「沛公军」作谓语"},{text:"至之市，而忘操之。",source:"《郑人买履》",author:"韩非",era:"先秦",context:"郑人去买鞋，到了集市却忘了带尺码。",translation:"到了集市，却忘了带量好的尺码。",wordTranslation:"到……去，「之市」即到集市"}]}],gaokaoHints:[{type:"高考资料",text:"《考试大纲》将「之」列为 18 个常见文言虚词之首，考查频率最高，重点在「的 / 不译 / 代词」三用的判别。",ref:"高考语文考试大纲·文言虚词"},{type:"高考试题",text:"全国卷翻译题常出现「之」作代词需补出指代（如「从之」「置之」），或主谓之间不译。",ref:"历年全国卷真题"}],relatedPatterns:["judgment","obj-front","attrib-post"]},{id:"qi",char:"其",pinyin:"qí",category:"虚词",pos:"代词/副词/助词",summary:"主要作代词（他的/他们的、那、其中），也作语气副词表推测、反问、祈使、期望；可作指示代词「那、那些」。",examPoint:"考点：① 第三人称代词领属「他的/它的」；② 指示代词「那/那些/其中的」；③ 语气副词（表推测「大概」、反问「难道」、祈使「可要」），不充当成分；④ 一般不作第二人称「你的」（由「乃」承担）。高考多选其后接名词还是位于句首谓语前判断词性。",senses:[{id:"qi-s1",gloss:"人称代词，他（们）的、它（们）的，作领属定语",modern:"他的 / 他们的 / 它的",scene:"名词前表示领属；必须先回指上文的先行词。",usageHint:"注意「其」一般不作第二人称「你的」；「尔其无忘乃父之志」里「你的」由「乃」承担。",examples:[{text:"爱其子，择师而教之。",source:"《师说》",author:"韩愈",era:"唐",context:"世人疼爱子女、为子女择师。",translation:"（人们）疼爱自己的孩子，选择老师来教他。",wordTranslation:"自己的 / 他的，指前文「人」的孩子"},{text:"吾令人望其气，皆为龙虎，成五采，此天子气也。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增以望气之说劝项羽除刘邦。",translation:"我派人观望他那边的云气，都是龙虎的形状，呈五彩，这是天子的云气啊。",wordTranslation:"他的，指刘邦（驻地）"}]},{id:"qi-s2",gloss:"指示代词，那、那些、其中的",modern:"那 / 那些 / 其中",scene:"指代远指或范围中的一部分；「其中的」常用于数词前。",usageHint:"「其中的」常出现在分数/部分前，如「以其智乱其中的」。",examples:[{text:"其人视端容寂，若听茶声然。",source:"《核舟记》",author:"魏学洢",era:"明",context:"写核舟上两个舟子的神态。",translation:"那个人眼睛正视、神色平静，好像在听茶水烧开的声音。",wordTranslation:"那，远指代词"},{text:"少时，一狼径去，其一犬坐于前。",source:"《狼》",author:"蒲松龄",era:"清",context:"屠户遇两狼，一狼假装睡觉。",translation:"一会儿，一只狼径直走开，其中一只像狗一样坐在前面。",wordTranslation:"其中的，指代两狼中的一只"}]},{id:"qi-s3",gloss:"语气副词，表推测「大概」、反问「难道」、祈使「可要」",modern:"大概 / 难道 / 可要、一定",scene:"句首或谓语前，不充当句子成分；结合句末语气词判断：配「乎」多推测，配「也欤」多反问。",usageHint:"语气副词要据语境与句末语气词判定，不能只看位置。",examples:[{text:"圣人之所以为圣，愚人之所以为愚，其皆出于此乎？",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈探讨圣愚差别的根源。",translation:"圣人成为圣人、愚人成为愚人的原因，大概都出于这里吧？",wordTranslation:"大概，表推测，配「乎」"},{text:"其孰能讥之乎？",source:"《游褒禅山记》",author:"王安石",era:"北宋",context:"王安石感慨尽志而无悔。",translation:"难道谁还能讥笑他吗？",wordTranslation:"难道，表反问，配「乎」"}]}],gaokaoHints:[{type:"高考资料",text:"「其」作语气副词时绝不作句子成分，是高频考点；区分「其+名词」(代词)与「其+动词/句首」(副词)是解题关键。",ref:"高考语文·文言虚词辨析"},{type:"文言文资料",text:"《古文观止》中「其」用于主语前的推测/反问极为常见，备考应积累典型句。",ref:"《古文观止》"}]},{id:"er",char:"而",pinyin:"ér",category:"虚词",pos:"连词/代词",summary:"最常用连词：表并列、递进、承接、转折、修饰（偏正）、因果、假设；偶作代词「你（们）」。",examPoint:"考点：① 并列（又/并且，可不译）；② 承接（就/然后，时间先后）；③ 转折（却/但是）；④ 修饰（地，连接状中）；⑤ 因果（因而）；⑥ 假设（如果）。判定看前后分句逻辑关系是高考常考。代词语气「你」仅见于「而翁」。",senses:[{id:"er-s1",gloss:"连词，表并列或递进",modern:"又 / 并且 / 而且",scene:"连接两个地位相当的词、短语或分句，可译可不译。",usageHint:"并列关系前后可互换位置而不改变基本意思。",examples:[{text:"蟹六跪而二螯。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子以蟹反衬积善成德需专一。",translation:"螃蟹有六条腿和两个钳子。",wordTranslation:"而，并列连词，连接「六跪」与「二螯」"},{text:"剑阁峥嵘而崔嵬。",source:"《蜀道难》",author:"李白",era:"唐",context:"极写剑阁高险。",translation:"剑阁高峻而又陡峭。",wordTranslation:"而，递进/并列，又、而且"}]},{id:"er-s2",gloss:"连词，表转折",modern:"却 / 但是",scene:"前后语义相对或相反。",usageHint:"转折是高考最高频考法，注意与承接区分。",examples:[{text:"青，取之于蓝，而青于蓝。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子论学习使人超越本性。",translation:"靛青，从蓝草中提取，却比蓝草颜色更深。",wordTranslation:"却，表转折"},{text:"冰，水为之，而寒于水。",source:"《劝学》",author:"荀况",era:"先秦",context:"同上。",translation:"冰，是水凝结成的，却比水更冷。",wordTranslation:"却，表转折"}]},{id:"er-s3",gloss:"连词，表修饰（状中）",modern:"地 / 着（不译）",scene:"前为动词/形容词作状语，后为谓语动词，表动作的方式、状态。",usageHint:"修饰关系「而」前不能独立成句，常译作「地」或不译。",examples:[{text:"吾尝跂而望矣，不如登高之博见也。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子论善假于物。",translation:"我曾经踮起脚后跟眺望，却不如登上高处看得广阔。",wordTranslation:"而，连接「跂」与「望」，表修饰（踮着脚望）"},{text:"顺风而呼，声非加疾也，而闻者彰。",source:"《劝学》",author:"荀况",era:"先秦",context:"同上。",translation:"顺着风呼喊，声音并没有加大，而听的人却听得清楚。",wordTranslation:"地，修饰「呼」的方式"}]},{id:"er-s4",gloss:"连词，表承接",modern:"就 / 然后 / 接着",scene:"前后动作有先后或事理相承。",usageHint:"承接强调时间/事理顺序，与转折相反。",examples:[{text:"置之地，拔剑撞而破之。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦脱身后张良献玉斗，范增撞碎。",translation:"把它放在地上，拔出剑砍碎了它。",wordTranslation:"然后，表承接"}]},{id:"er-s5",gloss:"代词，你（们）、你的",modern:"你 / 你们",scene:"仅用于少数固定说法，作主语或定语。",usageHint:"代词用法罕见，集中在「而翁」「而父」等。",examples:[{text:"而翁归，自与汝复算耳。",source:"《促织》",author:"蒲松龄",era:"清",context:"成名妻惧责子。",translation:"你父亲回来，自然要跟你再算账的。",wordTranslation:"你，代「你的（父亲）」"}]}],gaokaoHints:[{type:"高考资料",text:"「而」的六类连词用法中，转折、修饰、承接为高频；判定口诀：能换位置是并列，前后相反是转折，前状后是修饰。",ref:"高考·文言虚词"},{type:"高考试题",text:"断句题常借「而」的承接/修饰关系切分句子；翻译题考转折「却」。",ref:"全国卷文言文阅读"}]},{id:"yi",char:"以",pinyin:"yǐ",category:"虚词",pos:"介词/连词/动词",summary:"介词（凭/用/把/因/在）、连词（而，表因果/承接/修饰）、动词「认为/用」。用法极多，是 18 虚词里最灵活之一。",examPoint:"考点：① 介词「以+名词」：凭、用、把、因、在、率领；② 连词「以」连接两动词/分句：同「而」（表承接/修饰/因果）；③ 与「为」组成「为……所……」被动时「以」另用；④「可以」古今异义（可+以，能凭）；⑤ 动词「认为」。高考抓「以」后是否带宾语判定介词/连词。",senses:[{id:"yi-s1",gloss:"介词，凭、用、拿、把",modern:"凭 / 用 / 拿 / 把",scene:"引出动作凭借的工具、方式、对象，宾语多为名词。",usageHint:"介词「以」后必有名词/代词作宾语，可提宾为「以……」。",examples:[{text:"愿以十五城请易璧。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"秦王诈以城换璧。",translation:"愿意用十五座城来请求交换和氏璧。",wordTranslation:"用，引出交换的代价"},{text:"秦亦不以城予赵，赵亦终不予秦璧。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"双方都不兑现。",translation:"秦国也不把城给赵国，赵国也始终不给秦国和氏璧。",wordTranslation:"把，引出处置对象"}]},{id:"yi-s2",gloss:"连词，表承接、修饰、因果，相当于「而」",modern:"而 / 来 / 因而",scene:"连接两个动词性成分，前后有先后、方式或因果关系。",usageHint:"连词「以」后无名词宾语，而是动词短语。",examples:[{text:"樊哙侧其盾以撞，卫士仆地。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙闯帐护沛公。",translation:"樊哙侧过他的盾牌来撞击，卫兵倒在地上。",wordTranslation:"来，连接「侧其盾」与「撞」，表修饰/承接"},{text:"恐托付不效，以伤先帝之明。",source:"《出师表》",author:"诸葛亮",era:"三国",context:"诸葛亮表北伐决心。",translation:"担心托付的任务不能奏效，因而损伤先帝的明察。",wordTranslation:"因而，表因果"}]},{id:"yi-s3",gloss:"介词，因、由于",modern:"因为 / 由于",scene:"引出原因。",usageHint:"「以」表原因常与结果句搭配。",examples:[{text:"不以物喜，不以己悲。",source:"《岳阳楼记》",author:"范仲淹",era:"北宋",context:"范仲淹写古仁人之心。",translation:"不因为外物（好坏）而喜悦，不因为自己（得失）而悲戚。",wordTranslation:"因为，引出原因"}]},{id:"yi-s4",gloss:"动词，认为；用",modern:"认为 / 使用",scene:"作谓语，较罕见。",usageHint:"「以……为……」结构中「以」为动词「把……当作」。",examples:[{text:"皆以美于徐公。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"妻妾客皆谓邹忌比徐公美。",translation:"（他们）都认为（我）比徐公美。",wordTranslation:"认为"}]}],gaokaoHints:[{type:"高考资料",text:"「以」后带名词宾语为介词，后接动词短语为连词；「可以」古义是「可以（之）凭」，不可混同今义「能够」。",ref:"高考·文言虚词"},{type:"文言文资料",text:"《古文观止》中「以」介词用法占绝大多数，连词用法多同「而」。",ref:"《古文观止》"}]},{id:"yu",char:"于",pinyin:"yú",category:"虚词",pos:"介词",summary:"介词：在、到、向、从、对、对于、比（表比较）、被（表被动）。引出处所、对象、比较、被动。",examPoint:"考点：① 引处所（在/到/从）、对象（向/对/对于）；② 表比较「比」（「胜于」=比……强）；③ 表被动「被」（「受制于人」）；④ 与「是」组成宾语前置「于是」=在这时/对此。高考常考比较与被动两种。",senses:[{id:"yu-s1",gloss:"介词，在、到、从",modern:"在 / 到 / 从",scene:"引出动作发生的处所或时间。",usageHint:"处所介词最常见，译时据动词定「在/到/从」。",examples:[{text:"乃设九宾于廷，引赵使者蔺相如。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"秦王设九宾之礼接见相如。",translation:"于是在朝堂上设置九宾的礼仪，接引赵国使者蔺相如。",wordTranslation:"在，引出处所「廷」"},{text:"箕畚运于渤海之尾。",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"愚公移山运土石。",translation:"用箕畚运到渤海的边上。",wordTranslation:"到，引出方向"}]},{id:"yu-s2",gloss:"介词，表比较，比",modern:"比",scene:"用于形容词比较句，「A 于 B」=A 比 B。",usageHint:"比较句「于」必在形容词后，引比较对象。",examples:[{text:"青，取之于蓝，而青于蓝。",source:"《劝学》",author:"荀况",era:"先秦",context:"论学习超越本性。",translation:"靛青从蓝草提取，却比蓝草更青。",wordTranslation:"比，表比较（青于蓝=比蓝草青）"},{text:"师不必贤于弟子。",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈论闻道先后。",translation:"老师不一定比弟子贤能。",wordTranslation:"比，表比较"}]},{id:"yu-s3",gloss:"介词，表被动，被",modern:"被",scene:"用于被动句，引进行为主动者。",usageHint:"「于」表被动时谓语动词是及物动词，后接施事。",examples:[{text:"不拘于时，学于余。",source:"《师说》",author:"韩愈",era:"唐",context:"李蟠不被时俗拘束，向我求学。",translation:"不被时俗拘束，向我学习。",wordTranslation:"被，表被动（不拘于时）；向，引对象（学于余）"},{text:"臣诚恐见欺于王而负赵。",source:"《廉颇蔺相如列传》",author:"司马迁",era:"西汉",context:"蔺相如惧被欺负赵。",translation:"我实在怕被大王欺骗因而辜负了赵国。",wordTranslation:"被，与「见」构成「见……于」被动"}]},{id:"yu-s4",gloss:"介词，对、对于、向",modern:"对 / 对于 / 向",scene:"引出动作涉及的对象。",usageHint:"对象介词据动词定「对/向/给」。",examples:[{text:"于其身也，则耻师焉。",source:"《师说》",author:"韩愈",era:"唐",context:"世人于己则耻于从师。",translation:"对于他自己，却以从师为耻。",wordTranslation:"对于，引出对待对象"}]}],gaokaoHints:[{type:"高考资料",text:"「于」表比较（形容词后）与表被动（及物动词后）是高考两高频点；判断看其后接的是比较基准还是施事者。",ref:"高考·文言虚词"},{type:"高考试题",text:"翻译题中「于」译错多因混淆比较与被动，需结合句式判定。",ref:"全国卷真题"}]},{id:"wei",char:"为",pinyin:"wéi / wèi",category:"虚词",pos:"介词/动词/语气词",summary:"动词（做/成为/治理/认为）、介词（替/给/被/因为）、语气词（表反问/感叹，读 wéi）。与「所」构成「为……所……」被动式。",examPoint:"考点：① 动词「做/成为/是」（wéi）；② 介词「替/给/被/因为」（wèi）；③「为……所……」固定被动式；④ 句末语气词表反问/感叹。读音与词性对应：作动词、语气词读 wéi，作介词多读 wèi。高考重点在「为……所……」被动与介词「替/被」判别。",senses:[{id:"wei-s1",gloss:"动词，做、成为、当作、是",modern:"做 / 成为 / 是",scene:"作谓语，后接名词或名词性短语。",usageHint:"动词「为」后接名词，读 wéi。",examples:[{text:"冰，水为之，而寒于水。",source:"《劝学》",author:"荀况",era:"先秦",context:"论积学成德。",translation:"冰，是水凝结成的，却比水更冷。",wordTranslation:"成为，作谓语"},{text:"为天下理财，不为征利。",source:"《答司马谏议书》",author:"王安石",era:"北宋",context:"王安石驳司马光。",translation:"替天下治理财政，不是设法谋利。",wordTranslation:"做/治理"}]},{id:"wei-s2",gloss:"介词，替、给、为了",modern:"替 / 给 / 为了",scene:"引出动作的受益者或目的，读 wèi。",usageHint:"介词「为」后接人/事作宾语，译「替/给/为了」。",examples:[{text:"为长安君计短也。",source:"《触龙说赵太后》",author:"刘向",era:"西汉",context:"触龙讽太后爱子之计。",translation:"（这）是为长安君打算得太短浅了。",wordTranslation:"替 / 为了，引出受益对象"},{text:"不足为外人道也。",source:"《桃花源记》",author:"陶渊明",era:"东晋",context:"村人嘱渔人勿外传。",translation:"不值得向外面的人说啊。",wordTranslation:"向 / 给，引出对象"}]},{id:"wei-s3",gloss:'介词，表被动，被（常"为……所……"连用）',modern:"被",scene:"引进行为主动者，常与「所」构成固定被动式。",usageHint:"「为+施事+所+动词」是文言最典型的被动结构之一。",examples:[{text:"为仲卿母所遣。",source:"《孔雀东南飞》",author:"佚名",era:"汉",context:"刘兰芝被焦母休弃。",translation:"被仲卿的母亲休弃。",wordTranslation:"被，与「所」构成被动"},{text:"身死人手，为天下笑者，何也？",source:"《过秦论》",author:"贾谊",era:"西汉",context:"贾谊论秦亡。",translation:"自己死在别人手里，被天下人耻笑，为什么呢？",wordTranslation:"被，表被动"}]},{id:"wei-s4",gloss:"句末语气词，表反问或感叹",modern:"呢 / 啊（不译）",scene:"用于疑问句或感叹句末，读 wéi。",usageHint:"语气词「为」多在句末，与介词用法读音不同。",examples:[{text:"何辞为？",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙劝沛公速走，不必告辞。",translation:"（还要）告辞干什么呢？",wordTranslation:"呢，句末语气词，表反问"}]}],gaokaoHints:[{type:"高考资料",text:"「为……所……」是文言四大被动标志之一（与「于/见/被」并列），全国卷几乎年年涉及；介词「为」读 wèi，动词/语气词读 wéi。",ref:"高考·文言句式与虚词"},{type:"高考试题",text:"翻译题遇到「为……所……」须译出被动；断句题据「所」后动词判定结构。",ref:"历年全国卷"}]},{id:"ze",char:"则",pinyin:"zé",category:"虚词",pos:"连词/副词",summary:"连词（就/那么/如果/却）、副词（就/已经）。表顺承、条件、假设、转折、发现。",examPoint:"考点：① 顺承「就/于是」；② 条件/假设「那么/如果……就」；③ 转折「却」（与「而」同）；④ 发现「原来已经」（「既来之，则安之」）；⑤ 副词「就」。高考重顺承与转折的判别。",senses:[{id:"ze-s1",gloss:"连词，表顺承，就、于是",modern:"就 / 于是",scene:"前后分句事理相承。",usageHint:"顺承是最常见用法。",examples:[{text:"项王曰：「壮士！赐之卮酒。」则与斗卮酒。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"樊哙闯帐，项羽赐酒。",translation:"项王说：「壮士！赏他一杯酒。」（手下）就给了（他）一大杯酒。",wordTranslation:"就，表顺承"}]},{id:"ze-s2",gloss:"连词，表转折，却",modern:"却 / 可是",scene:"前后语义相反。",usageHint:"转折用法同「而」。",examples:[{text:"爱其子，择师而教之；于其身也，则耻师焉。",source:"《师说》",author:"韩愈",era:"唐",context:"世人爱子择师，于己耻师。",translation:"疼爱自己的孩子，选择老师教他；对于自己，却以从师为耻。",wordTranslation:"却，表转折"}]},{id:"ze-s3",gloss:"连词，表假设/条件，如果……就、那么",modern:"如果 / 那么",scene:"前分句提出条件。",usageHint:"假设句「则」多在后分句。",examples:[{text:"三人行，则必有我师。",source:"《论语》",author:"孔丘",era:"先秦",context:"孔子论好学。",translation:"几个人一起走，那么其中必定有可以做我老师的人。",wordTranslation:"那么，表条件"}]}],gaokaoHints:[{type:"高考资料",text:"「则」作连词时顺承与转折需据上下文；「则」在假设/条件句译「那么/如果……就」。",ref:"高考·文言虚词"}]},{id:"zhe",char:"者",pinyin:"zhě",category:"虚词",pos:"助词",summary:"助词：附在词/短语后构成「者」字结构（……的人/事/物）；表提顿；数词后表种类；时间词后表「……的时候」。",examPoint:"考点：①「者」字结构作主语/宾语，译「……的人/事/物」；② 表判断句提顿（「陈胜者，阳城人也」）；③ 时间词后「……的时候」；④ 数词后表种类/方面。高考重点在「者」字结构的翻译与判断句停顿。",senses:[{id:"zhe-s1",gloss:'助词，附在词/短语后，构成"者"字结构',modern:"……的人 / 事 / 物",scene:"与动词/形容词/名词短语结合，使之为名词性。",usageHint:"「者」字结构在句中作主语/宾语，译时补出中心语。",examples:[{text:"逝者如斯夫，不舍昼夜。",source:"《论语》",author:"孔丘",era:"先秦",context:"孔子临川叹时光。",translation:"逝去的（时光）像这样啊，日夜不停。",wordTranslation:"……的（事物），指逝去的流水/时光"},{text:"此数者用兵之患也。",source:"《赤壁之战》",author:"司马光",era:"北宋",context:"诸葛亮论用兵禁忌。",translation:"这几样是用兵的祸患啊。",wordTranslation:"……的（方面），数词后表种类"}]},{id:"zhe-s2",gloss:"助词，表提顿（判断句、时间后）",modern:"不译 / ……的时候",scene:"判断句主语后提顿；时间词后表时点。",usageHint:"判断句「……者，……也」中「者」提顿主语。",examples:[{text:"陈胜者，阳城人也。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"史公开篇介绍陈胜籍贯。",translation:"陈胜，是阳城人。",wordTranslation:"提顿主语，不译"},{text:"今者项庄拔剑舞，其意常在沛公也。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项伯示警张良。",translation:"现在项庄拔剑起舞，他的用意总是在沛公身上。",wordTranslation:"……的时候，时间词后"}]}],gaokaoHints:[{type:"高考资料",text:"「者」字结构是文言名词化标志，翻译须补出「的人/事/物」；判断句「者……也」为高频句式。",ref:"高考·文言句式"}]},{id:"ye",char:"也",pinyin:"yě",category:"虚词",pos:"语气词",summary:"句末语气词：表判断、陈述、疑问、感叹、祈使；句中表提顿。文言最常用语气词。",examPoint:"考点：① 句末表判断/肯定（「……也」）；② 与「者」配合成判断句；③ 表疑问（「何……也」）；④ 句中提顿舒缓语气。高考重在判断句与提顿的识别，翻译多不译。",senses:[{id:"ye-s1",gloss:"句末语气词，表判断/肯定",modern:"不译（表判断）",scene:"判断句末，与「者」呼应或不呼应。",usageHint:"「……也」收尾多为判断句，译时不保留。",examples:[{text:"城北徐公，齐国之美丽者也。",source:"《邹忌讽齐王纳谏》",author:"刘向",era:"西汉",context:"邹忌自叹不如徐公。",translation:"城北的徐公，是齐国的美男子。",wordTranslation:"表判断，不译"},{text:"斯亦伐根以求木茂，塞源而欲流长者也。",source:"《谏太宗十思疏》",author:"魏徵",era:"唐",context:"魏徵谏太宗。",translation:"这也（如同）是砍断根却要求树木茂盛、堵住源头却要水流长远啊。",wordTranslation:"表判断，不译"}]},{id:"ye-s2",gloss:"句中语气词，表提顿",modern:"不译（表提顿）",scene:"主语、时间词后停顿舒缓。",usageHint:"句中「也」不表语气终结，仅提顿。",examples:[{text:"师道之不传也久矣！欲人之无惑也难矣！",source:"《师说》",author:"韩愈",era:"唐",context:"韩愈叹从师之道失传。",translation:"从师的风尚不流传（已经）很久了！想要人没有疑惑（也）难啊！",wordTranslation:"提顿主语「师道之不传」「欲人之无惑」，不译"}]}],gaokaoHints:[{type:"高考资料",text:"「也」在判断句末不译；句中提顿是舒缓语气，翻译省略。断句题常以「也」为句末标志。",ref:"高考·文言句式与虚词"}]},{id:"hu",char:"乎",pinyin:"hū",category:"虚词",pos:"介词/语气词",summary:"介词（于，引出处所/对象/比较）、语气词（吗/呢/吧/啊，表疑问/反问/感叹）、形容词词尾（……的样子）。",examPoint:"考点：① 介词同「于」（在/比/向）；② 句末语气词表疑问（吗/呢）、反问（吗/呢）、感叹（啊）；③ 形容词尾「……的样子」（「巍巍乎」）；④「乎」在句中同「于」引出比较（「异乎三子者之撰」）。高考重疑问/反问语气与介词「于」的判别。",senses:[{id:"hu-s1",gloss:"句末语气词，表疑问或反问",modern:"吗 / 呢",scene:"疑问句、反问句末。",usageHint:"「不亦……乎」「何……乎」为典型反问。",examples:[{text:"学而时习之，不亦说乎？",source:"《论语》",author:"孔丘",era:"先秦",context:"孔子论学。",translation:"学了并且按时温习它，不也是高兴的事吗？",wordTranslation:"吗，表反问"},{text:"壮士！能复饮乎？",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"项羽赞樊哙壮士，问能否再饮。",translation:" :[{text:"蹇叔之子与师。",source:"《殽之战》",author:"左丘明",era:"先秦",context:"蹇叔之子参与出征。",translation:"蹇叔的儿子参与军队（出征）。",wordTranslation:"参与，动词"},{text:"朝过夕改，君子与之。",source:"《汉书》",author:"班固",era:"东汉",context:"赞许改过。",translation:"早晨有过错晚上就改，君子赞许他。",wordTranslation:"赞许，动词"}]}],gaokaoHints:[{type:"高考资料",text:"「与」介词（跟/给）、连词（和）、动词（参与/赞许）三性判别：后接代词且非并列多介词；前后并列多连词；作谓语带宾多动词。",ref:"高考·文言虚词"}]},{id:"yan",char:"焉",pinyin:"yān",category:"虚词",pos:"兼词/代词/语气词",summary:"兼词（于之=在那里/从这里）、代词（之，他/事）、语气词（了/啊）、疑问代词（哪里/怎么）。用法灵活。",examPoint:"考点：① 兼词「于之/于是」=在这里/从这里/对他；② 代词「之」；③ 句末语气词（了/啊，表陈述/疑问）；④ 疑问代词「哪里/怎么」。高考重兼词「于之」与句末语气词的判别（句末多为语气词，句中多为兼词/代词）。",senses:[{id:"yan-s1",gloss:"兼词，于之（在这里/向他/从中）",modern:"在这里 / 对他 / 从中",scene:"「焉」=「于+之」，兼介词与代词。",usageHint:"兼词「焉」多在动词后，译「在这里/向他」。",examples:[{text:"三人行，必有我师焉。",source:"《论语》",author:"孔丘",era:"先秦",context:"孔子论好学。",translation:"几个人同行，其中必定有可以做我老师的人。",wordTranslation:"于之=在其中，兼词"},{text:"积土成山，风雨兴焉。",source:"《劝学》",author:"荀况",era:"先秦",context:"荀子论积累。",translation:"堆积泥土成为高山，风雨就从这里兴起。",wordTranslation:"于此=从这里，兼词"}]},{id:"yan-s2",gloss:"句末语气词，了/啊（表陈述、疑问）",modern:"了 / 啊（不译）",scene:"句末舒缓语气。",usageHint:"句末「焉」多语气词，不译或译「了/啊」。",examples:[{text:"至丹以荆卿为计，始速祸焉。",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵论燕用荆轲加速灭亡。",translation:"等到燕太子丹用荆轲（刺秦）作为计策，才招致祸患。",wordTranslation:"了，句末语气词"},{text:"微波入焉，涵澹澎湃而为此也。",source:"《石钟山记》",author:"苏轼",era:"北宋",context:"苏轼考石钟山命名。",translation:"微波进入里面，水波荡漾汹涌而形成这种声音啊。",wordTranslation:"啊，句末语气词"}]},{id:"yan-s3",gloss:"疑问代词，哪里、怎么",modern:"哪里 / 怎么",scene:"表反问或疑问。",usageHint:"疑问「焉」在动词前，译「哪里/怎么」。",examples:[{text:"且焉置土石？",source:"《愚公移山》",author:"列御寇",era:"先秦",context:"智叟问愚公。",translation:"况且把土石放到哪里呢？",wordTranslation:"哪里，疑问代词"}]}],gaokaoHints:[{type:"高考资料",text:"「焉」兼词「于之」是高考独特考点（「风雨兴焉」=从这里）；句末多为语气词不译；疑问代词「哪里/怎么」少见但需会。",ref:"高考·文言虚词"}]},{id:"he",char:"何",pinyin:"hé",category:"虚词",pos:"代词/副词/疑问词",summary:"疑问代词（什么/哪里/为什么）、副词（怎么/多么）、复合词（奈何/何如/何以）。",examPoint:"考点：① 疑问代词「什么/哪里/为什么」（作宾前置于动前）；② 副词「怎么/多么」；③ 固定结构「奈何」(怎么办)、「何如」(怎么样)、「何以」(凭什么)、「何乃」(怎能)。高考重「何」作宾语前置（「何厌之有」）与
