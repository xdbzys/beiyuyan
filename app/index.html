荀子论后天学习。",translation:"所以木材用墨线量过就直，金属刀剑放到磨刀石上就锋利。",wordTranslation:"所以，表因果"}]},{id:"gu-s2",gloss:"副词，故意、本来",modern:"故意 / 本来",scene:"修饰动词/形容词。",examples:[{text:"广故数言欲亡，忿恚尉。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"吴广故意激尉。",translation:"吴广故意屡次说要逃跑，使尉恼怒。",wordTranslation:"故意"}]},{id:"gu-s3",gloss:"名词，原因、旧交",modern:"原因 / 老交情",scene:"作宾语。",examples:[{text:"既克，公问其故。",source:"《曹刿论战》",author:"左丘明",era:"先秦",context:"鲁庄公问取胜原因。",translation:"打败齐军后，鲁庄公问取胜的原因。",wordTranslation:"原因"},{text:"君安与项伯有故？",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"张良问沛公与项伯关系。",translation:"您怎么和项伯有老交情？",wordTranslation:"旧交、老交情"}]}],gaokaoHints:[{type:"高考资料",text:"「故」连词「所以」与副词「故意/本来」须据位置（句首多为所以，动词前多为故意/本来）判定。",ref:"高考·文言实词"}]},{id:"ju",char:"举",pinyin:"jǔ",category:"实词",pos:"动词",summary:"举起、抬起；发动（举兵）；推荐、选拔；全（举国）；攻取。",examPoint:"考点：① 举起/抬起；② 推荐/选拔（「举孝廉」）；③ 发动（「举兵」）；④ 全、尽（「举国/举世」）；⑤ 攻取（「西举巴蜀」）。高考重「全/尽」与「推荐」两义。",senses:[{id:"ju-s1",gloss:"举起、抬起",modern:"举起 / 抬起",scene:"具体动作。",examples:[{text:"举所佩玉玦以示之者三。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"范增举玦示项羽。",translation:"举起所佩带的玉玦来示意项羽多次。",wordTranslation:"举起"}]},{id:"ju-s2",gloss:"推荐、选拔",modern:"推荐 / 选拔",scene:"人才。",usageHint:"「举孝廉/举贤」译推荐/举荐。",examples:[{text:"永元中，举孝廉不行。",source:"《张衡传》",author:"范晔",era:"南朝宋",context:"张衡被举孝廉未赴。",translation:"永元年间，被推荐为孝廉（却）没有去。",wordTranslation:"推荐、举荐"}]},{id:"ju-s3",gloss:"全、尽（形容词/副词）",modern:"全 / 都",scene:"范围。",usageHint:"「举国/举世/举家」译全部。",examples:[{text:"举世混浊而我独清。",source:"《屈原列传》",author:"司马迁",era:"西汉",context:"屈原叹世俗。",translation:"全世界都混浊只有我清白。",wordTranslation:"全、都"},{text:"举疾首蹙额而相告。",source:"《庄暴见孟子》",author:"孟轲",era:"先秦",context:"写百姓苦乐。",translation:"全都头疼皱眉地互相诉说。",wordTranslation:"都"}]},{id:"ju-s4",gloss:"发动、兴起；攻取",modern:"发动 / 攻取",scene:"军事。",examples:[{text:"今亡亦死，举大计亦死。",source:"《陈涉世家》",author:"司马迁",era:"西汉",context:"陈胜吴广谋起义。",translation:"现在逃跑也是死，发动大事也是死。",wordTranslation:"发动、举行"}]}],gaokaoHints:[{type:"高考资料",text:"「举」的「全/尽」（举世/举国）与「推荐」（举孝廉）是高考两高频义，须据宾语判定。",ref:"高考·文言实词"}]},{id:"wang",char:"王",pinyin:"wáng / wàng",category:"实词",pos:"名词/动词",summary:"帝王、国王（名词，wáng）；称王、统治（动词，wàng）。",examPoint:"考点：① 名词「君王/国王」（wáng）；② 动词「称王/统治天下」（wàng，名词作动词）。高考重读音与词性：后带宾语「天下/诸侯」多作动词「称王」。",senses:[{id:"wang-s1",gloss:"名词，君王、国王",modern:"君王 / 国王",scene:"作主语/宾语。",examples:[{text:"王好战，请以战喻。",source:"《寡人之于国也》",author:"孟轲",era:"先秦",context:"孟子对梁惠王。",translation:"大王喜欢打仗，请让我用打仗来比喻。",wordTranslation:"君王"}]},{id:"wang-s2",gloss:"动词，称王、统治（读 wàng）",modern:"称王 / 统治",scene:"名词活用作动词，带宾语。",usageHint:"「王天下」即统治天下，读 wàng。",examples:[{text:"沛公欲王关中，使子婴为相。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"沛公欲据关中称王。",translation:"沛公想在关中称王，让子婴做丞相。",wordTranslation:"称王、统治（名词动用）"}]}],flexUsage:{has:!0,types:["名词活用作动词"],items:[{type:"名词作动词",text:"沛公欲王关中。",source:"《鸿门宴》",explanation:"「王」本为名词君王，此处带宾语「关中」活用作动词「称王/统治」，读 wàng。这是高考「名词作动词」典型例句。"}]},gaokaoHints:[{type:"高考资料",text:"「王」读 wàng 作动词「称王」是名词活用的高频考点；判定看是否带宾语（王关中=统治关中）。",ref:"高考·词类活用"}]},{id:"bei2",char:"倍",pinyin:"bèi",category:"实词",pos:"动词",summary:"通「背」，背叛、违背；又表倍数「一倍」。",examPoint:"考点：① 通「背」表背叛（「不敢倍德」）；② 表倍数（「百倍」）。高考重通假与倍数两义，翻译需据语境。",senses:[{id:"bei2-s1",gloss:"通「背」，背叛、违背",modern:"背叛 / 违背",scene:"用于恩德、盟誓语境。",usageHint:"「倍德」即背弃恩德。",examples:[{text:"愿伯具言臣之不敢倍德也。",source:"《鸿门宴》",author:"司马迁",era:"西汉",context:"刘邦托项伯向项羽表忠心。",translation:"希望您（项伯）详细说明我不敢背叛（项王的）恩德。",wordTranslation:"倍，通「背」，背叛、违背"},{text:"倍道而妄行，则天不能使之吉。",source:"《荀子·天论》",author:"荀况",era:"先秦",context:"荀子论违背规律则无吉。",translation:"违背规律而胡乱行动，那么天也不能让他吉利。",wordTranslation:"倍，通「背」，违背"},{text:"兵法右倍山陵，前左水泽。",source:"《史记·淮阴侯列传》",author:"司马迁",era:"西汉",context:"兵法讲究背靠山陵。",translation:"兵法上右翼要背靠山陵。",wordTranslation:"倍，通「背」，背靠"}]},{id:"bei2-s2",gloss:"倍数，一倍",modern:"倍 / 一倍",scene:"表数量成倍增加。",usageHint:"数词前表倍数。",examples:[{text:"较秦之所得，与战胜而得者，其实百倍。",source:"《六国论》",author:"苏洵",era:"北宋",context:"苏洵论赂秦得不偿失。",translation:"比较秦国受贿所得，与战胜所得，其实多到百倍。",wordTranslation:"倍，倍数"},{text:"尝以十倍之地，百万之众，叩关而攻秦。",source:"《过秦论》",author:"贾谊",era:"西汉",context:"诸侯以倍数之地攻秦。",translation:"曾经凭着十倍的土地、百万的军队，叩关攻打秦国。",wordTranslation:"倍，倍数"}]}],gaokaoHints:[{type:"高考资料",text:"「倍」通「背」表背叛是常考通假；「百倍/十倍」表倍数是数量义，二者须区辨。",ref:"高考·文言实词"}]},{id:"ben",char:"本",pinyin:"běn",category:"实词",pos:"名词/副词/动词",summary:"草木的根；根本、本源；本来；推究。",examPoint:"考点：① 名词，根本/本源（「固其根本」「人之本也」）；② 副词，本来、原来（「本图宦达」「臣本布衣」）；③ 动词，推究、考察（「抑本其成败之迹」）。高考重「根本」与「本来」；「本」作动词「推究」是易错点。",senses:[{id:"ben-s1",gloss:"名词，根本、本源、根基",modern:"根本 / 根基",scene:"用于树木、国家、道理之基。",usageHint:"「本」指事物赖以存在的根基。",examples:[{text:"臣闻求木之长者，必固其根本。",source:"《谏太宗十思疏》",author:"魏徵",era:"唐",context:"魏徵以树木喻治国。",translation:"我听说想要树木长得高，必须稳固它的根。",wordTranslation:"本，根本、根基"},{text:"盖亦反其本矣！",source:"《齐桓晋文之事》",author:"孟轲",era:"先秦",context:"孟子劝齐宣王回到根本。",translation:"（您）也该返回到根本（仁政）上来吧！",wordTranslation:"本，根本、本源"},{text:"父母者，人之本也。",source:"《屈原列传》",author:"司马迁",era:"西汉",context:"论孝道为立身之本。",translation:"父母，是做人的根本。",wordTranslation:"本，根本"}]},{id:"ben-s2",gloss:"副词，本来、原来",modern:"本来 / 原来",scene:"修饰动词，表原先的状况或意图。",usageHint:"「本」作状语，后接动词。",examples:[{text:"本图宦达，不矜名节。",source:"《陈情表》",author:"李密",era:"西晋",context:"李密陈情本意。",translation:"本来图谋官运亨通，并不自夸名节。",wordTranslation:"本，本来、原来"},{text:"臣本布衣，躬耕于南阳。",source:"《出师表》",author:"诸葛亮",era:"三国",context:"诸葛亮自述出身。",translation:"我本来是平民，在南阳亲自耕种。",wordTranslation:"本，本来"},{text:"本自无教训，兼愧贵家子。",source:"《孔雀东南飞》",author:"佚名",era:"汉",context:"刘兰芝自谦。",translation:"我本来就没有受过好的教养，又惭愧配不上你家的公子。",wordTranslation:"本，本来"}]},{id:"ben-s3",gloss:"动词，推究、考察",modern:"推究 / 考察",scene:"后接事理、原委作宾语。",usageHint:"「本」作谓语带宾语时多译「推究」。",examples:[{text:"抑本其成败之迹，而皆自于人欤？",source:"《伶官传序》",author:"欧阳修",era:"北宋",context:"欧阳修探究后唐兴亡的原因。",translation:"还是推究他成功与失败的事迹，都出自人为呢？",wordTranslation:"本，推究、考察"}]}],gaokaoHints:[{type:"高考资料",text:"「本」在「本图宦达」「臣本布衣」中作副词「本来」，在「固其根本」中作名词「根基」，是高频一词多义。",ref:"高考·文言实词"},{type:"文言文资料",text:"「本」作动词「推究」仅见于《伶官传序》「抑本其成败之迹」，属易错义项。",ref:"《古文观止》"}]}].concat(Bh),Pt=[{id:"judgment",name:"判断句",category:"基本句式",definition:"以名词或名词性短语作谓语对主语进行判断，常用「……者，……也」「……，……也」「……者，……」「乃/即/皆/本/诚/非」等。",markers:["者……也","……也","乃","即","皆","本","诚","非（表否定判断）"],rules:["「者」提顿主语，「也」收束判断，可单用其一或并用。","副词「乃/即/皆/本/诚」加强判断语气；「非」表否定判断。","「为/是」有时也表判断，但「是」在先秦多作代词。"],examples:[{text:"城北徐公，齐国之美丽者也。",analysis:"「……者，……也」典型判断句，译「是」。"},{text:"项燕为楚将。",analysis:"「为」表判断，译「是」。"},{text:"此则岳阳楼之大观也。",analysis:"「则……也」表判断。"}],examTips:"全国卷翻译/断句常考判断句标志词；「非」表否定判断易漏译。"},{id:"passive",name:"被动句",category:"基本句式",definition:"主语是动作的承受者，用「于/见/为……所……/被」等标志表示。",markers:["于","见（……于）","为……所……","被"],rules:["「于」引进行为主动者（「受制于人」）。","「见+动词」表被动，常加「于」引出主动者（「见欺于王」）。","「为+施事+所+动」是最典型固定式。"],examples:[{text:"身死人手，为天下笑者，何也？",analysis:"「为……（所）……」被动，译「被天下人耻笑」。"},{text:"臣诚恐见欺于王而负赵。",analysis:"「见……于」被动式。"},{text:"不拘于时，学于余。",analysis:"「于」表被动（不拘于时）与引对象（学于余）并存。"}],examTips:"「为……所……」「见……于」是高考四大被动标志之二，年年涉及。"},{id:"omission",name:"省略句",category:"基本句式",definition:"文言文常省略主语、宾语、介词宾语或谓语，翻译时要补出。",markers:["承前省主","蒙后省主","省略宾语","省略介词「于/以」"],rules:["对话/叙述中主语多承前或蒙后省略。","动词后宾语常省（「敢以（之）烦执事」）。","处所/工具介词「于/以」常省（「沛公军（于）霸上」）。"],examples:[{text:"沛公军霸上，未得与项羽相见。",analysis:"「军」后省略介词「于」，即「军于霸上」。"},{text:"竖子不足与谋。",analysis:"「与」后省略宾语「之」（代沛公）。"}],examTips:"翻译题要求补全省略成分，漏补会扣分。"},{id:"obj-front",name:"宾语前置",category:"倒装句",definition:"疑问句/否定句中代词宾语前置，或「之/是」提宾，或「唯……是……」结构。",markers:["何……之有","不（弗）……之/是","唯……是……","句读之不知"],rules:["否定句代词宾语前置（「古之人不余欺也」=不欺余）。","疑问句代词宾语前置（「大王来何操？」=操何）。","「之/是」为提宾标志（「唯利是图」=图利）。"],examples:[{text:"句读之不知，惑之不解。",analysis:"「之」提宾标志，即「不知句读」。"},{text:"何厌之有？",analysis:"「何……之有」=有何厌，疑问代词前置。"},{text:"古之人不余欺也。",analysis:"否定句代词「余」前置，即「不欺余」。"}],examTips:"宾语前置是倒装句最高频考点，断句与翻译都考，须还原语序。"},{id:"attrib-post",name:"定语后置",category:"倒装句",definition:"定语置于中心语之后，常用「之……者」「之……然」格式。",markers:["中心语+之+定语+者","之……然"],rules:["「……之……者」为典型标志（「石之铿然有声者」）。","翻译时定语提前。"],examples:[{text:"石之铿然有声者，所在皆是也。",analysis:"定语「铿然有声」后置，即「铿然有声之石」。"},{text:"人马烧溺死者甚众。",analysis:"定语「烧溺死」后置。"}],examTips:"定语后置标志「之……者」是高考常考倒装格式。"},{id:"adverbial-post",name:"状语后置（介词结构后置）",category:"倒装句",definition:"介词结构（于/以+宾语）作状语置于动词后，翻译时提到动词前。",markers:["动词+于/以+宾语"],rules:["「于+处所/对象」后置（「青于蓝」=比蓝青）。","「以+工具/方式」后置（「饰以篆文」=以篆文饰）。"],examples:[{text:"青，取之于蓝，而青于蓝。",analysis:"「于蓝」后置，译「从蓝草中取得」「比蓝草青」。"},{text:"饰以篆文山龟鸟兽之形。",analysis:"「以……形」后置，译「用……的形状装饰」。"}],examTips:"状语后置（介词结构后置）每年必考，翻译须调整语序。"},{id:"subject-post",name:"主谓倒装",category:"倒装句",definition:"为了强调谓语，主语倒装在谓语之后，多见于感叹、疑问。",markers:["谓语+主语"],rules:["感叹句主谓倒装（「甚矣，汝之不惠！」）。","疑问句偶见（「谁与，哭者？」）。"],examples:[{text:"甚矣，汝之不惠！",analysis:"谓语「甚矣」前置，即「汝之不惠甚矣」。"}],examTips:"主谓倒装相对少见，但属高考倒装句四类之一。"},{id:"fixed",name:"固定句式",category:"固定句式",definition:"文言常见固定结构，有相对固定的译法。",markers:["奈何","何如","何以","得无","无以","不亦……乎","孰与","与其……孰若"],rules:["「奈何」怎么办；「何如」怎么样；「何以」凭什么。","「得无……乎」恐怕/该不会；「不亦……乎」不也……吗。","「无以」没有用来……的；「孰与」与……相比谁更。"],examples:[{text:"为之奈何？",analysis:"「奈何」=怎么办。"},{text:"不亦说乎？",analysis:"「不亦……乎」=不也……吗。"},{text:"日食饮得无衰乎？",analysis:"「得无……乎」=该不会/恐怕。"}],examTips:"固定句式翻译有定式，记熟即可稳拿分。"}],Yh=[{title:"《师说》",note:"韩愈，唐。论从师之道，实词虚词密集。",url:"https://baike.baidu.com/item/师说"},{title:"《鸿门宴》",note:"司马迁《史记》，西汉。楚汉对峙，人物对话多虚词。",url:"https://baike.baidu.com/item/鸿门宴"},{title:"《烛之武退秦师》",note:"《左传》，先秦。外交辞令典范。",url:"https://baike.baidu.com/item/烛之武退秦师"},{title:"《劝学》",note:"荀况，先秦。论学习，比喻与虚词密集。",url:"https://baike.baidu.com/item/劝学"},{title:"《过秦论》",note:"贾谊，西汉。论秦兴亡。",url:"https://baike.baidu.com/item/过秦论"},{title:"《廉颇蔺相如列传》",note:"司马迁《史记》，西汉。",url:"https://baike.baidu.com/item/廉颇蔺相如列传"},{title:"《岳阳楼记》",note:"范仲淹，北宋。",url:"https://baike.baidu.com/item/岳阳楼记"},{title:"《赤壁之战》",note:"司马光《资治通鉴》，北宋。",url:"https://baike.baidu.com/item/赤壁之战"},{title:"《游褒禅山记》",note:"王安石，北宋。",url:"https://baike.baidu.com/item/游褒禅山记"},{title:"《六国论》",note:"苏洵，北宋。",url:"https://baike.baidu.com/item/六国论"},{title:"《陈涉世家》",note:"司马迁《史记》，西汉。",url:"https://baike.baidu.com/item/陈涉世家"},{title:"《孔雀东南飞》",note:"汉乐府。",url:"https://baike.baidu.com/item/孔雀东南飞"},{title:"《桃花源记》",note:"陶渊明，东晋。",url:"https://baike.baidu.com/item/桃花源记"},{title:"《石钟山记》",note:"苏轼，北宋。",url:"https://baike.baidu.com/item/石钟山记"},{title:"《屈原列传》",note:"司马迁《史记》，西汉。",url:"https://baike.baidu.com/item/屈原列传"},{title:"《谏太宗十思疏》",note:"魏徵，唐。",url:"https://baike.baidu.com/item/谏太宗十思疏"},{title:"《寡人之于国也》",note:"《孟子》，先秦。",url:"https://baike.baidu.com/item/寡人之于国也"},{title:"《齐桓晋文之事》",note:"《孟子》，先秦。",url:"https://baike.baidu.com/item/齐桓晋文之事"},{title:"《曹刿论战》",note:"《左传》，先秦。",url:"https://baike.baidu.com/item/曹刿论战"},{title:"《梦游天姥吟留别》",note:"李白，唐。",url:"https://baike.baidu.com/item/梦游天姥吟留别"}],Gh=[{id:"lunyu12",title:"《论语》十二章",author:"孔子及其弟子",era:"春秋",book:"选择性必修上册",genre:"语录体",stage:"高中",note:"「而」「之」「其」高频出现；「敏于事而慎于言」的介词结构、「不患人之不己知」的宾语前置是常考点。",paragraphs:["子曰：“人而不仁，如礼何？人而不仁，如乐何？”（《八佾》）","子曰：“朝闻道，夕死可矣。”（《里仁》）","子曰：“君子喻于义，小人喻于利。”（《里仁》）","子曰：“见贤思齐焉，见不贤而内自省也。”（《里仁》）","子曰：“质胜文则野，文胜质则史。文质彬彬，然后君子。”（《雍也》）","曾子曰：“士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？”（《泰伯》）","子曰：“譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。”（《子罕》）","子曰：“知者不惑，仁者不忧，勇者不惧。”（《子罕》）","颜渊问仁。子曰：“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”颜渊曰：“请问其目。”子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”颜渊曰：“回虽不敏，请事斯语矣。”（《颜渊》）","子贡问曰：“有一言而可以终身行之者乎？”子曰：“其‘恕’乎！己所不欲，勿施于人。”（《卫灵公》）","子曰：“小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君。多识于鸟兽草木之名。”（《阳货》）"]},{id:"quanxue",title:"劝学",author:"荀子",era:"战国",book:"必修上册",genre:"论说文",stage:"高中",note:"「青，取之于蓝」的「于」、「而」的并列与修饰、「焉」作兼词，是本文三大考点。",paragraphs:["君子曰：学不可以已。","青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，𫐓使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。","吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。","积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。"]},{id:"quyuan",title:"屈原列传",author:"司马迁",era:"西汉",book:"选择性必修中册",genre:"史传（节选）",stage:"高中",note:"节选「屈平疾王听之不聪也」一段，重点看「疾」「伐」「害」「间」与「之」取消句子独立性。",paragraphs:["屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。“离骚”者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。"]},{id:"jianshisi",title:"谏太宗十思疏",author:"魏征",era:"唐",book:"必修下册",genre:"奏疏",stage:"高中",note:"「固本思源」「居安思危」两段是高频考点，「以」「而」「所」密集。",paragraphs:["臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。","凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡。岂取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则胡越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎；奔车朽索，其可忽乎！","君人者，诚能见可欲则思知足以自戒，将有作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，在君无事，可以尽豫游之乐，可以养松、乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！"]},{id:"shishuo",title:"师说",author:"韩愈",era:"唐",book:"必修上册",genre:"论说文",stage:"高中",note:"「师道之不传也久矣」的「之」、「其」的指代、「于」的三种用法，是本文核心。",paragraphs:["古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。","嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。”呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！","圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。","李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。"]},{id:"afanggong",title:"阿房宫赋",author:"杜牧",era:"晚唐",book:"必修下册",genre:"赋",stage:"高中",note:"「六王毕，四海一」的「一」活用、「后人哀之而不鉴之」的「鉴」意动，是必考句。",paragraphs:["六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。","妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。","嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！","呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟乎！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"]},{id:"liuguolun",title:"六国论",author:"苏洵",era:"北宋",book:"必修下册",genre:"史论",stage:"高中",note:"「弊在赂秦」的「弊」、「率」「厥」「殆」「与」胜负已判，是本文实词重点。",paragraphs:["六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰：弊在赂秦也。","秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。","齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。","呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！","夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。"]},{id:"dasima",title:"答司马谏议书",author:"王安石",era:"北宋",book:"必修下册",genre:"书信",stage:"高中",note:"「见」「名」「膏泽」等实词与「以」「为」的介词用法，是本文考点集中处。",paragraphs:["某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。","盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。","人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已；盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。","无由会晤，不任区区向往之至！"]},{id:"chibifu",title:"赤壁赋",author:"苏轼",era:"北宋",book:"必修上册",genre:"赋",stage:"高中",note:"「少焉」「正襟危坐」的「危」、「卒」「适」与「逝者如斯」，是本文高频点。",paragraphs:["壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。","于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。","苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。","苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。","客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。"]},{id:"xiangjixuan",title:"项脊轩志",author:"归有光",era:"明",book:"选择性必修下册",genre:"散文",stage:"高中",note:"「顾」「比」「殆」「得」与「而」的转折，是本文实词虚词重点。",paragraphs:["项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之，明月半墙，桂影斑驳，风移影动，珊珊夜可爱。","然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。","轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。","…………","余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。","庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。"]},{id:"shizuo",title:"子路、曾皙、冉有、公西华侍坐",author:"《论语》",era:"春秋",book:"必修下册",genre:"语录体",stage:"高中",note:"「以」「如」「方」「与」四个虚词是核心考点，「率尔」「哂」等实词同为重点。",paragraphs:["子路、曾皙、冉有、公西华侍坐。","子曰：“以吾一日长乎尔，毋吾以也。居则曰：‘不吾知也！’如或知尔，则何以哉？","子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。","夫子哂之。","“求！尔何如？","对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。","“赤！尔何如？","对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。","“点！尔何如？","鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。","子曰：“何伤乎？亦各言其志也。","曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。","夫子喟然叹曰：“吾与点也！","三子者出，曾皙后。曾皙曰：“夫三子者之言何如？","子曰：“亦各言其志也已矣。","曰：“夫子何哂由也？","曰：“为国以礼，其言不让，是故哂之。","“唯求则非邦也与？","“安见方六七十如五六十而非邦也者？","“唯赤则非邦也与？","“宗庙会同，非诸侯而何？赤也","？为之小，孰能为之大"]},{id:"baorenan",title:"报任安书",author:"司马迁",era:"西汉",book:"选择性必修中册",genre:"书信（节选）",stage:"高中",note:"「所以」「用」「通其道」的「通」、「就极刑而无愠色」，是本文重点句。",paragraphs:["古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦,《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。此人皆意有所郁结，不得通其道，故述往事，思来者。乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。","仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。亦欲以究天人之际，通古今之变，成一家之言。草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也。"]},{id:"guoqinlun",title:"过秦论",author:"贾谊",era:"西汉",book:"选择性必修中册",genre:"史论",stage:"高中",note:"「因」「致」「延」「爱」等实词与「以」的连词用法，是本文考点。",paragraphs:["秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。于是秦人拱手而取西河之外。","孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有甯越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。","及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。","始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。","且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄棘矜，非铦于钩戟长铩也；而谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。"]},{id:"dadao",title:"大道之行也",author:"《礼记》",era:"战国",book:"八年级下册",genre:"论说文",stage:"初中",note:"「与」「亲」「子」的活用与「故」「是故」的承接，是本文考点。",paragraphs:["大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。"]},{id:"chenqingbiao",title:"陈情表",author:"李密",era:"西晋",book:"选择性必修下册",genre:"表",stage:"高中",note:"「见背」「除」「婴」「薄」等实词，「以」「于」的介词用法，是本文重点。",paragraphs:["臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。","逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许：臣之进退，实为狼狈。","伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。","臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。"]},{id:"guiqulaici",title:"归去来兮辞",author:"陶渊明",era:"东晋",book:"选择性必修下册",genre:"辞",stage:"高中",note:"「以」「而」「之」的用法与「觉今是而昨非」的「是」「非」，是本文核心。",paragraphs:["余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有“归欤”之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。","归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。","乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。","归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。","已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！"]},{id:"zhongshu",title:"种树郭橐驼传",author:"柳宗元",era:"唐",book:"选择性必修下册",genre:"传记",stage:"高中",note:"「业」「其」「既然已」「勖」等实词，注意「虽」「而」的转折。",paragraphs:["郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之曰：“甚善。名我固当。”因舍其名，亦自谓“橐驼”云。","其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活；且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。","有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然。根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤。旦视而暮抚，已去而复顾。甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之；故不我若也。吾又何能为哉！","问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？","问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。"]},{id:"lingguan",title:"五代史伶官传序",author:"欧阳修",era:"北宋",book:"选择性必修中册",genre:"史论",stage:"高中",note:"「原」「盛」「遣」「抑」与「其」的指代，是本文核心考点。",paragraphs:["呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。","世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。","方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？《书》曰：“满招损，谦得益。”忧劳可以兴国，逸豫可以亡身，自然之理也。","故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉？"]},{id:"shizhongshan",title:"石钟山记",author:"苏轼",era:"北宋",book:"选择性必修下册",genre:"游记",stage:"高中",note:"「鼓」「是」「适」「盖」等实词辨析，是本文重点。",paragraphs:["《水经》云：“彭蠡之口有石钟山焉。”郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？","元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！","事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。"]},{id:"dengtaishan",title:"登泰山记",author:"姚鼐",era:"清",book:"必修上册",genre:"游记",stage:"高中",note:"「阴」「阳」「乘」「限」的地理义与「以」「于」的介词用法，是本文考点。",paragraphs:["泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。","余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅，崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南。望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。","戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之，或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。","亭西有岱祠，又有碧霞元君祠。皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来；其远古刻尽漫失。僻不当道者，皆不及往。","山多石，少土。石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。","桐城姚鼐记。"]}],Lh=[{id:"qihuanjinwen",title:"齐桓晋文之事",author:"孟子",era:"战国",book:"必修下册",genre:"对话",stage:"高中",note:"「爱」「辟」「莅」「度」等实词与「之」「以」的用法；「老吾老以及人之老」的活用是必考句。",paragraphs:["齐宣王问曰：“齐桓、晋文之事，可得闻乎？”","孟子对曰：“仲尼之徒无道桓文之事者，是以后世无传焉，臣未之闻也。无以，则王乎？”","曰：“德何如则可以王矣？”","曰：“保民而王，莫之能御也。”","曰：“若寡人者，可以保民乎哉？”","曰：“可。”","曰：“何由知吾可也？”","曰：“臣闻之胡龁曰：王坐于堂上，有牵牛而过堂下者，王见之，曰：‘牛何之？’对曰：‘将以衅钟。’王曰：‘舍之！吾不忍其觳觫，若无罪而就死地。’对曰：‘然则废衅钟与？’曰：‘何可废也？以羊易之！’——不识有诸？”","曰：“有之。”","曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”","王曰：“然，诚有百姓者。齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。”","曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？王若隐其无罪而就死地，则牛羊何择焉？”","王笑曰：“是诚何心哉？我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”","曰：“无伤也，是乃仁术也，见牛未见羊也。君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。是以君子远庖厨也。”","王说，曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。夫我乃行之，反而求之，不得吾心。夫子言之，于我心有戚戚焉。此心之所以合于王者，何也？”","曰：“有复于王者曰：‘吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪。’则王许之乎？”","曰：“否。”","“今恩足以及禽兽，而功不至于百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”","曰：“不为者与不能者之形何以异？”","曰：“挟太山以超北海，语人曰‘我不能’，是诚不能也。为长者折枝，语人曰‘我不能’，是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。老吾老，以及人之老；幼吾幼，以及人之幼：天下可运于掌。《诗》云：‘刑于寡妻，至于兄弟，以御于家邦。’言举斯心加诸彼而已。故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣。今恩足以及禽兽，而功不至于百姓者，独何与？权，然后知轻重；度，然后知长短。物皆然，心为甚。王请度之！”","“抑王兴甲兵，危士臣，构怨于诸侯，然后快于心与？”","王曰：“否，吾何快于是？将以求吾所大欲也。”","曰：“王之所大欲，可得闻与？”","王笑而不言。","曰：“为肥甘不足于口与？轻暖不足于体与？抑为采色不足视于目与？声音不足听于耳与？便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？”","曰：“否，吾不为是也。”","曰：“然则王之所大欲可知已：欲辟土地，朝秦楚，莅中国而抚四夷也。以若所为，求若所欲，犹缘木而求鱼也。”","王曰：“若是其甚与？”","曰：“殆有甚焉。缘木求鱼，虽不得鱼，无后灾；以若所为，求若所欲，尽心力而为之，后必有灾。”","曰：“可得闻与？”","曰：“邹人与楚人战，则王以为孰胜？”","曰：“楚人胜。”","曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地，方千里者九，齐集有其一。以一服八，何以异于邹敌楚哉？盖亦反其本矣。今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野，商贾皆欲藏于王之市，行旅皆欲出于王之涂，天下之欲疾其君者皆欲赴愬于王。其若是，孰能御之？”","王曰：“吾惛，不能进于是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”","曰：“无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已。及陷于罪，然后从而刑之，是罔民也。焉有仁人在位，罔民而可为也？是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。今也制民之产，仰不足以事父母，俯不足以畜妻子，乐岁终身苦，凶年不免于死亡。此惟救死而恐不赡，奚暇治礼义哉？王欲行之，则盍反其本矣：五亩之宅，树之以桑，五十者可以衣帛矣；鸡、豚、狗、彘之畜，无失其时，七十者可以食肉矣；百亩之田，勿夺其时，八口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”"]},{id:"paoding",title:"庖丁解牛",author:"庄子",era:"战国",book:"必修下册",genre:"寓言",stage:"高中",note:"「技」「道」「族」「为」的用法，「乎」「然」等虚词；「依乎天理」「因其固然」是翻译常考句。",paragraphs:["庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。","文惠君曰：“嘻，善哉！技盖至此乎？”","庖丁释刀对曰：“臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。依乎天理，批大郤，导大窾，因其固然，技经肯綮之未尝，而况大軱乎！良庖岁更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解数千牛矣，而刀刃若新发于硎。彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣，是以十九年而刀刃若新发于硎。虽然，每至于族，吾见其难为，怵然为戒，视为止，行为迟。动刀甚微，謋然已解，如土委地。提刀而立，为之四顾，为之踌躇满志，善刀而藏之。”","文惠君曰：“善哉！吾闻庖丁之言，得养生焉。”"]},{id:"zhuzhiwu",title:"烛之武退秦师",author:"《左传》",era:"春秋",book:"必修下册",genre:"史传",stage:"高中",note:"「鄙」「陪」「肆」「济」等实词，以及「以」「而」的连词用法；「越国以鄙远」「共其乏困」是重点句。",paragraphs:["晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。晋军函陵，秦军氾南。","佚之狐言于郑伯曰：“国危矣，若使烛之武见秦君，师必退。”公从之。辞曰：“臣之壮也，犹不如人；今老矣，无能为也已。”公曰：“吾不能早用子，今急而求子，是寡人之过也。然郑亡，子亦有不利焉。”许之。","夜缒而出，见秦伯，曰：“秦、晋围郑，郑既知亡矣。若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也，焉用亡郑以陪邻？邻之厚，君之薄也。若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所知也。夫晋，何厌之有？既东封郑，又欲肆其西封，若不阙秦，将焉取之？阙秦以利晋，唯君图之。”秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，乃还。","子犯请击之。公曰：“不可。微夫人之力不及此。因人之力而敝之，不仁；失其所与，不知；以乱易整，不武。吾其还也。”亦去之。"]},{id:"hongmenyan",title:"鸿门宴",author:"司马迁",era:"西汉",book:"必修下册",genre:"史传",stage:"高中",note:"「军」「王」「幸」「谢」等活用与「为」「以」的介词；「为之奈何」「何辞为」是虚词高频句。",paragraphs:["沛公军霸上，未得与项羽相见。沛公左司马曹无伤使人言于项羽曰：“沛公欲王关中，使子婴为相，珍宝尽有之。”项羽大怒曰：“旦日飨士卒，为击破沛公军！”当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。范增说项羽曰：“沛公居山东时，贪于财货，好美姬。今入关，财物无所取，妇女无所幸，此其志不在小。吾令人望其气，皆为龙虎，成五采，此天子气也。急击勿失！”","楚左尹项伯者，项羽季父也，素善留侯张良。张良是时从沛公，项伯乃夜驰之沛公军，私见张良，具告以事，欲呼张良与俱去，曰：“毋从俱死也。”张良曰：“臣为韩王送沛公，沛公今事有急，亡去不义，不可不语。”良乃入，具告沛公。沛公大惊，曰：“为之奈何？”张良曰：“谁为大王为此计者？”曰：“鲰生说我曰：‘距关，毋内诸侯，秦地可尽王也。’故听之。”良曰：“料大王士卒足以当项王乎？”沛公默然，曰：“固不如也。且为之奈何？”张良曰：“请往谓项伯，言沛公不敢背项王也。”沛公曰：“君安与项伯有故？”张良曰：“秦时与臣游，项伯杀人，臣活之；今事有急，故幸来告良。”沛公曰：“孰与君少长？”良曰：“长于臣。”沛公曰：“君为我呼入，吾得兄事之。”张良出，要项伯。项伯即入见沛公。沛公奉卮酒为寿，约为婚姻，曰：“吾入关，秋毫不敢有所近，籍吏民，封府库，而待将军。所以遣将守关者，备他盗之出入与非常也。日夜望将军至，岂敢反乎！愿伯具言臣之不敢倍德也。”项伯许诺，谓沛公曰：“旦日不可不蚤自来谢项王。”沛公曰：“诺。”于是项伯复夜去，至军中，具以沛公言报项王。因言曰：“沛公不先破关中，公岂敢入乎？今人有大功而击之，不义也。不如因善遇之。”项王许诺。","沛公旦日从百余骑来见项王，至鸿门，谢曰：“臣与将军戮力而攻秦，将军战河北，臣战河南，然不自意能先入关破秦，得复见将军于此。今者有小人之言，令将军与臣有郤。”项王曰：“此沛公左司马曹无伤言之。不然，籍何以至此？”项王即日因留沛公与饮。项王、项伯东向坐；亚父南向坐，——亚父者，范增也；沛公北向坐；张良西向侍。范增数目项王，举所佩玉玦以示之者三，项王默然不应。范增起，出，召项庄，谓曰：“君王为人不忍。若入前为寿，寿毕，请以剑舞，因击沛公于坐，杀之。不者，若属皆且为所虏！”庄则入为寿。寿毕，曰：“君王与沛公饮，军中无以为乐，请以剑舞。”项王曰：“诺。”项庄拔剑起舞。项伯亦拔剑起舞，常以身翼蔽沛公，庄不得击。","于是张良至军门见樊哙。樊哙曰：“今日之事何如？”良曰：“甚急！今者项庄拔剑舞，其意常在沛公也。”哙曰：“此迫矣！臣请入，与之同命。”哙即带剑拥盾入军门。交戟之卫士欲止不内。樊哙侧其盾以撞，卫士仆地。哙遂入，披帷西向立，瞋目视项王，头发上指，目眦尽裂。项王按剑而跽曰：“客何为者？”张良曰：“沛公之参乘樊哙者也。”项王曰：“壮士！——赐之卮酒。”则与斗卮酒。哙拜谢，起，立而饮之。项王曰：“赐之彘肩。”则与一生彘肩。樊哙覆其盾于地，加彘肩上，拔剑切而啖之。项王曰：“壮士！能复饮乎？”樊哙曰：“臣死且不避，卮酒安足辞！夫秦王有虎狼之心，杀人如不能举，刑人如恐不胜，天下皆叛之。怀王与诸将约曰：‘先破秦入咸阳者王之。’今沛公先破秦入咸阳，毫毛不敢有所近，封闭宫室，还军霸上，以待大王来。故遣将守关者，备他盗出入与非常也。劳苦而功高如此，未有封侯之赏，而听细说，欲诛有功之人，此亡秦之续耳。窃为大王不取也！”项王未有以应，曰：“坐。”樊哙从良坐。坐须臾，沛公起如厕，因招樊哙出。","沛公已出，项王使都尉陈平召沛公。沛公曰：“今者出，未辞也，为之奈何？”樊哙曰：“大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为？”于是遂去。乃令张良留谢。良问曰：“大王来何操？”曰：“我持白璧一双，欲献项王，玉斗一双，欲与亚父。会其怒，不敢献。公为我献之。”张良曰：“谨诺。”当是时，项王军在鸿门下，沛公军在霸上，相去四十里。沛公则置车骑，脱身独骑，与樊哙、夏侯婴、靳强、纪信等四人持剑盾步走，从郦山下，道芷阳间行。沛公谓张良曰：“从此道至吾军，不过二十里耳。度我至军中，公乃入。”","沛公已去，间至军中。张良入谢，曰：“沛公不胜杯杓，不能辞。谨使臣良奉白璧一双，再拜献大王足下，玉斗一双，再拜奉大将军足下。”项王曰：“沛公安在？”良曰：“闻大王有意督过之，脱身独去，已至军矣。”项王则受璧，置之坐上。亚父受玉斗，置之地，拔剑撞而破之，曰：“唉！竖子不足与谋！夺项王天下者必沛公也。吾属今为之虏矣！”","沛公至军，立诛杀曹无伤。"]},{id:"daxue",title:"大学之道",author:"《礼记》",era:"战国",book:"选择性必修上册",genre:"论说文",stage:"高中",note:"「明明德」「止于至善」的「明」「止」与「于」；「壹是皆以修身为本」是翻译常考句。",paragraphs:["大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始。知所先后，则近道矣。","古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知；致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。自天子以至于庶人，壹是皆以修身为本。其本乱而末治者否矣。其所厚者薄，而其所薄者厚，未之有也。"]},{id:"burenrenzhixin",title:"人皆有不忍人之心",author:"孟子",era:"战国",book:"选择性必修上册",genre:"论说文",stage:"高中",note:"「乍」「要」「恶」「辞让」等实词与「之」取消句子独立性；「非所以内交于孺子之父母也」是重点句。",paragraphs:["孟子曰：“人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣；以不忍人之心，行不忍人之政，治天下可运之掌上。所以谓人皆有不忍人之心者：今人乍见孺子将入于井，皆有怵惕恻隐之心；非所以内交于孺子之父母也，非所以要誉于乡党朋友也，非恶其声而然也。由是观之，无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。人之有是四端也，犹其有四体也。有是四端而自谓不能者，自贼者也；谓其君不能者，贼其君者也。凡有四端于我者，知皆扩而充之矣，若火之始然，泉之始达。苟能充之，足以保四海；苟不充之，不足以事父母。”"]},{id:"laozi4",title:"《老子》四章",author:"老子",era:"春秋",book:"选择性必修上册",genre:"语录体",stage:"高中",note:"「有」「无」「以为」的用法与「其」的指代；「自见者不明」「知人者智」是理解性默写高频句。",paragraphs:["三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。","古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者不欲盈。夫唯不盈，故能蔽而新成。","企者不立，跨者不行，自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。","知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。"]},{id:"wushizhihu",title:"五石之瓠",author:"庄子",era:"战国",book:"选择性必修上册",genre:"寓言",stage:"高中",note:"「树」「落」「呺然」「虑」等实词与「以」的用法；「夫子固拙于用大矣」「则所用之异也」是翻译常考句。",paragraphs:["惠子谓庄子曰：“魏王贻我大瓠之种，我树之成而实五石。以盛水浆，其坚不能自举也。剖之以为瓢，则瓠落无所容。非不呺然大也，吾为其无用而掊之。”庄子曰：“夫子固拙于用大矣。宋人有善为不龟手之药者，世世以洴澼絖为事。客闻之，请买其方百金。聚族而谋曰：‘我世世为洴澼絖，不过数金；今一朝而鬻技百金，请与之。’客得之，以说吴王。越有难，吴王使之将。冬，与越人水战，大败越人，裂地而封之。能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。今子有五石之瓠，何不虑以为大樽而浮乎江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！”"]},{id:"jianai",title:"兼爱",author:"墨子",era:"战国",book:"选择性必修上册",genre:"论说文",stage:"高中",note:"「攻」「亏」「慈」「劝」等实词与「之所以」结构；「当察乱何自起」「恶得不禁恶而劝爱」是重点句。",paragraphs:["圣人以治天下为事者也，必知乱之所自起，焉能治之；不知乱之所自起，则不能治。譬之如医之攻人之疾者然，必知疾之所自起，焉能攻之；不知疾之所自起，则弗能攻。治乱者何独不然？必知乱之所自起，焉能治之；不知乱之所自起，则弗能治。","圣人以治天下为事者也，不可不察乱之所自起。当察乱何自起？起不相爱。臣子之不孝君父，所谓乱也。子自爱，不爱父，故亏父而自利；弟自爱，不爱兄，故亏兄而自利；臣自爱，不爱君，故亏君而自利。此所谓乱也。虽父之不慈子，兄之不慈弟，君之不慈臣，此亦天下之所谓乱也。父自爱也，不爱子，故亏子而自利；兄自爱也，不爱弟，故亏弟而自利；君自爱也，不爱臣，故亏臣而自利。是何也？皆起不相爱。虽至天下之为盗贼者，亦然。盗爱其室，不爱其异室，故窃异室以利其室；贼爱其身，不爱人，故贼人以利其身。此何也？皆起不相爱。虽至大夫之相乱家、诸侯之相攻国者，亦然。大夫各爱其家，不爱异家，故乱异家以利其家；诸侯各爱其国，不爱异国，故攻异国以利其国。天下之乱物，具此而已矣。","察此何自起？皆起不相爱。若使天下兼相爱，爱人若爱其身，犹有不孝者乎？视父兄与君若其身，恶施不孝？犹有不慈者乎？视弟子与臣若其身，恶施不慈？故不孝不慈亡。犹有盗贼乎？视人之室若其室，谁窃？视人身若其身，谁贼？故盗贼有亡。犹有大夫之相乱家、诸侯之相攻国者乎？视人家若其家，谁乱？视人国若其国，谁攻？故大夫之相乱家、诸侯之相攻国者有亡。若使天下兼相爱，国与国不相攻，家与家不相乱，盗贼无有，君臣父子皆能孝慈，若此则天下治。","故圣人以治天下为事者，恶得不禁恶而劝爱？故天下兼相爱则治，交相恶则乱。故子墨子曰不可以不劝爱人者，此也。"]},{id:"suwuzhuan",title:"苏武传",author:"班固",era:"东汉",book:"选择性必修中册",genre:"史传（节选）",stage:"高中",note:"「使」「当」「坐」「见」等实词与「为」的被动用法；「见犯乃死，重负国」「何以汝为见」是翻译常考句。",paragraphs:["武字子卿，少以父任，兄弟并为郎。稍迁至栘中厩监。时汉连伐胡，数通使相窥观。匈奴留汉使郭吉、路充国等，前后十余辈。匈奴使来，汉亦留之以相当。天汉元年，且鞮侯单于初立，恐汉袭之，乃曰：“汉天子我丈人行也。”尽归汉使路充国等。武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者，因厚赂单于，答其善意。","武与副中郎将张胜及假吏常惠等募士斥候百余人俱。既至匈奴，置币遗单于。单于益骄，非汉所望也。方欲发使送武等，会缑王与长水虞常等谋反匈奴中。缑王者，昆邪王姊子也，与昆邪王俱降汉，后随浞野侯没胡中。及卫律所将降者，阴相与谋劫单于母阏氏归汉。会武等至匈奴，虞常在汉时素与副张胜相知，私候胜曰：“闻汉天子甚怨卫律，常能为汉伏弩射杀之。吾母与弟在汉，幸蒙其赏赐。”张胜许之，以货物与常。","后月余，单于出猎，独阏氏子弟在。虞常等七十余人欲发，其一人夜亡，告之。单于子弟发兵与战。缑王等皆死，虞常生得。单于使卫律治其事。张胜闻之，恐前语发，以状语武。武曰：“事如此，此必及我。见犯乃死，重负国。”欲自杀，胜、惠共止之。虞常果引张胜。单于怒，召诸贵人议，欲杀汉使者。左伊秩訾曰：“即谋单于，何以复加？宜皆降之。”","单于使卫律召武受辞，武谓惠等：“屈节辱命，虽生，何面目以归汉！”引佩刀自刺。卫律惊，自抱持武，驰召医。凿地为坎，置煴火，覆武其上，蹈其背以出血。武气绝，半日复息。惠等哭，舆归营。单于壮其节，朝夕遣人候问武，而收系张胜。","武益愈，单于使使晓武，会论虞常，欲因此时降武。剑斩虞常已，律曰：“汉使张胜谋杀单于近臣，当死。单于募降者赦罪。”举剑欲击之，胜请降。律谓武曰：“副有罪，当相坐。”武曰：“本无谋，又非亲属，何谓相坐？”复举剑拟之，武不动。律曰：“苏君，律前负汉归匈奴，幸蒙大恩，赐号称王，拥众数万，马畜弥山，富贵如此！苏君今日降，明日复然。空以身膏草野，谁复知之！”武不应。律曰：“君因我降，与君为兄弟；今不听吾计，后虽复欲见我，尚可得乎？”武骂律曰：“汝为人臣子，不顾恩义，畔主背亲，为降虏于蛮夷，何以汝为见！且单于信汝，使决人死生，不平心持正，反欲斗两主，观祸败。若知我不降明，欲令两国相攻，匈奴之祸，从我始矣。”","律知武终不可胁，白单于。单于愈益欲降之。乃幽武置大窖中，绝不饮食。天雨雪，武卧啮雪，与旃毛并咽之，数日不死。匈奴以为神，乃徙武北海上无人处，使牧羝，羝乳乃得归。别其官属常惠等各置他所。","武既至海上，廪食不至，掘野鼠去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。积五六年，单于弟於靬王弋射海上。武能网纺缴，檠弓弩，於靬王爱之，给其衣食。三岁余，王病，赐武马畜、服匿、穹庐。王死后，人众徙去。其冬，丁令盗武牛羊，武复穷厄。"]},{id:"lanting",title:"兰亭集序",author:"王羲之",era:"东晋",book:"选择性必修下册",genre:"序",stage:"高中",note:"「修」「期」「致」「临」等实词与「之」「于」的用法；「所以游目骋怀」「不能喻之于怀」是重点句。",paragraphs:["永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。","是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。","夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云：“死生亦大矣。”岂不痛哉！","每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。"]}],Qs=[{id:"loushiming",title:"陋室铭",author:"刘禹锡",era:"唐",book:"七年级下册",genre:"铭",stage:"初中",note:"托物言志的短制，虚词「之」「则」与实词「名」「上」「劳」密集，适合逐字过考点。",paragraphs:["山不在高，有仙则名。水不在深，有龙则灵。斯是陋室，惟吾德馨。苔痕上阶绿，草色入帘青。谈笑有鸿儒，往来无白丁。可以调素琴，阅金经。无丝竹之乱耳，无案牍之劳形。南阳诸葛庐，西蜀子云亭。孔子云：何陋之有？"]},{id:"ailianshuo",title:"爱莲说",author:"周敦颐",era:"北宋",book:"七年级下册",genre:"说",stage:"初中",note:"「之」的取消句子独立性、「者也」判断句、「鲜」「宜」多义词，是本文三大考点。",paragraphs:["水陆草木之花，可爱者甚蕃。晋陶渊明独爱菊。自李唐来，世人甚爱牡丹。予独爱莲之出淤泥而不染，濯清涟而不妖，中通外直，不蔓不枝，香远益清，亭亭净植，可远观而不可亵玩焉。","予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。噫！菊之爱，陶后鲜有闻。莲之爱，同予者何人？牡丹之爱，宜乎众矣。"]},{id:"yueyanglouji",title:"岳阳楼记",author:"范仲淹",era:"北宋",book:"九年级上册",genre:"记",stage:"初中",note:"「属」「去」「微」「景」等实词与「然则」「若夫」「至若」等固定表达，是翻译题高频点。",paragraphs:["庆历四年春，滕子京谪守巴陵郡。越明年，政通人和，百废具兴。乃重修岳阳楼，增其旧制，刻唐贤今人诗赋于其上。属予作文以记之。","予观夫巴陵胜状，在洞庭一湖。衔远山，吞长江，浩浩汤汤，横无际涯；朝晖夕阴，气象万千。此则岳阳楼之大观也，前人之述备矣。然则北通巫峡，南极潇湘，迁客骚人，多会于此，览物之情，得无异乎？","若夫淫雨霏霏，连月不开，阴风怒号，浊浪排空；日星隐曜，山岳潜形；商旅不行，樯倾楫摧；薄暮冥冥，虎啸猿啼。登斯楼也，则有去国怀乡，忧谗畏讥，满目萧然，感极而悲者矣。","至若春和景明，波澜不惊，上下天光，一碧万顷；沙鸥翔集，锦鳞游泳；岸芷汀兰，郁郁青青。而或长烟一空，皓月千里，浮光跃金，静影沉璧，渔歌互答，此乐何极！登斯楼也，则有心旷神怡，宠辱偕忘，把酒临风，其喜洋洋者矣。","嗟夫！予尝求古仁人之心，或异二者之为，何哉？不以物喜，不以己悲；居庙堂之高则忧其民；处江湖之远则忧其君。是进亦忧，退亦忧。然则何时而乐耶？其必曰「先天下之忧而忧，后天下之乐而乐」乎。噫！微斯人，吾谁与归？时六年九月十五日。"]},{id:"zuiwengtingji",title:"醉翁亭记",author:"欧阳修",era:"北宋",book:"九年级上册",genre:"记",stage:"初中",note:"二十一个「也」字判断句是本文标志；「名」「意」「谓」等实词与「而」的转折、承接用法并重。",paragraphs:["环滁皆山也。其西南诸峰，林壑尤美，望之蔚然而深秀者，琅琊也。山行六七里，渐闻水声潺潺而泻出于两峰之间者，酿泉也。峰回路转，有亭翼然临于泉上者，醉翁亭也。作亭者谁？山之僧智仙也。名之者谁？太守自谓也。太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也。醉翁之意不在酒，在乎山水之间也。山水之乐，得之心而寓之酒也。","若夫日出而林霏开，云归而岩穴暝，晦明变化者，山间之朝暮也。野芳发而幽香，佳木秀而繁阴，风霜高洁，水落而石出者，山间之四时也。朝而往，暮而归，四时之景不同，而乐亦无穷也。","至于负者歌于途，行者休于树，前者呼，后者应，伛偻提携，往来而不绝者，滁人游也。临溪而渔，溪深而鱼肥，酿泉为酒，泉香而酒洌，山肴野蔌，杂然而前陈者，太守宴也。宴酣之乐，非丝非竹，射者中，弈者胜，觥筹交错，起坐而喧哗者，众宾欢也。苍颜白发，颓然乎其间者，太守醉也。","已而夕阳在山，人影散乱，太守归而宾客从也。树林阴翳，鸣声上下，游人去而禽鸟乐也。然而禽鸟知山林之乐，而不知人之乐；人知从太守游而乐，而不知太守之乐其乐也。醉能同其乐，醒能述以文者，太守也。太守谓谁？庐陵欧阳修也。"]},{id:"taohuayuanji",title:"桃花源记",author:"陶渊明",era:"东晋",book:"八年级下册",genre:"记",stage:"初中",note:"古今异义最集中的一篇：「交通」「妻子」「无论」「鲜美」「绝境」全在此文，几乎年年设题。",paragraphs:["晋太元中，武陵人捕鱼为业。缘溪行，忘路之远近。忽逢桃花林，夹岸数百步，中无杂树，芳草鲜美，落英缤纷。渔人甚异之。复前行，欲穷其林。","林尽水源，便得一山，山有小口，仿佛若有光。便舍船，从口入。初极狭，才通人。复行数十步，豁然开朗。土地平旷，屋舍俨然，有良田美池桑竹之属。阡陌交通，鸡犬相闻。其中往来种作，男女衣着，悉如外人。黄发垂髫，并怡然自乐。","见渔人，乃大惊，问所从来。具答之。便要还家，设酒杀鸡作食。村中闻有此人，咸来问讯。自云先世避秦时乱，率妻子邑人来此绝境，不复出焉，遂与外人间隔。问今是何世，乃不知有汉，无论魏晋。此人一一为具言所闻，皆叹惋。余人各复延至其家，皆出酒食。停数日，辞去。此中人语云：「不足为外人道也。」","既出，得其船，便扶向路，处处志之。及郡下，诣太守，说如此。太守即遣人随其往，寻向所志，遂迷，不复得路。","南阳刘子骥，高尚士也，闻之，欣然规往。未果，寻病终，后遂无问津者。"]},{id:"lunyu12",title:"《论语》十二章",author:"孔子及其弟子",era:"春秋",book:"选择性必修上册",genre:"语录体",stage:"高中",note:"「而」「之」「其」高频出现；「敏于事而慎于言」的介词结构、「不患人之不己知」的宾语前置是常考点。",paragraphs:["子曰：“人而不仁，如礼何？人而不仁，如乐何？”（《八佾》）","子曰：“朝闻道，夕死可矣。”（《里仁》）","子曰：“君子喻于义，小人喻于利。”（《里仁》）","子曰：“见贤思齐焉，见不贤而内自省也。”（《里仁》）","子曰：“质胜文则野，文胜质则史。文质彬彬，然后君子。”（《雍也》）","曾子曰：“士不可以不弘毅，任重而道远。仁以为己任，不亦重乎？死而后已，不亦远乎？”（《泰伯》）","子曰：“譬如为山，未成一篑，止，吾止也。譬如平地，虽覆一篑，进，吾往也。”（《子罕》）","子曰：“知者不惑，仁者不忧，勇者不惧。”（《子罕》）","颜渊问仁。子曰：“克己复礼为仁。一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？”颜渊曰：“请问其目。”子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”颜渊曰：“回虽不敏，请事斯语矣。”（《颜渊》）","子贡问曰：“有一言而可以终身行之者乎？”子曰：“其‘恕’乎！己所不欲，勿施于人。”（《卫灵公》）","子曰：“小子何莫学夫《诗》？《诗》可以兴，可以观，可以群，可以怨。迩之事父，远之事君。多识于鸟兽草木之名。”（《阳货》）"]},{id:"quanxue",title:"劝学",author:"荀子",era:"战国",book:"必修上册",genre:"论说文",stage:"高中",note:"「青，取之于蓝」的「于」、「而」的并列与修饰、「焉」作兼词，是本文三大考点。",paragraphs:["君子曰：学不可以已。","青，取之于蓝，而青于蓝；冰，水为之，而寒于水。木直中绳，𫐓以为轮，其曲中规。虽有槁暴，不复挺者，𫐓使之然也。故木受绳则直，金就砺则利，君子博学而日参省乎己，则知明而行无过矣。","吾尝终日而思矣，不如须臾之所学也；吾尝跂而望矣，不如登高之博见也。登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。","积土成山，风雨兴焉；积水成渊，蛟龙生焉；积善成德，而神明自得，圣心备焉。故不积跬步，无以至千里；不积小流，无以成江海。骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。蚓无爪牙之利，筋骨之强，上食埃土，下饮黄泉，用心一也。蟹六跪而二螯，非蛇鳝之穴无可寄托者，用心躁也。"]},{id:"quyuan",title:"屈原列传",author:"司马迁",era:"西汉",book:"选择性必修中册",genre:"史传（节选）",stage:"高中",note:"节选「屈平疾王听之不聪也」一段，重点看「疾」「伐」「害」「间」与「之」取消句子独立性。",paragraphs:["屈平疾王听之不聪也，谗谄之蔽明也，邪曲之害公也，方正之不容也，故忧愁幽思而作《离骚》。“离骚”者，犹离忧也。夫天者，人之始也；父母者，人之本也。人穷则反本，故劳苦倦极，未尝不呼天也；疾痛惨怛，未尝不呼父母也。屈平正道直行，竭忠尽智以事其君，谗人间之，可谓穷矣。信而见疑，忠而被谤，能无怨乎？屈平之作《离骚》，盖自怨生也。《国风》好色而不淫，《小雅》怨诽而不乱。若《离骚》者，可谓兼之矣。上称帝喾，下道齐桓，中述汤、武，以刺世事。明道德之广崇，治乱之条贯，靡不毕见。其文约，其辞微，其志洁，其行廉。其称文小而其指极大，举类迩而见义远。其志洁，故其称物芳；其行廉，故死而不容。自疏濯淖污泥之中，蝉蜕于浊秽，以浮游尘埃之外，不获世之滋垢，皭然泥而不滓者也。推此志也，虽与日月争光可也。"]},{id:"jianshisi",title:"谏太宗十思疏",author:"魏征",era:"唐",book:"必修下册",genre:"奏疏",stage:"高中",note:"「固本思源」「居安思危」两段是高频考点，「以」「而」「所」密集。",paragraphs:["臣闻求木之长者，必固其根本；欲流之远者，必浚其泉源；思国之安者，必积其德义。源不深而望流之远，根不固而求木之长，德不厚而思国之理，臣虽下愚，知其不可，而况于明哲乎！人君当神器之重，居域中之大，将崇极天之峻，永保无疆之休。不念居安思危，戒奢以俭，德不处其厚，情不胜其欲，斯亦伐根以求木茂，塞源而欲流长者也。","凡百元首，承天景命，莫不殷忧而道著，功成而德衰。有善始者实繁，能克终者盖寡。岂取之易而守之难乎？昔取之而有余，今守之而不足，何也？夫在殷忧，必竭诚以待下；既得志，则纵情以傲物。竭诚则胡越为一体，傲物则骨肉为行路。虽董之以严刑，振之以威怒，终苟免而不怀仁，貌恭而不心服。怨不在大，可畏惟人；载舟覆舟，所宜深慎；奔车朽索，其可忽乎！","君人者，诚能见可欲则思知足以自戒，将有作则思知止以安人，念高危则思谦冲而自牧，惧满溢则思江海下百川，乐盘游则思三驱以为度，忧懈怠则思慎始而敬终，虑壅蔽则思虚心以纳下，想谗邪则思正身以黜恶，恩所加则思无因喜以谬赏，罚所及则思无因怒而滥刑。总此十思，弘兹九德，简能而任之，择善而从之，则智者尽其谋，勇者竭其力，仁者播其惠，信者效其忠。文武争驰，在君无事，可以尽豫游之乐，可以养松、乔之寿，鸣琴垂拱，不言而化。何必劳神苦思，代下司职，役聪明之耳目，亏无为之大道哉！"]},{id:"shishuo",title:"师说",author:"韩愈",era:"唐",book:"必修上册",genre:"论说文",stage:"高中",note:"「师道之不传也久矣」的「之」、「其」的指代、「于」的三种用法，是本文核心。",paragraphs:["古之学者必有师。师者，所以传道受业解惑也。人非生而知之者，孰能无惑？惑而不从师，其为惑也，终不解矣。生乎吾前，其闻道也固先乎吾，吾从而师之；生乎吾后，其闻道也亦先乎吾，吾从而师之。吾师道也，夫庸知其年之先后生于吾乎？是故无贵无贱，无长无少，道之所存，师之所存也。","嗟乎！师道之不传也久矣！欲人之无惑也难矣！古之圣人，其出人也远矣，犹且从师而问焉；今之众人，其下圣人也亦远矣，而耻学于师。是故圣益圣，愚益愚。圣人之所以为圣，愚人之所以为愚，其皆出于此乎？爱其子，择师而教之；于其身也，则耻师焉，惑矣。彼童子之师，授之书而习其句读者，非吾所谓传其道解其惑者也。句读之不知，惑之不解，或师焉，或不焉，小学而大遗，吾未见其明也。巫医乐师百工之人，不耻相师。士大夫之族，曰师曰弟子云者，则群聚而笑之。问之，则曰：“彼与彼年相若也，道相似也，位卑则足羞，官盛则近谀。”呜呼！师道之不复，可知矣。巫医乐师百工之人，君子不齿，今其智乃反不能及，其可怪也欤！","圣人无常师。孔子师郯子、苌弘、师襄、老聃。郯子之徒，其贤不及孔子。孔子曰：三人行，则必有我师。是故弟子不必不如师，师不必贤于弟子，闻道有先后，术业有专攻，如是而已。","李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。"]},{id:"afanggong",title:"阿房宫赋",author:"杜牧",era:"晚唐",book:"必修下册",genre:"赋",stage:"高中",note:"「六王毕，四海一」的「一」活用、「后人哀之而不鉴之」的「鉴」意动，是必考句。",paragraphs:["六王毕，四海一，蜀山兀，阿房出。覆压三百余里，隔离天日。骊山北构而西折，直走咸阳。二川溶溶，流入宫墙。五步一楼，十步一阁；廊腰缦回，檐牙高啄；各抱地势，钩心斗角。盘盘焉，囷囷焉，蜂房水涡，矗不知其几千万落。长桥卧波，未云何龙？复道行空，不霁何虹？高低冥迷，不知西东。歌台暖响，春光融融；舞殿冷袖，风雨凄凄。一日之内，一宫之间，而气候不齐。","妃嫔媵嫱，王子皇孙，辞楼下殿，辇来于秦。朝歌夜弦，为秦宫人。明星荧荧，开妆镜也；绿云扰扰，梳晓鬟也；渭流涨腻，弃脂水也；烟斜雾横，焚椒兰也。雷霆乍惊，宫车过也；辘辘远听，杳不知其所之也。一肌一容，尽态极妍，缦立远视，而望幸焉。有不见者，三十六年。燕赵之收藏，韩魏之经营，齐楚之精英，几世几年，剽掠其人，倚叠如山。一旦不能有，输来其间。鼎铛玉石，金块珠砾，弃掷逦迤，秦人视之，亦不甚惜。","嗟乎！一人之心，千万人之心也。秦爱纷奢，人亦念其家。奈何取之尽锱铢，用之如泥沙？使负栋之柱，多于南亩之农夫；架梁之椽，多于机上之工女；钉头磷磷，多于在庾之粟粒；瓦缝参差，多于周身之帛缕；直栏横槛，多于九土之城郭；管弦呕哑，多于市人之言语。使天下之人，不敢言而敢怒。独夫之心，日益骄固。戍卒叫，函谷举，楚人一炬，可怜焦土！","呜呼！灭六国者六国也，非秦也；族秦者秦也，非天下也。嗟乎！使六国各爱其人，则足以拒秦；使秦复爱六国之人，则递三世可至万世而为君，谁得而族灭也？秦人不暇自哀，而后人哀之；后人哀之而不鉴之，亦使后人而复哀后人也。"]},{id:"liuguolun",title:"六国论",author:"苏洵",era:"北宋",book:"必修下册",genre:"史论",stage:"高中",note:"「弊在赂秦」的「弊」、「率」「厥」「殆」「与」胜负已判，是本文实词重点。",paragraphs:["六国破灭，非兵不利，战不善，弊在赂秦。赂秦而力亏，破灭之道也。或曰：六国互丧，率赂秦耶？曰：不赂者以赂者丧。盖失强援，不能独完。故曰：弊在赂秦也。","秦以攻取之外，小则获邑，大则得城。较秦之所得，与战胜而得者，其实百倍；诸侯之所亡，与战败而亡者，其实亦百倍。则秦之所大欲，诸侯之所大患，固不在战矣。思厥先祖父，暴霜露，斩荆棘，以有尺寸之地。子孙视之不甚惜，举以予人，如弃草芥。今日割五城，明日割十城，然后得一夕安寝。起视四境，而秦兵又至矣。然则诸侯之地有限，暴秦之欲无厌，奉之弥繁，侵之愈急。故不战而强弱胜负已判矣。至于颠覆，理固宜然。古人云：“以地事秦，犹抱薪救火，薪不尽，火不灭。”此言得之。","齐人未尝赂秦，终继五国迁灭，何哉？与嬴而不助五国也。五国既丧，齐亦不免矣。燕赵之君，始有远略，能守其土，义不赂秦。是故燕虽小国而后亡，斯用兵之效也。至丹以荆卿为计，始速祸焉。赵尝五战于秦，二败而三胜。后秦击赵者再，李牧连却之。洎牧以谗诛，邯郸为郡，惜其用武而不终也。且燕赵处秦革灭殆尽之际，可谓智力孤危，战败而亡，诚不得已。向使三国各爱其地，齐人勿附于秦，刺客不行，良将犹在，则胜负之数，存亡之理，当与秦相较，或未易量。","呜呼！以赂秦之地封天下之谋臣，以事秦之心礼天下之奇才，并力西向，则吾恐秦人食之不得下咽也。悲夫！有如此之势，而为秦人积威之所劫，日削月割，以趋于亡。为国者无使为积威之所劫哉！","夫六国与秦皆诸侯，其势弱于秦，而犹有可以不赂而胜之之势。苟以天下之大，下而从六国破亡之故事，是又在六国下矣。"]},{id:"dasima",title:"答司马谏议书",author:"王安石",era:"北宋",book:"必修下册",genre:"书信",stage:"高中",note:"「见」「名」「膏泽」等实词与「以」「为」的介词用法，是本文考点集中处。",paragraphs:["某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。重念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。","盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。","人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已；盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。","无由会晤，不任区区向往之至！"]},{id:"chibifu",title:"赤壁赋",author:"苏轼",era:"北宋",book:"必修上册",genre:"赋",stage:"高中",note:"「少焉」「正襟危坐」的「危」、「卒」「适」与「逝者如斯」，是本文高频点。",paragraphs:["壬戌之秋，七月既望，苏子与客泛舟游于赤壁之下。清风徐来，水波不兴。举酒属客，诵明月之诗，歌窈窕之章。少焉，月出于东山之上，徘徊于斗牛之间。白露横江，水光接天。纵一苇之所如，凌万顷之茫然。浩浩乎如冯虚御风，而不知其所止；飘飘乎如遗世独立，羽化而登仙。","于是饮酒乐甚，扣舷而歌之。歌曰：“桂棹兮兰桨，击空明兮溯流光。渺渺兮予怀，望美人兮天一方。”客有吹洞箫者，倚歌而和之。其声呜呜然，如怨如慕，如泣如诉，余音袅袅，不绝如缕。舞幽壑之潜蛟，泣孤舟之嫠妇。","苏子愀然，正襟危坐而问客曰：“何为其然也？”客曰：“‘月明星稀，乌鹊南飞’，此非曹孟德之诗乎？西望夏口，东望武昌，山川相缪，郁乎苍苍，此非孟德之困于周郎者乎？方其破荆州，下江陵，顺流而东也，舳舻千里，旌旗蔽空，酾酒临江，横槊赋诗，固一世之雄也，而今安在哉？况吾与子渔樵于江渚之上，侣鱼虾而友麋鹿，驾一叶之扁舟，举匏樽以相属。寄蜉蝣于天地，渺沧海之一粟。哀吾生之须臾，羡长江之无穷。挟飞仙以遨游，抱明月而长终。知不可乎骤得，托遗响于悲风。","苏子曰：“客亦知夫水与月乎？逝者如斯，而未尝往也；盈虚者如彼，而卒莫消长也。盖将自其变者而观之，则天地曾不能以一瞬；自其不变者而观之，则物与我皆无尽也，而又何羡乎且夫天地之间，物各有主，苟非吾之所有，虽一毫而莫取。惟江上之清风，与山间之明月，耳得之而为声，目遇之而成色，取之无禁，用之不竭，是造物者之无尽藏也，而吾与子之所共适。","客喜而笑，洗盏更酌。肴核既尽，杯盘狼籍。相与枕藉乎舟中，不知东方之既白。"]},{id:"xiangjixuan",title:"项脊轩志",author:"归有光",era:"明",book:"选择性必修下册",genre:"散文",stage:"高中",note:"「顾」「比」「殆」「得」与「而」的转折，是本文实词虚词重点。",paragraphs:["项脊轩，旧南阁子也。室仅方丈，可容一人居。百年老屋，尘泥渗漉，雨泽下注；每移案，顾视无可置者。又北向，不能得日，日过午已昏。余稍为修葺，使不上漏。前辟四窗，垣墙周庭，以当南日，日影反照，室始洞然。又杂植兰桂竹木于庭，旧时栏楯，亦遂增胜。借书满架，偃仰啸歌，冥然兀坐，万籁有声；而庭阶寂寂，小鸟时来啄食，人至不去。三五之，明月半墙，桂影斑驳，风移影动，珊珊夜可爱。","然余居于此，多可喜，亦多可悲。先是庭中通南北为一。迨诸父异爨，内外多置小门墙，往往而是。东犬西吠，客逾庖而宴，鸡栖于厅。庭中始为篱，已为墙，凡再变矣。家有老妪，尝居于此。妪，先大母婢也，乳二世，先妣抚之甚厚。室西连于中闺，先妣尝一至。妪每谓余曰：“某所，而母立于兹。”妪又曰：“汝姊在吾怀，呱呱而泣；娘以指叩门扉曰：‘儿寒乎？欲食乎？’吾从板外相为应答。”语未毕，余泣，妪亦泣。余自束发读书轩中，一日，大母过余曰：“吾儿，久不见若影，何竟日默默在此，大类女郎也？”比去，以手阖门，自语曰：“吾家读书久不效，儿之成，则可待乎！”顷之，持一象笏至，曰：“此吾祖太常公宣德间执此以朝，他日汝当用之！”瞻顾遗迹，如在昨日，令人长号不自禁。","轩东故尝为厨，人往，从轩前过。余扃牖而居，久之，能以足音辨人。轩凡四遭火，得不焚，殆有神护者。","…………","余既为此志，后五年，吾妻来归，时至轩中，从余问古事，或凭几学书。吾妻归宁，述诸小妹语曰：“闻姊家有阁子，且何谓阁子也？”其后六年，吾妻死，室坏不修。其后二年，余久卧病无聊，乃使人复葺南阁子，其制稍异于前。然自后余多在外，不常居。","庭有枇杷树，吾妻死之年所手植也，今已亭亭如盖矣。"]},{id:"shizuo",title:"子路、曾皙、冉有、公西华侍坐",author:"《论语》",era:"春秋",book:"必修下册",genre:"语录体",stage:"高中",note:"「以」「如」「方」「与」四个虚词是核心考点，「率尔」「哂」等实词同为重点。",paragraphs:["子路、曾皙、冉有、公西华侍坐。","子曰：“以吾一日长乎尔，毋吾以也。居则曰：‘不吾知也！’如或知尔，则何以哉？","子路率尔而对曰：“千乘之国，摄乎大国之间，加之以师旅，因之以饥馑；由也为之，比及三年，可使有勇，且知方也。","夫子哂之。","“求！尔何如？","对曰：“方六七十，如五六十，求也为之，比及三年，可使足民。如其礼乐，以俟君子。","“赤！尔何如？","对曰：“非曰能之，愿学焉。宗庙之事，如会同，端章甫，愿为小相焉。","“点！尔何如？","鼓瑟希，铿尔，舍瑟而作，对曰：“异乎三子者之撰。","子曰：“何伤乎？亦各言其志也。","曰：“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归。","夫子喟然叹曰：“吾与点也！","三子者出，曾皙后。曾皙曰：“夫三子者之言何如？","子曰：“亦各言其志也已矣。","曰：“夫子何哂由也？","曰：“为国以礼，其言不让，是故哂之。","“唯求则非邦也与？","“安见方六七十如五六十而非邦也者？","“唯赤则非邦也与？","“宗庙会同，非诸侯而何？赤也","？为之小，孰能为之大"]},{id:"baorenan",title:"报任安书",author:"司马迁",era:"西汉",book:"选择性必修中册",genre:"书信（节选）",stage:"高中",note:"「所以」「用」「通其道」的「通」、「就极刑而无愠色」，是本文重点句。",paragraphs:["古者富贵而名摩灭，不可胜记，唯倜傥非常之人称焉。盖文王拘而演《周易》；仲尼厄而作《春秋》；屈原放逐，乃赋《离骚》；左丘失明，厥有《国语》；孙子膑脚，《兵法》修列；不韦迁蜀，世传《吕览》；韩非囚秦,《说难》《孤愤》；《诗》三百篇，大底圣贤发愤之所为作也。此人皆意有所郁结，不得通其道，故述往事，思来者。乃如左丘无目，孙子断足，终不可用，退而论书策，以舒其愤，思垂空文以自见。","仆窃不逊，近自托于无能之辞，网罗天下放失旧闻，略考其行事，综其终始，稽其成败兴坏之纪，上计轩辕，下至于兹，为十表，本纪十二，书八章，世家三十，列传七十，凡百三十篇。亦欲以究天人之际，通古今之变，成一家之言。草创未就，会遭此祸，惜其不成，是以就极刑而无愠色。仆诚以著此书，藏之名山，传之其人，通邑大都，则仆偿前辱之责，虽万被戮，岂有悔哉！然此可为智者道，难为俗人言也。"]},{id:"guoqinlun",title:"过秦论",author:"贾谊",era:"西汉",book:"选择性必修中册",genre:"史论",stage:"高中",note:"「因」「致」「延」「爱」等实词与「以」的连词用法，是本文考点。",paragraphs:["秦孝公据崤函之固，拥雍州之地，君臣固守以窥周室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心。当是时也，商君佐之，内立法度，务耕织，修守战之具，外连衡而斗诸侯。于是秦人拱手而取西河之外。","孝公既没，惠文、武、昭襄蒙故业，因遗策，南取汉中，西举巴、蜀，东割膏腴之地，北收要害之郡。诸侯恐惧，会盟而谋弱秦，不爱珍器重宝肥饶之地，以致天下之士，合从缔交，相与为一。当此之时，齐有孟尝，赵有平原，楚有春申，魏有信陵。此四君者，皆明智而忠信，宽厚而爱人，尊贤而重士，约从离衡，兼韩、魏、燕、楚、齐、赵、宋、卫、中山之众。于是六国之士，有甯越、徐尚、苏秦、杜赫之属为之谋，齐明、周最、陈轸、召滑、楼缓、翟景、苏厉、乐毅之徒通其意，吴起、孙膑、带佗、倪良、王廖、田忌、廉颇、赵奢之伦制其兵。尝以十倍之地，百万之众，叩关而攻秦。秦人开关延敌，九国之师，逡巡而不敢进。秦无亡矢遗镞之费，而天下诸侯已困矣。于是从散约败，争割地而赂秦。秦有余力而制其弊，追亡逐北，伏尸百万，流血漂橹；因利乘便，宰割天下，分裂山河。强国请服，弱国入朝。延及孝文王、庄襄王，享国之日浅，国家无事。","及至始皇，奋六世之余烈，振长策而御宇内，吞二周而亡诸侯，履至尊而制六合，执敲扑而鞭笞天下，威振四海。南取百越之地，以为桂林、象郡；百越之君，俯首系颈，委命下吏。乃使蒙恬北筑长城而守藩篱，却匈奴七百余里；胡人不敢南下而牧马，士不敢弯弓而报怨。于是废先王之道，焚百家之言，以愚黔首；隳名城，杀豪杰；收天下之兵，聚之咸阳，销锋镝，铸以为金人十二，以弱天下之民。然后践华为城，因河为池，据亿丈之城，临不测之渊，以为固。良将劲弩守要害之处，信臣精卒陈利兵而谁何。天下已定，始皇之心，自以为关中之固，金城千里，子孙帝王万世之业也。","始皇既没，余威震于殊俗。然陈涉瓮牖绳枢之子，氓隶之人，而迁徙之徒也；才能不及中人，非有仲尼、墨翟之贤，陶朱、猗顿之富；蹑足行伍之间，而倔起阡陌之中，率疲弊之卒，将数百之众，转而攻秦；斩木为兵，揭竿为旗，天下云集响应，赢粮而景从。山东豪俊遂并起而亡秦族矣。","且夫天下非小弱也，雍州之地，崤函之固，自若也。陈涉之位，非尊于齐、楚、燕、赵、韩、魏、宋、卫、中山之君也；锄棘矜，非铦于钩戟长铩也；而谪戍之众，非抗于九国之师也；深谋远虑，行军用兵之道，非及乡时之士也。然而成败异变，功业相反，何也？试使山东之国与陈涉度长絜大，比权量力，则不可同年而语矣。然秦以区区之地，致万乘之势，序八州而朝同列，百有余年矣；然后以六合为家，崤函为宫；一夫作难而七庙隳，身死人手，为天下笑者，何也？仁义不施而攻守之势异也。"]},{id:"dadao",title:"大道之行也",author:"《礼记》",era:"战国",book:"八年级下册",genre:"论说文",stage:"初中",note:"「与」「亲」「子」的活用与「故」「是故」的承接，是本文考点。",paragraphs:["大道之行也，天下为公。选贤与能，讲信修睦。故人不独亲其亲，不独子其子，使老有所终，壮有所用，幼有所长，矜、寡、孤、独、废疾者皆有所养，男有分，女有归。货恶其弃于地也，不必藏于己；力恶其不出于身也，不必为己。是故谋闭而不兴，盗窃乱贼而不作，故外户而不闭。是谓大同。"]},{id:"chenqingbiao",title:"陈情表",author:"李密",era:"西晋",book:"选择性必修下册",genre:"表",stage:"高中",note:"「见背」「除」「婴」「薄」等实词，「以」「于」的介词用法，是本文重点。",paragraphs:["臣密言：臣以险衅，夙遭闵凶。生孩六月，慈父见背；行年四岁，舅夺母志。祖母刘愍臣孤弱，躬亲抚养。臣少多疾病，九岁不行，零丁孤苦，至于成立。既无伯叔，终鲜兄弟，门衰祚薄，晚有儿息。外无期功强近之亲，内无应门五尺之僮，茕茕孑立，形影相吊。而刘夙婴疾病，常在床蓐，臣侍汤药，未曾废离。","逮奉圣朝，沐浴清化。前太守臣逵察臣孝廉，后刺史臣荣举臣秀才。臣以供养无主，辞不赴命。诏书特下，拜臣郎中，寻蒙国恩，除臣洗马。猥以微贱，当侍东宫，非臣陨首所能上报。臣具以表闻，辞不就职。诏书切峻，责臣逋慢；郡县逼迫，催臣上道；州司临门，急于星火。臣欲奉诏奔驰，则刘病日笃；欲苟顺私情，则告诉不许：臣之进退，实为狼狈。","伏惟圣朝以孝治天下，凡在故老，犹蒙矜育，况臣孤苦，特为尤甚。且臣少仕伪朝，历职郎署，本图宦达，不矜名节。今臣亡国贱俘，至微至陋，过蒙拔擢，宠命优渥，岂敢盘桓，有所希冀。但以刘日薄西山，气息奄奄，人命危浅，朝不虑夕。臣无祖母，无以至今日；祖母无臣，无以终余年。母、孙二人，更相为命，是以区区不能废远。","臣密今年四十有四，祖母今年九十有六，是臣尽节于陛下之日长，报养刘之日短也。乌鸟私情，愿乞终养。臣之辛苦，非独蜀之人士及二州牧伯所见明知，皇天后土实所共鉴。愿陛下矜愍愚诚，听臣微志，庶刘侥幸，保卒余年。臣生当陨首，死当结草。臣不胜犬马怖惧之情，谨拜表以闻。"]},{id:"guiqulaici",title:"归去来兮辞",author:"陶渊明",era:"东晋",book:"选择性必修下册",genre:"辞",stage:"高中",note:"「以」「而」「之」的用法与「觉今是而昨非」的「是」「非」，是本文核心。",paragraphs:["余家贫，耕植不足以自给。幼稚盈室，瓶无储粟，生生所资，未见其术。亲故多劝余为长吏，脱然有怀，求之靡途。会有四方之事，诸侯以惠爱为德，家叔以余贫苦，遂见用于小邑。于时风波未静，心惮远役，彭泽去家百里，公田之利，足以为酒。故便求之。及少日，眷然有“归欤”之情。何则？质性自然，非矫厉所得。饥冻虽切，违己交病。尝从人事，皆口腹自役。于是怅然慷慨，深愧平生之志。犹望一稔，当敛裳宵逝。寻程氏妹丧于武昌，情在骏奔，自免去职。仲秋至冬，在官八十余日。因事顺心，命篇曰《归去来兮》。乙巳岁十一月也。","归去来兮，田园将芜胡不归？既自以心为形役，奚惆怅而独悲？悟已往之不谏，知来者之可追。实迷途其未远，觉今是而昨非。舟遥遥以轻飏，风飘飘而吹衣。问征夫以前路，恨晨光之熹微。","乃瞻衡宇，载欣载奔。僮仆欢迎，稚子候门。三径就荒，松菊犹存。携幼入室，有酒盈樽。引壶觞以自酌，眄庭柯以怡颜。倚南窗以寄傲，审容膝之易安。园日涉以成趣，门虽设而常关。策扶老以流憩，时矫首而遐观。云无心以出岫，鸟倦飞而知还。景翳翳以将入，抚孤松而盘桓。","归去来兮，请息交以绝游。世与我而相违，复驾言兮焉求？悦亲戚之情话，乐琴书以消忧。农人告余以春及，将有事于西畴。或命巾车，或棹孤舟。既窈窕以寻壑，亦崎岖而经丘。木欣欣以向荣，泉涓涓而始流。善万物之得时，感吾生之行休。","已矣乎！寓形宇内复几时？曷不委心任去留？胡为乎遑遑欲何之？富贵非吾愿，帝乡不可期。怀良辰以孤往，或植杖而耘耔。登东皋以舒啸，临清流而赋诗。聊乘化以归尽，乐夫天命复奚疑！"]},{id:"zhongshu",title:"种树郭橐驼传",author:"柳宗元",era:"唐",book:"选择性必修下册",genre:"传记",stage:"高中",note:"「业」「其」「既然已」「勖」等实词，注意「虽」「而」的转折。",paragraphs:["郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之曰：“甚善。名我固当。”因舍其名，亦自谓“橐驼”云。","其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活；且硕茂，早实以蕃。他植者虽窥伺效慕，莫能如也。","有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然。根拳而土易，其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤。旦视而暮抚，已去而复顾。甚者，爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之；故不我若也。吾又何能为哉！","问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？","问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒也。"]},{id:"lingguan",title:"五代史伶官传序",author:"欧阳修",era:"北宋",book:"选择性必修中册",genre:"史论",stage:"高中",note:"「原」「盛」「遣」「抑」与「其」的指代，是本文核心考点。",paragraphs:["呜呼！盛衰之理，虽曰天命，岂非人事哉！原庄宗之所以得天下，与其所以失之者，可以知之矣。","世言晋王之将终也，以三矢赐庄宗而告之曰：“梁，吾仇也；燕王吾所立，契丹与吾约为兄弟，而皆背晋以归梁。此三者，吾遗恨也。与尔三矢，尔其无忘乃父之志！”庄宗受而藏之于庙。其后用兵，则遣从事以一少牢告庙，请其矢，盛以锦囊，负而前驱，及凯旋而纳之。","方其系燕父子以组，函梁君臣之首，入于太庙，还矢先王，而告以成功，其意气之盛，可谓壮哉！及仇雠已灭，天下已定，一夫夜呼，乱者四应，仓皇东出，未及见贼而士卒离散，君臣相顾，不知所归，至于誓天断发，泣下沾襟，何其衰也！岂得之难而失之易欤？抑本其成败之迹，而皆自于人欤？《书》曰：“满招损，谦得益。”忧劳可以兴国，逸豫可以亡身，自然之理也。","故方其盛也，举天下之豪杰，莫能与之争；及其衰也，数十伶人困之，而身死国灭，为天下笑。夫祸患常积于忽微，而智勇多困于所溺，岂独伶人也哉？"]},{id:"shizhongshan",title:"石钟山记",author:"苏轼",era:"北宋",book:"选择性必修下册",genre:"游记",stage:"高中",note:"「鼓」「是」「适」「盖」等实词辨析，是本文重点。",paragraphs:["《水经》云：“彭蠡之口有石钟山焉。”郦元以为下临深潭，微风鼓浪，水石相搏，声如洪钟。是说也，人常疑之。今以钟磬置水中，虽大风浪不能鸣也，而况石乎！至唐李渤始访其遗踪，得双石于潭上，扣而聆之，南声函胡，北音清越，桴止响腾，余韵徐歇。自以为得之矣。然是说也，余尤疑之。石之铿然有声者，所在皆是也，而此独以钟名，何哉？","元丰七年六月丁丑，余自齐安舟行适临汝，而长子迈将赴饶之德兴尉，送之至湖口，因得观所谓石钟者。寺僧使小童持斧，于乱石间择其一二扣之，硿硿焉。余固笑而不信也。至暮夜月明，独与迈乘小舟，至绝壁下。大石侧立千尺，如猛兽奇鬼，森然欲搏人；而山上栖鹘，闻人声亦惊起，磔磔云霄间；又有若老人咳且笑于山谷中者，或曰此鹳鹤也。余方心动欲还，而大声发于水上，噌吰如钟鼓不绝。舟人大恐。徐而察之，则山下皆石穴罅，不知其浅深，微波入焉，涵澹澎湃而为此也。舟回至两山间，将入港口，有大石当中流，可坐百人，空中而多窍，与风水相吞吐，有窾坎镗鞳之声，与向之噌吰者相应，如乐作焉。因笑谓迈曰：“汝识之乎？噌吰者，周景王之无射也；窾坎镗鞳者，魏庄子之歌钟也。古之人不余欺也！","事不目见耳闻，而臆断其有无，可乎？郦元之所见闻，殆与余同，而言之不详；士大夫终不肯以小舟夜泊绝壁之下，故莫能知；而渔工水师虽知而不能言。此世所以不传也。而陋者乃以斧斤考击而求之，自以为得其实。余是以记之，盖叹郦元之简，而笑李渤之陋也。"]},{id:"dengtaishan",title:"登泰山记",author:"姚鼐",era:"清",book:"必修上册",genre:"游记",stage:"高中",note:"「阴」「阳」「乘」「限」的地理义与「以」「于」的介词用法，是本文考点。",paragraphs:["泰山之阳，汶水西流；其阴，济水东流。阳谷皆入汶，阴谷皆入济。当其南北分者，古长城也。最高日观峰，在长城南十五里。","余以乾隆三十九年十二月，自京师乘风雪，历齐河、长清，穿泰山西北谷，越长城之限，至于泰安。是月丁未，与知府朱孝纯子颍由南麓登。四十五里，道皆砌石为磴，其级七千有余。泰山正南面有三谷。中谷绕泰安城下，郦道元所谓环水也。余始循以入，道少半，越中岭，复循西谷，遂至其巅。古时登山，循东谷入，道有天门。东谷者，古谓之天门溪水，余所不至也。今所经中岭及山巅，崖限当道者，世皆谓之天门云。道中迷雾冰滑，磴几不可登。及既上，苍山负雪，明烛天南。望晚日照城郭，汶水、徂徕如画，而半山居雾若带然。","戊申晦，五鼓，与子颍坐日观亭，待日出。大风扬积雪击面。亭东自足下皆云漫。稍见云中白若樗蒱数十立者，山也。极天云一线异色，须臾成五采。日上，正赤如丹，下有红光动摇承之，或曰，此东海也。回视日观以西峰，或得日或否，绛皓驳色，而皆若偻。","亭西有岱祠，又有碧霞元君祠。皇帝行宫在碧霞元君祠东。是日观道中石刻，自唐显庆以来；其远古刻尽漫失。僻不当道者，皆不及往。","山多石，少土。石苍黑色，多平方，少圜。少杂树，多松，生石罅，皆平顶。冰雪，无瀑水，无鸟兽音迹。至日观数里内无树，而雪与人膝齐。","桐城姚鼐记。"]},{id:"qihuanjinwen",title:"齐桓晋文之事",author:"孟子",era:"战国",book:"必修下册",genre:"对话",stage:"高中",note:"「爱」「辟」「莅」「度」等实词与「之」「以」的用法；「老吾老以及人之老」的活用是必考句。",paragraphs:["齐宣王问曰：“齐桓、晋文之事，可得闻乎？”","孟子对曰：“仲尼之徒无道桓文之事者，是以后世无传焉，臣未之闻也。无以，则王乎？”","曰：“德何如则可以王矣？”","曰：“保民而王，莫之能御也。”","曰：“若寡人者，可以保民乎哉？”","曰：“可。”","曰：“何由知吾可也？”","曰：“臣闻之胡龁曰：王坐于堂上，有牵牛而过堂下者，王见之，曰：‘牛何之？’对曰：‘将以衅钟。’王曰：‘舍之！吾不忍其觳觫，若无罪而就死地。’对曰：‘然则废衅钟与？’曰：‘何可废也？以羊易之！’——不识有诸？”","曰：“有之。”","曰：“是心足以王矣。百姓皆以王为爱也，臣固知王之不忍也。”","王曰：“然，诚有百姓者。齐国虽褊小，吾何爱一牛？即不忍其觳觫，若无罪而就死地，故以羊易之也。”","曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？王若隐其无罪而就死地，则牛羊何择焉？”","王笑曰：“是诚何心哉？我非爱其财而易之以羊也，宜乎百姓之谓我爱也。”","曰：“无伤也，是乃仁术也，见牛未见羊也。君子之于禽兽也，见其生，不忍见其死；闻其声，不忍食其肉。是以君子远庖厨也。”","王说，曰：“《诗》云：‘他人有心，予忖度之。’夫子之谓也。夫我乃行之，反而求之，不得吾心。夫子言之，于我心有戚戚焉。此心之所以合于王者，何也？”","曰：“有复于王者曰：‘吾力足以举百钧，而不足以举一羽；明足以察秋毫之末，而不见舆薪。’则王许之乎？”","曰：“否。”","“今恩足以及禽兽，而功不至于百姓者，独何与？然则一羽之不举，为不用力焉；舆薪之不见，为不用明焉；百姓之不见保，为不用恩焉。故王之不王，不为也，非不能也。”","曰：“不为者与不能者之形何以异？”","曰：“挟太山以超北海，语人曰‘我不能’，是诚不能也。为长者折枝，语人曰‘我不能’，是不为也，非不能也。故王之不王，非挟太山以超北海之类也；王之不王，是折枝之类也。老吾老，以及人之老；幼吾幼，以及人之幼：天下可运于掌。《诗》云：‘刑于寡妻，至于兄弟，以御于家邦。’言举斯心加诸彼而已。故推恩足以保四海，不推恩无以保妻子。古之人所以大过人者，无他焉，善推其所为而已矣。今恩足以及禽兽，而功不至于百姓者，独何与？权，然后知轻重；度，然后知长短。物皆然，心为甚。王请度之！”","“抑王兴甲兵，危士臣，构怨于诸侯，然后快于心与？”","王曰：“否，吾何快于是？将以求吾所大欲也。”","曰：“王之所大欲，可得闻与？”","王笑而不言。","曰：“为肥甘不足于口与？轻暖不足于体与？抑为采色不足视于目与？声音不足听于耳与？便嬖不足使令于前与？王之诸臣皆足以供之，而王岂为是哉？”","曰：“否，吾不为是也。”","曰：“然则王之所大欲可知已：欲辟土地，朝秦楚，莅中国而抚四夷也。以若所为，求若所欲，犹缘木而求鱼也。”","王曰：“若是其甚与？”","曰：“殆有甚焉。缘木求鱼，虽不得鱼，无后灾；以若所为，求若所欲，尽心力而为之，后必有灾。”","曰：“可得闻与？”","曰：“邹人与楚人战，则王以为孰胜？”","曰：“楚人胜。”","曰：“然则小固不可以敌大，寡固不可以敌众，弱固不可以敌强。海内之地，方千里者九，齐集有其一。以一服八，何以异于邹敌楚哉？盖亦反其本矣。今王发政施仁，使天下仕者皆欲立于王之朝，耕者皆欲耕于王之野，商贾皆欲藏于王之市，行旅皆欲出于王之涂，天下之欲疾其君者皆欲赴愬于王。其若是，孰能御之？”","王曰：“吾惛，不能进于是矣。愿夫子辅吾志，明以教我。我虽不敏，请尝试之。”","曰：“无恒产而有恒心者，惟士为能。若民，则无恒产，因无恒心。苟无恒心，放辟邪侈，无不为已。及陷于罪，然后从而刑之，是罔民也。焉有仁人在位，罔民而可为也？是故明君制民之产，必使仰足以事父母，俯足以畜妻子，乐岁终身饱，凶年免于死亡；然后驱而之善，故民之从之也轻。今也制民之产，仰不足以事父母，俯不足以畜妻子，乐岁终身苦，凶年不免于死亡。此惟救死而恐不赡，奚暇治礼义哉？王欲行之，则盍反其本矣：五亩之宅，树之以桑，五十者可以衣帛矣；鸡、豚、狗、彘之畜，无失其时，七十者可以食肉矣；百亩之田，勿夺其时，八口之家可以无饥矣；谨庠序之教，申之以孝悌之义，颁白者不负戴于道路矣。老者衣帛食肉，黎民不饥不寒，然而不王者，未之有也。”"]},{id:"paoding",title:"庖丁解牛",author:"庄子",era:"战国",book:"必修下册",genre:"寓言",stage:"高中",note:"「技」「道」「族」「为」的用法，「乎」「然」等虚词；「依乎天理」「因其固然」是翻译常考句。",paragraphs:["庖丁为文惠君解牛，手之所触，肩之所倚，足之所履，膝之所踦，砉然向然，奏刀騞然，莫不中音。合于《桑林》之舞，乃中《经首》之会。","文惠君曰：“嘻，善哉！技盖至此乎？”","庖丁释刀对曰：“臣之所好者道也，进乎技矣。始臣之解牛之时，所见无非牛者。三年之后，未尝见全牛也。方今之时，臣以神遇而不以目视，官知止而神欲行。依乎天理，批大郤，导大窾，因其固然，技经肯綮之未尝，而况大軱乎！良庖岁更刀，割也；族庖月更刀，折也。今臣之刀十九年矣，所解数千牛矣，而刀刃若新发于硎。彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣，是以十九年而刀刃若新发于硎。虽然，每至于族，吾见其难为，怵然为戒，视为止，行为迟。动刀甚微，謋然已解，如土委地。提刀而立，为之四顾，为之踌躇满志，善刀而藏之。”","文惠君曰：“善哉！吾闻庖丁之言，得养生焉。”"]},{id:"zhuzhiwu",title:"烛之武退秦师",author:"《左传》",era:"春秋",book:"必修下册",genre:"史传",stage:"高中",note:"「鄙」「陪」「肆」「济」等实词，以及「以」「而」的连词用法；「越国以鄙远」「共其乏困」是重点句。",paragraphs:["晋侯、秦伯围郑，以其无礼于晋，且贰于楚也。晋军函陵，秦军氾南。","佚之狐言于郑伯曰：“国危矣，若使烛之武见秦君，师必退。”公从之。辞曰：“臣之壮也，犹不如人；今老矣，无能为也已。”公曰：“吾不能早用子，今急而求子，是寡人之过也。然郑亡，子亦有不利焉。”许之。","夜缒而出，见秦伯，曰：“秦、晋围郑，郑既知亡矣。若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也，焉用亡郑以陪邻？邻之厚，君之薄也。若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所知也。夫晋，何厌之有？既东封郑，又欲肆其西封，若不阙秦，将焉取之？阙秦以利晋，唯君图之。”秦伯说，与郑人盟。使杞子、逢孙、杨孙戍之，乃还。","子犯请击之。公曰：“不可。微夫人之力不及此。因人之力而敝之，不仁；失其所与，不知；以乱易整，不武。吾其还也。”亦去之。"]},{id:"hongmenyan",title:"鸿门宴",author:"司马迁",era:"西汉",book:"必修下册",genre:"史传",stage:"高中",note:"「军」「王」「幸」「谢」等活用与「为」「以」的介词；「为之奈何」「何辞为」是虚词高频句。",paragraphs:["沛公军霸上，未得与项羽相见。沛公左司马曹无伤使人言于项羽曰：“沛公欲王关中，使子婴为相，珍宝尽有之。”项羽大怒曰：“旦日飨士卒，为击破沛公军！”当是时，项羽兵四十万，在新丰鸿门；沛公兵十万，在霸上。范增说项羽曰：“沛公居山东时，贪于财货，好美姬。今入关，财物无所取，妇女无所幸，此其志不在小。吾令人望其气，皆为龙虎，成五采，此天子气也。急击勿失！”","楚左尹项伯者，项羽季父也，素善留侯张良。张良是时从沛公，项伯乃夜驰之沛公军，私见张良，具告以事，欲呼张良与俱去，曰：“毋从俱死也。”张良曰：“臣为韩王送沛公，沛公今事有急，亡去不义，不可不语。”良乃入，具告沛公。沛公大惊，曰：“为之奈何？”张良曰：“谁为大王为此计者？”曰：“鲰生说我曰：‘距关，毋内诸侯，秦地可尽王也。’故听之。”良曰：“料大王士卒足以当项王乎？”沛公默然，曰：“固不如也。且为之奈何？”张良曰：“请往谓项伯，言沛公不敢背项王也。”沛公曰：“君安与项伯有故？”张良曰：“秦时与臣游，项伯杀人，臣活之；今事有急，故幸来告良。”沛公曰：“孰与君少长？”良曰：“长于臣。”沛公曰：“君为我呼入，吾得兄事之。”张良出，要项伯。项伯即入见沛公。沛公奉卮酒为寿，约为婚姻，曰：“吾入关，秋毫不敢有所近，籍吏民，封府库，而待将军。所以遣将守关者，备他盗之出入与非常也。日夜望将军至，岂敢反乎！愿伯具言臣之不敢倍德也。”项伯许诺，谓沛公曰：“旦日不可不蚤自来谢项王。”沛公曰：“诺。”于是项伯复夜去，至军中，具以沛公言报项王。因言曰：“沛公不先破关中，公岂敢入乎？今人有大功而击之，不义也。不如因善遇之。”项王许诺。","沛公旦日从百余骑来见项王，至鸿门，谢曰：“臣与将军戮力而攻秦，将军战河北，臣战河南，然不自意能先入关破秦，得复见将军于此。今者有小人之言，令将军与臣有郤。”项王曰：“此沛公左司马曹无伤言之。不然，籍何以至此？”项王即日因留沛公与饮。项王、项伯东向坐；亚父南向坐，——亚父者，范增也；沛公北向坐；张良西向侍。范增数目项王，举所佩玉玦以示之者三，项王默然不应。范增起，出，召项庄，谓曰：“君王为人不忍。若入前为寿，寿毕，请以剑舞，因击沛公于坐，杀之。不者，若属皆且为所虏！”庄则入为寿。寿毕，曰：“君王与沛公饮，军中无以为乐，请以剑舞。”项王曰：“诺。”项庄拔剑起舞。项伯亦拔剑起舞，常以身翼蔽沛公，庄不得击。","于是张良至军门见樊哙。樊哙曰：“今日之事何如？”良曰：“甚急！今者项庄拔剑舞，其意常在沛公也。”哙曰：“此迫矣！臣请入，与之同命。”哙即带剑拥盾入军门。交戟之卫士欲止不内。樊哙侧其盾以撞，卫士仆地。哙遂入，披帷西向立，瞋目视项王，头发上指，目眦尽裂。项王按剑而跽曰：“客何为者？”张良曰：“沛公之参乘樊哙者也。”项王曰：“壮士！——赐之卮酒。”则与斗卮酒。哙拜谢，起，立而饮之。项王曰：“赐之彘肩。”则与一生彘肩。樊哙覆其盾于地，加彘肩上，拔剑切而啖之。项王曰：“壮士！能复饮乎？”樊哙曰：“臣死且不避，卮酒安足辞！夫秦王有虎狼之心，杀人如不能举，刑人如恐不胜，天下皆叛之。怀王与诸将约曰：‘先破秦入咸阳者王之。’今沛公先破秦入咸阳，毫毛不敢有所近，封闭宫室，还军霸上，以待大王来。故遣将守关者，备他盗出入与非常也。劳苦而功高如此，未有封侯之赏，而听细说，欲诛有功之人，此亡秦之续耳。窃为大王不取也！”项王未有以应，曰：“坐。”樊哙从良坐。坐须臾，沛公起如厕，因招樊哙出。","沛公已出，项王使都尉陈平召沛公。沛公曰：“今者出，未辞也，为之奈何？”樊哙曰：“大行不顾细谨，大礼不辞小让。如今人方为刀俎，我为鱼肉，何辞为？”于是遂去。乃令张良留谢。良问曰：“大王来何操？”曰：“我持白璧一双，欲献项王，玉斗一双，欲与亚父。会其怒，不敢献。公为我献之。”张良曰：“谨诺。”当是时，项王军在鸿门下，沛公军在霸上，相去四十里。沛公则置车骑，脱身独骑，与樊哙、夏侯婴、靳强、纪信等四人持剑盾步走，从郦山下，道芷阳间行。沛公谓张良曰：“从此道至吾军，不过二十里耳。度我至军中，公乃入。”","沛公已去，间至军中。张良入谢，曰：“沛公不胜杯杓，不能辞。谨使臣良奉白璧一双，再拜献大王足下，玉斗一双，再拜奉大将军足下。”项王曰：“沛公安在？”良曰：“闻大王有意督过之，脱身独去，已至军矣。”项王则受璧，置之坐上。亚父受玉斗，置之地，拔剑撞而破之，曰：“唉！竖子不足与谋！夺项王天下者必沛公也。吾属今为之虏矣！”","沛公至军，立诛杀曹无伤。"]},{id:"daxue",title:"大学之道",author:"《礼记》",era:"战国",book:"选择性必修上册",genre:"论说文",stage:"高中",note:"「明明德」「止于至善」的「明」「止」与「于」；「壹是皆以修身为本」是翻译常考句。",paragraphs:["大学之道，在明明德，在亲民，在止于至善。知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。物有本末，事有终始。知所先后，则近道矣。","古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知；致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。自天子以至于庶人，壹是皆以修身为本。其本乱而末治者否矣。其所厚者薄，而其所薄者厚，未之有也。"]},{id:"burenrenzhixin",title:"人皆有不忍人之心",author:"孟子",era:"战国",book:"选择性必修上册",genre:"论说文",stage:"高中",note:"「乍」「要」「恶」「辞让」等实词与「之」取消句子独立性；「非所以内交于孺子之父母也」是重点句。",paragraphs:["孟子曰：“人皆有不忍人之心。先王有不忍人之心，斯有不忍人之政矣；以不忍人之心，行不忍人之政，治天下可运之掌上。所以谓人皆有不忍人之心者：今人乍见孺子将入于井，皆有怵惕恻隐之心；非所以内交于孺子之父母也，非所以要誉于乡党朋友也，非恶其声而然也。由是观之，无恻隐之心，非人也；无羞恶之心，非人也；无辞让之心，非人也；无是非之心，非人也。恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也。人之有是四端也，犹其有四体也。有是四端而自谓不能者，自贼者也；谓其君不能者，贼其君者也。凡有四端于我者，知皆扩而充之矣，若火之始然，泉之始达。苟能充之，足以保四海；苟不充之，不足以事父母。”"]},{id:"laozi4",title:"《老子》四章",author:"老子",era:"春秋",book:"选择性必修上册",genre:"语录体",stage:"高中",note:"「有」「无」「以为」的用法与「其」的指代；「自见者不明」「知人者智」是理解性默写高频句。",paragraphs:["三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。凿户牖以为室，当其无，有室之用。故有之以为利，无之以为用。","古之善为士者，微妙玄通，深不可识。夫唯不可识，故强为之容：豫兮若冬涉川，犹兮若畏四邻，俨兮其若客，涣兮若冰之将释，敦兮其若朴，旷兮其若谷，混兮其若浊。孰能浊以静之徐清？孰能安以动之徐生？保此道者不欲盈。夫唯不盈，故能蔽而新成。","企者不立，跨者不行，自见者不明，自是者不彰，自伐者无功，自矜者不长。其在道也，曰余食赘行。物或恶之，故有道者不处。","知人者智，自知者明。胜人者有力，自胜者强。知足者富，强行者有志。不失其所者久，死而不亡者寿。"]},{id:"wushizhihu",title:"五石之瓠",author:"庄子",era:"战国",book:"选择性必修上册",genre:"寓言",stage:"高中",note:"「树」「落」「呺然」「虑」等实词与「以」的用法；「夫子固拙于用大矣」「则所用之异也」是翻译常考句。",paragraphs:["惠子谓庄子曰：“魏王贻我大瓠之种，我树之成而实五石。以盛水浆，其坚不能自举也。剖之以为瓢，则瓠落无所容。非不呺然大也，吾为其无用而掊之。”庄子曰：“夫子固拙于用大矣。宋人有善为不龟手之药者，世世以洴澼絖为事。客闻之，请买其方百金。聚族而谋曰：‘我世世为洴澼絖，不过数金；今一朝而鬻技百金，请与之。’客得之，以说吴王。越有难，吴王使之将。冬，与越人水战，大败越人，裂地而封之。能不龟手一也，或以封，或不免于洴澼絖，则所用之异也。今子有五石之瓠，何不虑以为大樽而浮乎江湖，而忧其瓠落无所容？则夫子犹有蓬之心也夫！”"]},{id:"jianai",title:"兼爱",author:"墨子",era:"战国",book:"选择性必修上册",genre:"论说文",stage:"高中",note:"「攻」「亏」「慈」「劝」等实词与「之所以」结构；「当察乱何自起」「恶得不禁恶而劝爱」是重点句。",paragraphs:["圣人以治天下为事者也，必知乱之所自起，焉能治之；不知乱之所自起，则不能治。譬之如医之攻人之疾者然，必知疾之所自起，焉能攻之；不知疾之所自起，则弗能攻。治乱者何独不然？必知乱之所自起，焉能治之；不知乱之所自起，则弗能治。","圣人以治天下为事者也，不可不察乱之所自起。当察乱何自起？起不相爱。臣子之不孝君父，所谓乱也。子自爱，不爱父，故亏父而自利；弟自爱，不爱兄，故亏兄而自利；臣自爱，不爱君，故亏君而自利。此所谓乱也。虽父之不慈子，兄之不慈弟，君之不慈臣，此亦天下之所谓乱也。父自爱也，不爱子，故亏子而自利；兄自爱也，不爱弟，故亏弟而自利；君自爱也，不爱臣，故亏臣而自利。是何也？皆起不相爱。虽至天下之为盗贼者，亦然。盗爱其室，不爱其异室，故窃异室以利其室；贼爱其身，不爱人，故贼人以利其身。此何也？皆起不相爱。虽至大夫之相乱家、诸侯之相攻国者，亦然。大夫各爱其家，不爱异家，故乱异家以利其家；诸侯各爱其国，不爱异国，故攻异国以利其国。天下之乱物，具此而已矣。","察此何自起？皆起不相爱。若使天下兼相爱，爱人若爱其身，犹有不孝者乎？视父兄与君若其身，恶施不孝？犹有不慈者乎？视弟子与臣若其身，恶施不慈？故不孝不慈亡。犹有盗贼乎？视人之室若其室，谁窃？视人身若其身，谁贼？故盗贼有亡。犹有大夫之相乱家、诸侯之相攻国者乎？视人家若其家，谁乱？视人国若其国，谁攻？故大夫之相乱家、诸侯之相攻国者有亡。若使天下兼相爱，国与国不相攻，家与家不相乱，盗贼无有，君臣父子皆能孝慈，若此则天下治。","故圣人以治天下为事者，恶得不禁恶而劝爱？故天下兼相爱则治，交相恶则乱。故子墨子曰不可以不劝爱人者，此也。"]},{id:"suwuzhuan",title:"苏武传",author:"班固",era:"东汉",book:"选择性必修中册",genre:"史传（节选）",stage:"高中",note:"「使」「当」「坐」「见」等实词与「为」的被动用法；「见犯乃死，重负国」「何以汝为见」是翻译常考句。",paragraphs:["武字子卿，少以父任，兄弟并为郎。稍迁至栘中厩监。时汉连伐胡，数通使相窥观。匈奴留汉使郭吉、路充国等，前后十余辈。匈奴使来，汉亦留之以相当。天汉元年，且鞮侯单于初立，恐汉袭之，乃曰：“汉天子我丈人行也。”尽归汉使路充国等。武帝嘉其义，乃遣武以中郎将使持节送匈奴使留在汉者，因厚赂单于，答其善意。","武与副中郎将张胜及假吏常惠等募士斥候百余人俱。既至匈奴，置币遗单于。单于益骄，非汉所望也。方欲发使送武等，会缑王与长水虞常等谋反匈奴中。缑王者，昆邪王姊子也，与昆邪王俱降汉，后随浞野侯没胡中。及卫律所将降者，阴相与谋劫单于母阏氏归汉。会武等至匈奴，虞常在汉时素与副张胜相知，私候胜曰：“闻汉天子甚怨卫律，常能为汉伏弩射杀之。吾母与弟在汉，幸蒙其赏赐。”张胜许之，以货物与常。","后月余，单于出猎，独阏氏子弟在。虞常等七十余人欲发，其一人夜亡，告之。单于子弟发兵与战。缑王等皆死，虞常生得。单于使卫律治其事。张胜闻之，恐前语发，以状语武。武曰：“事如此，此必及我。见犯乃死，重负国。”欲自杀，胜、惠共止之。虞常果引张胜。单于怒，召诸贵人议，欲杀汉使者。左伊秩訾曰：“即谋单于，何以复加？宜皆降之。”","单于使卫律召武受辞，武谓惠等：“屈节辱命，虽生，何面目以归汉！”引佩刀自刺。卫律惊，自抱持武，驰召医。凿地为坎，置煴火，覆武其上，蹈其背以出血。武气绝，半日复息。惠等哭，舆归营。单于壮其节，朝夕遣人候问武，而收系张胜。","武益愈，单于使使晓武，会论虞常，欲因此时降武。剑斩虞常已，律曰：“汉使张胜谋杀单于近臣，当死。单于募降者赦罪。”举剑欲击之，胜请降。律谓武曰：“副有罪，当相坐。”武曰：“本无谋，又非亲属，何谓相坐？”复举剑拟之，武不动。律曰：“苏君，律前负汉归匈奴，幸蒙大恩，赐号称王，拥众数万，马畜弥山，富贵如此！苏君今日降，明日复然。空以身膏草野，谁复知之！”武不应。律曰：“君因我降，与君为兄弟；今不听吾计，后虽复欲见我，尚可得乎？”武骂律曰：“汝为人臣子，不顾恩义，畔主背亲，为降虏于蛮夷，何以汝为见！且单于信汝，使决人死生，不平心持正，反欲斗两主，观祸败。若知我不降明，欲令两国相攻，匈奴之祸，从我始矣。”","律知武终不可胁，白单于。单于愈益欲降之。乃幽武置大窖中，绝不饮食。天雨雪，武卧啮雪，与旃毛并咽之，数日不死。匈奴以为神，乃徙武北海上无人处，使牧羝，羝乳乃得归。别其官属常惠等各置他所。","武既至海上，廪食不至，掘野鼠去草实而食之。杖汉节牧羊，卧起操持，节旄尽落。积五六年，单于弟於靬王弋射海上。武能网纺缴，檠弓弩，於靬王爱之，给其衣食。三岁余，王病，赐武马畜、服匿、穹庐。王死后，人众徙去。其冬，丁令盗武牛羊，武复穷厄。"]},{id:"lanting",title:"兰亭集序",author:"王羲之",era:"东晋",book:"选择性必修下册",genre:"序",stage:"高中",note:"「修」「期」「致」「临」等实词与「之」「于」的用法；「所以游目骋怀」「不能喻之于怀」是重点句。",paragraphs:["永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。群贤毕至，少长咸集。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。","是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。","夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至；及其所之既倦，情随事迁，感慨系之矣。向之所欣，俯仰之间，已为陈迹，犹不能不以之兴怀，况修短随化，终期于尽！古人云：“死生亦大矣。”岂不痛哉！","每览昔人兴感之由，若合一契，未尝不临文嗟悼，不能喻之于怀。固知一死生为虚诞，齐彭殇为妄作。后之视今，亦犹今之视昔，悲夫！故列叙时人，录其所述，虽世殊事异，所以兴怀，其致一也。后之览者，亦将有感于斯文。"]}].concat(Gh,Lh).filter(function(o,f,d){return d.findIndex(function(c){return c.title===o.title})===f}),jc={"zhi-s1":"不作句子成分","zhi-s2":"宾语","zhi-s3":"不作句子成分","zhi-s4":"不作句子成分","qi-s1":"定语","qi-s2":"定语","qi-s3":"状语","er-s5":"定语","hu-s3":"不作句子成分","nai-s3":"定语","ruo-s1":"主语","yan-s1":"状语","yan-s3":"状语","he-s1":"宾语","an-s2":"状语","dao-s1":"宾语","gu-s3":"宾语","wang-s1":"主语","ben-s1":"宾语","bi-s1":"主语","bing2-s1":"宾语","chao-s1":"状语","chao-s3":"宾语","cheng-s3":"定语","cheng2-s3":"宾语","chu-s1":"宾语","ci-s1":"宾语","du-s1":"宾语","gai-s1":"宾语","guo-s1":"宾语","guo-s2":"主语","hu2-s2":"主语","huan-s2":"主语","ji-s1":"宾语","jian-s1":"宾语","lei-s2":"宾语","nei-s1":"状语","qi2-s2":"定语","qi3-s1":"宾语","shu-s1":"主语","shu3-s1":"谓语","shu4-s3":"主语","su-s2":"宾语","tang-s1":"宾语","ti-s1":"主语","ti-s2":"主语","wang3-s2":"主语","xin-s2":"宾语","xing-s2":"主语","xing2-s2":"宾语","yang-s1":"主语","yin2-s1":"主语","you-s1":"宾语","zhi3-s3":"主语","zhi4-s2":"主语","zei-s1":"谓语","zu-s2":"主语","zuo-s1":"宾语","ye2-s1":"主语","huo-s1":"主语","mo-s1":"主语","shi3-s1":"主语","shu2-s1":"主语","e-s2":"状语","
